      $t`The Italian engine screamed through three counties. A trucker flashed his lights at you. You flashed yours back. Then you were gone.`],
    none:[$t`You crossed the border on a Greyhound bus with a duffel bag of cash and a fake mustache. Somehow, it worked.`,
      $t`You drove south for nineteen hours with the radio off and the cash in a picnic cooler.`,
      $t`You bought a rusty pickup for cash at a truck stop and drove until the road signs changed language.`],
  };
  const FAIL={
    jet:[$t`The jet never got clearance. Agents were waiting on the tarmac with coffee.`,$t`Your pilot had made a deal with the FBI. He landed the jet right back in ${CITY}.`,
      $t`The jet sat on the runway for forty minutes, "waiting for a slot." You knew before the door opened.`],
    yacht:[$t`The coast guard boarded your yacht eleven miles out. You were wearing a captain's hat.`,$t`The yacht ran out of fuel within sight of the shore. Nobody had checked.`,
      $t`A harbor patrol boat was waiting at the mouth of the marina, lights off, engine idling.`],
    passport:[$t`The passport was good. The photo wasn't. The border agent compared it to the poster on her wall.`,$t`You forgot your new name at passport control. Twice.`,
      $t`The gate agent smiled, said "One moment, Mr. Delacroix," and picked up a phone.`],
    car:[$t`A roadblock at the county line. The sports car was easy to spot. It's the only red one in the state.`,$t`You hit a speed trap doing a hundred and forty. The trooper recognized you from the news.`],
    none:[$t`You were arrested at a gas station forty miles from the border, paying cash for beef jerky.`,$t`You missed your flight by four minutes. The agents didn't.`,
      $t`A state trooper pulled you over for a broken taillight. Then he looked at the duffel bag on the passenger seat.`],
  };
  let scene;
  if(esc){
    scene=how==="raid"?(s.prep.jet?pick([$t`Agents came through the front door as you went out the back. Your jet left the runway ninety seconds before the airport was shut down.`,$t`You heard the sirens from the hangar. The wheels were already up.`])
      :pick([$t`You went down the fire escape as agents came up the stairs, flagged a cab, and made the last flight out with a gym bag full of cash.`,$t`You climbed out the bathroom window, dropped into the dumpster behind the building, and walked to the bus station smelling like old lettuce. Worth it.`]))
      :(how==="collapse"?pick([$t("With investors pounding on the front door, you slipped out through the noodle shop next door. "),$t("The lobby was full of screaming investors. You went out through the parking garage in a janitor's jacket. ")]):"")+pick(ESC[m]||ESC.none);
  }else if(kind==="failed"){
    scene=how==="raid"?(s.prep.jet?$t`You made it to the hangar. So did the FBI.`:pick([$t`You made it down the fire escape. Two agents were waiting in the alley, eating sandwiches.`,$t`The fire escape ended one floor short. You hung there until the agents brought a ladder.`]))
      :(how==="collapse"?$t("You ran the night the fund collapsed, with half the city looking for you. "):"")+pick(FAIL[m]||FAIL.none);
  }else if(how==="surrender"){
    scene=pick([$t`Agents filled the lobby. You straightened your tie, put your hands up and asked for a lawyer.`,$t`You met them at the elevator with your coat on. "Let's not make a scene," you said. They made a scene anyway.`]);
  }else if(how==="tooslow"){
    scene=pick([$t`You were still stuffing cash into a gym bag when the elevator doors opened.`,$t`You were halfway down the stairs when you heard them coming up.`,$t`You had one shoe on and the car keys in your teeth when they kicked the door in.`]);
  }else if(how==="froze"){
    scene=pick([$t`You heard them on the stairs and froze. You were still standing at the window, watching the street, when they came in.`,$t`Your legs wouldn't move. You sat back down at your desk and waited. It took them four minutes.`]);
  }else{
    scene=pick([$t`Agents knocked at 6 a.m. You answered in a bathrobe that cost more than most people's rent.`,
      $t`They arrested you in the middle of a seminar, in front of two hundred potential investors. Three of them still asked for your card.`,
      $t`Agents walked into your office while you were on the phone promising someone "nothing but upside."`,
      $t`They picked you up at the car wash. Your car was half rinsed.`,
      $t`They waited until you'd finished your steak at the club. One of them picked up the check. It was the only thing anyone ever paid you back.`,
      $t`The arrest was on the evening news. You'd never looked so tired, or so tan.`]);
  }
  if(s.week<=6)scene+=" "+pick([$t`The whole thing lasted ${s.week} months. Historians still argue over whether it counts as a scheme or a long weekend.`,
    $t`It lasted ${s.week} months. Most frauds take longer to set up.`,$t`${s.week} months, start to finish. The FBI's paperwork took longer.`]);
  out.push([$t("The end"),scene]);

  // Your new life, or prison
  if(esc){
    let life=kept<50e3?pick([$t`You got away with ${fmt(kept)}. It lasted fourteen months. Now you tend bar in a beach town under a name you keep forgetting.`,
        $t`${fmt(kept)} doesn't go far. You rent a room above a laundromat and give tennis lessons you're not qualified to give.`])
      :kept<500e3?pick([$t`${fmt(kept)} bought a small café by the sea. The coffee is bad. Nobody asks questions.`,$t`With ${fmt(kept)}, you opened a surf shop. You can't surf. Business is fine.`])
      :kept<5e6?pick([$t`${fmt(kept)} bought a house on a hill, a new nose, and a golden retriever named Dividend.`,$t`${fmt(kept)} bought a vineyard. The wine is terrible. You drink it anyway, every afternoon, on the porch.`])
      :kept<50e6?pick([$t`${fmt(kept)} goes a long way in a country with no extradition treaty. You bought the local football club. The stadium carries your new name.`,
        $t`With ${fmt(kept)}, you live in a walled villa with a pool shaped like a dollar sign. The locals call you "the Canadian."`])
      :pick([$t`With ${fmt(kept)}, you bought an island. Then a second island, to keep an eye on the first.`,$t`${fmt(kept)}. You stopped counting. You started a foundation in your new name. It gives money to journalism schools, as a joke only you get.`]);
    if(frozen>0)life+=$t` Another ${fmt(frozen)} was frozen by a bank that suddenly remembered its compliance rules.`;
    if(!s.prep.villa&&!L.island)life+=" "+pick([$t`You never set up a safe home, so you move every few months and never unpack.`,$t`With no safe house, you sleep in a different bed every month. You keep a bag packed by the door.`]);
    out.push([$t("Your new life"),life]);
  }else{
    let fate=s.prep.shells?$t`Your shell companies kept investigators busy for years. They clawed back ${fmt(s.stash*0.3)} of your ${fmt(s.stash)} stash.`
      :s.stash>0?pick([$t`Investigators found your offshore stash in a month. All ${fmt(s.stash)} of it.`,$t`The ${fmt(s.stash)} you skimmed was found in an account with your dog's name as the password.`])
      :$t`There was no stash. You never kept a dollar for yourself. Prosecutors found that the most confusing part of the case.`;
    fate+=$t` The judge gave you ${yrs} years.`+(yrs>=100?" "+pick([$t`The judge said the number was symbolic. It doesn't feel symbolic.`,$t`Your lawyer did the math on a napkin and stopped talking.`])
      :yrs<=15?$t` You'll be out before your hair goes fully gray.`:"");
    fate+=" "+pick([$t`You run the prison's commissary black market now. Old habits.`,
      $t`You teach a personal finance class to the other inmates. You're the only one who finds it funny.`,
      $t`You wrote a memoir in your cell. The royalties go to your victims.`,
      $t`Your cellmate gave you his commissary money to invest. He keeps asking about returns.`,
      $t`You started a book club. Every pick is about a heist. The warden asked you to stop.`,
      $t`You work in the prison laundry. You've never been this honest, and you've never been this bored.`,
      $t`The other inmates call you "the Banker." Two of them owe you cigarettes. You charge interest.`,
      $t`You get one hour in the yard a day. You spend it pacing, doing math on money you'll never see.`]);
    out.push([$t("Prison"),fate]);
  }

  // The investors
  if(s.peakInv>0){
    const rec=esc?Math.round(rand(5,25)):Math.round(rand(30,60));
    let t=s.peakInv<25?pick([$t`Only ${num(s.peakInv)} people lost money, and most of them were friends. Thanksgiving is canceled indefinitely.`,$t`${num(s.peakInv)} people lost money. You know all of them by name. They know you by a different one now.`])
      :pick([$t`${num(s.peakInv)} people believed in ${FUND}. A court-appointed trustee spent nine years recovering ${rec}% of the ${fmt(s.peakOwed)} they thought they had.`,
        $t`The trustee's final report ran to 2,300 pages. ${num(s.peakInv)} investors got back ${rec} cents on the dollar.`,
        $t`${num(s.peakInv)} investors filed claims. The trustee called it "the largest pile of hope and paperwork in ${CITY}'s history." They got back ${rec}%.`]);
    const vig=[$t`Edna Fisk, a retired schoolteacher, lost the house she paid off in 1998.`,
      $t`Carl Ruiz, a dentist, had put in his kids' college fund. He gives talks on warning signs now.`,
      $t`Walt Brennan, a fisherman, lost his late wife's life insurance money.`,
      $t`Maria Delgado had remortgaged her bakery to "double down." It's a vape shop now.`,
      $t`Ruth Abernathy, a nurse, had talked six coworkers into investing. Five still aren't speaking to her.`,
      $t`Sunil Mehta had invested his lottery winnings. He says he's "technically back where he started."`,
      $t`The Ashford Otters' Little League lost its uniform fund. The kids played the season in plain white T-shirts.`,
      $t`A retired firefighter named Dale Okafor drove four hours to every hearing. He sat in the front row and never said a word.`,
      $t`Twins Patty and Pam Lindqvist each invested without telling the other. They found out at the same creditors' meeting.`,
      $t`A widower named Ernest Pruitt framed his last account statement. "So I remember to read the fine print," he said.`];
    if(flag(s,$t("A church group wants to invest"))===0)vig.push($t`Pastor Hollis's congregation lost the new-roof fund. That Sunday's sermon was about forgiveness. It was short.`);
    if(s.peakInv>=25)t+=" "+shuffle(vig.slice()).slice(0,Math.random()<0.5?1:2).join(" ");
    const mom=flag(s,$t("Your mom wants to invest"));
    if(mom===0)t+=$t` Your mother lost her retirement savings. She still sends a birthday card every year. It's blank inside.`;
    else if(mom===1)t+=$t` Your mother, the one person you wouldn't take money from, told reporters you "had one decent bone."`;
    if(flag(s,$t("A retired prosecutor wants in"))===0)t+=$t` The retired prosecutor who invested with you came out of retirement to lead the case.`;
    out.push([$t("The investors"),t]);
  }

  // Optional sections. Each ending draws a different few.
  const extra=[];
  if(!esc)extra.push([$t("The trial"),[
      pick([$t`The prosecutor opened by reading your old ${FUND} brochure aloud. The jury laughed in all the wrong places.`,
        $t`The trial lasted six weeks. Your lawyer's best argument was that the investors "should have known." It didn't land.`,
        $t`Your defense called one witness: you. It was a mistake you made with total confidence.`,
        $t`The courtroom sketch artist drew you smirking. You weren't, but the sketch went viral anyway.`]),
      s.grabbed?$t`Exhibit 1 was a gym bag with ${fmt(s.grabbed)} in it.`:s.parties?$t`The jury saw photos from ${s.parties} of your parties on the water. One juror asked for copies.`:(s.hush||[]).length?$t`${s.hush[0].who} testified about the "consulting fees." In detail.`:$t`The jury saw a chart of your returns. It was a perfectly straight line. That was the whole case.`,
      pick([$t`The jury deliberated for forty minutes, including lunch.`,$t`The jury took two days. You later learned one juror held out because he liked your suits.`,$t`The verdict took less time than reading the charges.`])].join(" ")]);
  if(s.named&&s.named.length){
    const first=s.named[0], big=s.biggest;
    let w=$t`${first}, your very first investor, `+pick([$t`still has the welcome letter you signed. It hangs in their bathroom.`,$t`testified that you "seemed so sure." That was the problem.`,$t`started a support group for your investors. It meets in the room where you used to hold seminars.`,$t`now runs a podcast about financial fraud. You're episodes one through nine.`]);
    if(big&&big.name!==first)w+=$t` ${big.name}, who handed you ${fmt(big.dep)} in a single afternoon, `+pick([$t`wants you to know they're "fine." Their lawyer says otherwise.`,$t`moved in with their adult children. Everyone is coping.`,$t`sued the bank, the auditor, and the Little League. They won against the bank.`,$t`still has the pen you signed with. They use it to sign checks they can actually cash.`]);
    extra.push([$t("Where are they now"),w]);
  }
  extra.push([$t("The story"),pick([
    $t`A streaming service made an eight-part series about you called "${pick([$t("Steady Returns"),$t("The Closer"),$t("Too Good To Be True"),$t("Evergreen")])}." The actor who played you won an award. Critics said he was "too likable."`,
    $t`A true-crime podcast spent eleven episodes on ${FUND}. The host's verdict: "${pick([$t("Charming. Terrifying. Kind of impressive."),$t("A ${R} with excellent posture."),$t("The best liar this town ever produced.")]).replace("${R}",R)}"`,
    $t`The Ledger's reporter wrote a book about you. The cover is your face, in gold foil. It sells best at airports.`,
    $t`Business schools teach your case now. Students are graded on spotting the warning signs. Most of them miss at least three.`,
    $t`Someone made a board game about ${FUND}. Nobody ever wins it. That's the point.`])]);
  const toys=[];
  for(const it of LIFE.filter(x=>!x.repeat&&owned[x.id])){
    const lost=!L[it.id]&&!(it.id==="watch"&&s.pawned);
    toys.push(it.id==="watch"?(s.pawned?$t`You pawned the gold watch on your way out of town for twenty grand. The pawnbroker knew exactly who you were.`:esc?$t`You still wear the gold watch. It stopped working years ago. You wear it anyway.`:$t`The gold watch went into an evidence bag. You watched them write "1 watch, gold, gaudy" on the label.`)
      :it.id==="car"?(lost?$t`The bank repossessed your sports car before the feds could. Nobody was surprised.`:esc?$t`Your sports car was found at the airport in a no-parking zone, engine still warm.`:$t`Your sports car was auctioned. The winning bid came from one of your investors.`)
      :it.id==="yacht"?(lost?$t`The yacht was seized at the marina for unpaid fees. It's a party boat for bachelorette parties now.`:esc?$t`The yacht drifts in a harbor you'll never name. You named it "Steady Returns."`:$t`Your yacht was auctioned. A dentist bought it.`)
      :it.id==="penthouse"?(lost?$t`The bank took the penthouse back. The listing photos still show your portrait on the wall.`:$t`The harbor penthouse is an FBI evidence room now. The view is wasted on it.`)
      :(lost?$t`The island went up for back taxes. A hotel chain bought it.`:esc?$t`You live on your island now. It has one bar, and you own it.`:$t`Your island was seized. A government bird researcher lives there now.`));
  }
  if(toys.length)extra.push([$t("What you owned"),shuffle(toys).slice(0,2).join(" ")]);
  const FATE={
    cfo:{loyal:[n=>$t`${n}, your CFO, never said a word to anyone. You still don't know if that was loyalty or fear.`,n=>$t`${n}, your CFO, took the fifth so many times the judge started counting out loud.`],
      rat:[n=>$t`${n}, your CFO, walked prosecutors through every fake spreadsheet. The jury called it "a guided tour."`]},
    marketer:{loyal:[n=>$t`${n} sells timeshares now. Same pitch, different product.`,n=>$t`${n} started a marketing agency. Their slogan is "Trust us."`],rat:[n=>$t`${n} testified that every slogan was your idea. Most of them were.`]},
    lawyer:{loyal:[n=>$t`${n} became a cable news legal analyst and discusses your case most nights.`,n=>$t`${n} billed the estate for nine hundred hours. The trustee paid it.`],rat:[n=>$t`${n} cut a deal, then got disbarred anyway.`]},
    source:{loyal:[n=>$t`${n} was quietly pushed off the force and opened a private security firm.`,n=>$t`${n} retired to a fishing boat that cost more than a detective's salary. Nobody asked.`],rat:[n=>$t`${n} had been wearing a wire for two months.`]},
    pr:{loyal:[n=>$t`${n} wrote a tell-all called "Spin Cycle." It's mostly about ${n}.`,n=>$t`${n} now does crisis communications for a cruise line. They say it's calmer.`],rat:[n=>$t`${n} sold your text messages to a tabloid for six figures.`]},
    smuggler:{loyal:[n=>esc?$t`${n} got you out, then vanished too. Every year you get a postcard with no return address.`:$t`${n} was never found. They used the escape route you paid for.`],rat:[n=>$t`${n} sold your escape route to the FBI.`]},
  };
  const crew=s.lts.map(l=>pick(FATE[l.role][l.loyalty>=45?"loyal":"rat"])(l.name));
  for(const l of s.flipped||[])crew.push(pick(FATE[l.role].rat)(l.name)+$t` That's how the feds knew where to look.`);
  for(const l of s.fired||[])if(Math.random()<0.5)crew.push($t`${l.name}, whom you fired, gave the first interview. It ran four pages.`);
  if(crew.length)extra.push([$t("Your crew"),shuffle(crew).slice(0,2).join(" ")]);
  const ends=[];
  if(flag(s,$t("A streaming producer wants to film you"))===0)ends.push($t`The documentary crew got an ending they didn't plan for. It won an Emmy.`);
  if(flag(s,$t("A journalist wants an interview"))===0)ends.push($t`The reporter who profiled you wrote a follow-up. It won a Pulitzer.`);
  if(flag(s,$t("A famous skeptic posts about you"))!==undefined)ends.push($t`The influencer who called you out now sells a course called "How I Spotted ${FUND}."`);
  if(flag(s,$t("A councilman hints at a donation"))===0)ends.push($t`The councilman who took your donation resigned "to spend more time with his family."`);
  if(flag(s,$t("A foreign businessman wants to park money"))===0)ends.push(esc?$t`The foreign businessman's associates are also looking for you. They're more motivated than the FBI.`:$t`In prison, you got a fruit basket with no card. You didn't eat it.`);
  if(flag(s,$t("Old records in the basement"))===0)ends.push($t`The basement records were never recovered. The fire department still uses your alley for training.`);
  if(flag(s,$t("Your ex wants more alimony"))===1)ends.push($t`Your ex sold the movie rights to your marriage.`);
  if(flag(s,$t("A celebrity offers an endorsement"))===0)ends.push($t`The reality star who endorsed you claims they "were a victim too." They're doing a podcast about it.`);
  if(s.plantsAccepted>0)ends.push(s.plantsAccepted===1?$t`One investor you signed personally turned out to be working against you. You still remember the handshake.`:$t`${s.plantsAccepted} investors you signed personally turned out to be agents, reporters or regulators. You'd shaken every one of their hands.`);
  if(s.honestRejected>=5)ends.push($t`You turned ${s.honestRejected} real investors away at your desk. They're the only ones who came out ahead.`);
  if(s.calledMom)ends.push(s.momTapped?$t`Your goodbye call to your mother was played at trial. She cried. So did two jurors.`:esc?$t`Your mother gets a postcard every year with no return address. She keeps them on the fridge.`:$t`Your mother visits every other Sunday. She brings the same lemon cake. You've never told her you hate lemon.`);
  if(s.shredded)ends.push($t`You fed the shredder until it jammed. Investigators spent eight months taping strips back together.`);
  if(s.bribes>0&&!(s.hush||[]).length)ends.push($t`The regulator who lost your file was indicted too. He blames you.`);
  if(s.rank>=4)ends.push($t`For one glorious year, the Ledger called you "the Wolf of ${CITY}." They still do, but differently.`);
  if(ends.length)extra.push([$t("Loose ends"),shuffle(ends).slice(0,2).join(" ")]);
  for(const x of shuffle(extra).slice(0,3))out.push(x);

  // Years later
  const later=esc?[
    $t`Years later, you lost a third of your fortune to a crypto scheme run by a charming young man. You admired his work.`,
    $t`Once, in an airport in Lisbon, a former investor recognized you. She didn't call the police. She just stared until you left.`,
    $t`You tried starting a small, honest investment club in your new town. It didn't stay honest.`,
    $t`The documentary about you ends on an empty chair and the words "Whereabouts unknown."`,
    $t`You read the ${CITY} Ledger online every morning, looking for your name. It shows up less every year.`,
    $t`On your birthday, an envelope arrives with no return address. Inside is a single ${CITY} Otters ticket stub. You never find out who sent it.`,
    $t`You learned the local language, married a fisherman's widow, and became a deacon at the church. You've never been happier. You've never slept worse.`,
    $t`A tourist asked to take a photo with you because you "look like that guy from the documentary." You said you get that a lot.`,
    $t`Every time a car slows down outside your gate, you still check the mirror.`,
    ...(s.prep.villa?[]:[$t`You check the news every morning for new extradition treaties.`])]
   :[...(yrs<=20?[$t`You were released after ${Math.max(2,Math.round(yrs*0.7))} years for good behavior. On your first day out, someone handed you a flyer for a can't-miss investment.`,
      $t`You got out after ${Math.max(2,Math.round(yrs*0.7))} years. You sell used cars now. You're very, very good at it.`]:[]),
    $t`You applied for a presidential pardon. It was denied in four minutes.`,
    $t`${CITY} renamed the street your office was on.`,
    $t`You still get letters from investors. Most are angry. One asks if you're taking new money.`,
    $t`A young inmate asked you to teach him "how you did it." You told him to get a real job. He laughed. So did you, eventually.`,
    $t`Your old office is a laundromat now. The sign still has a ghost of the ${FUND} logo if you squint.`,
    $t`On visiting days, nobody comes. You put on your good shirt anyway.`,
    $t`The prison library has three books about you. You've checked them all out, so nobody else can.`];
  out.push([$t("Years later"),pick(later)]);
  return out;
}

// ---------- Events ----------
const big=s=>Math.max(50e3,s.owed*0.03);
const lt=c=>c.lt;
const EVENTS=[
  {t:$t("A retired prosecutor wants in"), b:s=>$t`She wants to invest ${fmt(big(s))}. She asks a lot of questions.`, ch:[
    {l:$t("Take her money"), f:s=>{const a=big(s);s.cash+=a;s.owed+=a;s.investors++;s.heat+=7;return $t("Her check clears. She asks for a quick look at your books.");}},
    {l:$t("Politely decline"), f:()=>$t("She invests somewhere else.")}]},
  {t:$t("An early investor wants out"), when:s=>s.investors>20, b:s=>$t`He wants all ${fmt(Math.max(10e3,s.owed*0.04))} back, today.`, ch:[
    {l:$t("Pay him in full"), cost:s=>Math.max(10e3,s.owed*0.04), f:s=>{s.trust+=6;return $t("He tells everyone how smoothly it went.");}},
    {l:$t("Stall him"), f:s=>{s.trust-=10;s.heat+=5;return $t("He starts posting about it online.");}}]},
  {t:$t("A journalist wants an interview"), b:()=>$t("She's writing a profile on high-performing funds."), ch:[
    {l:$t("Turn on the charm"), f:s=>{if(Math.random()<0.5){s.heat-=8;s.trust+=5;return $t("The profile is glowing.");}s.heat+=12;return $t("The article asks how your returns are possible.");}},
    {l:$t("Decline"), f:s=>{s.heat+=4;return $t("\"Declined to comment\" looks bad in print.");}}]},
  {t:$t("Your accountant has questions"), when:s=>s.week>5&&!has(s,"cfo"), b:()=>$t("He says the numbers don't add up."), ch:[
    {l:$t("Give him a big raise"), cost:s=>Math.max(20e3,s.owed*0.005), f:()=>$t("He stops asking.")},
    {l:$t("Fire him"), f:s=>{s.heat+=10;return $t("He leaves with a box of files.");}}]},
  {t:$t("The market crashes"), when:s=>s.market!=="bust", b:()=>$t("Every investor in the country is nervous."), ch:[
    {l:$t("Hold steady"), f:s=>{s.market="bust";s.trust-=15;return $t("Your phones ring all week.");}},
    {l:$t("Pay a loyalty bonus"), cost:s=>Math.max(10e3,s.owed*0.02), f:s=>{s.market="bust";s.trust+=6;s.heat+=2;return $t("Your fund seems crash-proof. Suspiciously so.");}}]},
  {t:$t("A celebrity offers an endorsement"), b:s=>$t`A reality TV star will promote ${FUND} for ${fmt(Math.max(50e3,s.owed*0.02))}.`, ch:[
    {l:$t("Sign the deal"), cost:s=>Math.max(50e3,s.owed*0.02), f:s=>{const d=Math.max(50e3,s.owed*0.02)*4*rand(0.6,1.6),n=Math.round(d/(5e3*(1+0.04*s.week)));s.cash+=d;s.owed+=d;s.investors+=n;s.heat+=6;return $t`${num(n)} fans invest ${fmt(d)}.`;}},
    {l:$t("Pass"), f:()=>$t("They promote a crypto coin instead.")}]},
  {t:$t("A letter from the regulator"), when:s=>s.heat>20, b:()=>$t("A routine request for your filings."), ch:[
    {l:$t("Send forged documents"), f:s=>{if(Math.random()<0.7){s.heat-=6;return $t("They file it away.");}s.heat+=20;return $t("Someone noticed the font changes halfway down the page.");}},
    {l:$t("Ignore it"), f:s=>{s.heat+=10;return $t("A second letter arrives. It's less polite.");}}]},
  {t:$t("An angry thread goes viral"), when:s=>s.investors>50, b:()=>$t("An investor's spouse is calling you a fraud online."), ch:[
    {l:$t("Pay them to delete it"), cost:s=>Math.max(10e3,s.owed*0.003), f:s=>{s.heat-=2;return $t("The thread disappears.");}},

function coach(){
  const s=S;if(!s||!s.tut){hideCoach();return;}
  if(!$("modal").hidden||!$("title").hidden||!$("intro").hidden){hideCoach();return;}
  const t=s.tut;
  if(t.on){
    let st=STEPS[t.i];
    while(st&&((st.skip&&st.skip())||(st.done&&st.done()))){t.i++;st=STEPS[t.i];}
    if(!st){t.on=false;tutDone();}
    else{
      if(st.scr===screenNow&&(!st.when||st.when()))showCoach(st,()=>{t.i++;coach();});
      else hideCoach();
      return;
    }
  }
  if(t.jit)for(const j of JIT)if(!t.seen[j.id]&&j.scr===screenNow&&j.when()){showCoach(j,()=>{t.seen[j.id]=true;coach();});return;}
  hideCoach();
}
function showCoach(st,next){

  ring.style.left=(r.left-pad)+"px";ring.style.top=(r.top-pad)+"px";ring.style.width=(r.width+pad*2)+"px";ring.style.height=(r.height+pad*2)+"px";
  ring.className=st.act?"act":"";ring.hidden=false;
  tip.innerHTML=$t`<p>${st.t}</p><div class="crow">${st.act?"":$t("<span>Tap to continue</span>")}<button data-coach="skip">Skip tips</button></div>`;
  tip.hidden=false;
  // Below the target when it fits, otherwise above it.
  const h=tip.offsetHeight, below=r.bottom+pad+12;
  tip.style.top=(below+h<window.innerHeight-8?below:Math.max(8,r.top-pad-12-h))+"px";
  coachNext=st.act?null:next;
  blk.hidden=!!st.act;
}

function showTitle(){hideCoach();$("tsound").textContent=SND.on?$t("♪ Sound is on. Trust us, keep it on."):$t("♪ Sound is off. Tap to turn it on.");$("tlang").innerHTML=Object.entries(LANGS).map(([k,n])=>`<button data-act="lang" data-v="${k}" aria-pressed="${k===LANG}">${n}${k===LANG?penLoop("lang"+k):""}</button>`).join("");$("title").hidden=false;}
// The cold open: four beats that set the fantasy, one tap each, then the first Ledger.
const INTRO=[$t("Port Ashford, 2027."),
  $t("You have <b>$25,000</b>, a rented office in a strip mall, and no conscience."),
  $t("Promise people steady returns. Pay the old investors with the new investors' money. Skim what you can."),
  $t("Get rich. <b>Get out.</b>")];
function startIntro(){
  let i=0;const el=$("intro"), txt=$("introText");
  const show=()=>{txt.innerHTML=INTRO[i];txt.style.animation="none";void txt.offsetWidth;txt.style.animation="";$("introHint").textContent=i===INTRO.length-1?$t("Tap to open for business"):$t("Tap to continue");};
  el.hidden=false;show();
  el.onclick=()=>{i++;if(i<INTRO.length){play("tick");show();return;}el.onclick=null;play("kaching");enterGame(el);};
}
// Dissolve from black into the office, then slide the first Ledger up.
function enterGame(from){
  const app=$("app");
  app.classList.remove("reveal");void app.offsetWidth;app.classList.add("reveal");
  if(from){from.classList.add("fadeout");setTimeout(()=>{from.hidden=true;from.classList.remove("fadeout");},1400);}
  setTimeout(()=>{app.classList.remove("reveal");showGazette();$("card").classList.add("slidein");},1500);
}
const start=d=>{S=d&&d.S&&d.S.gazette?Object.assign(newGame(),d.S):newGame();if(S.desk)renderDesk();else render();if(!(d&&d.S))showTitle();};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
