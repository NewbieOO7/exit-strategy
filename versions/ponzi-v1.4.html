}
const pitchMult=(c,e)=>0.25+(c.id===G.home?0.5:0)+e.all+Math.max(0,...c.tags.map(t=>e.pitch[t]||0));
const appealC=(c,e)=>(1+e.appeal)*(e.excl?(c.tags.some(t=>t==="affluent"||t==="elite")?1.6:0.7):1);
const upCost=u=>u.cost+2*G.boughtCount[u.tree];
const threat=()=>G.detected?2+G.case/25:G.susp/50;
const readiness=()=>25+PREP.reduce((t,p)=>t+(G.prep[p.id]?p.odds:0),0);
const readyLabel=r=>r<35?"Poor":r<55?"Fair":r<75?"Good":r<90?"Strong":"Excellent";
const escapeOdds=(p=0)=>clamp(Math.round(readiness()-threat()*9-p),5,95);
const keepShare=()=>G.prep.accounts?1:0.6;

// ---------- One day ----------
function day(){
  const e=eff(), r=e.rate, mk=MARKET[G.market], trustF=clamp(G.trust/70,0.1,1.4);
  let deposits=0, newTotal=0;
  const adds={};
  for(const c of CIRCLES){
    const I=G.inv[c.id], pm=pitchMult(c,e), res=1-c.sk*(1-0.5*Math.min(1,(pm-0.25)/1.5)), room=1-I/c.pop;
    const grow=0.06*appealC(c,e)*pm*I*room*res*trustF*mk.rec;
    let seed=0;for(const n of NB[c.id])seed+=pen(n)*0.5*pm*res*trustF*appealC(c,e);
    adds[c.id]=clamp(grow+seed*room,0,c.pop-I);
  }
  for(const c of CIRCLES){const n=adds[c.id];G.inv[c.id]+=n;newTotal+=n;deposits+=n*c.dep*rand(0.7,1.3);}
  const skim=deposits*G.skim;
  G.cash+=deposits-skim;G.stash+=skim;G.totalSkim+=skim;G.owed+=deposits;
  G.owed*=1+r/30;
  const wf=((0.04+1.0*r)*mk.wd*Math.max(0.55,1+e.wd)+(G.trust<40?(40-G.trust)/40*0.12:0))/30;
  const due=G.owed*wf, paid=Math.min(Math.max(0,G.cash),due);
  G.cash-=paid;G.owed-=paid;
  if(due>0&&paid<due*0.999){G.short++;G.trust-=3;}else{G.short=0;G.trust+=0.05+e.trust;}
  if(G.market==="bust")G.trust-=0.05;
  G.trust=clamp(G.trust,0,100);
  G.cloutAcc+=newTotal/15;while(G.cloutAcc>=1){G.clout++;G.cloutAcc--;}
  G.hist.push({dep:deposits,wd:paid,due,skim});if(G.hist.length>30)G.hist.shift();
  // A Ponzi needs growth. When new money slows below what's going out, investors get nervous.
  if(G.hist.length>=30){const dep30=G.hist.reduce((t,x)=>t+x.dep,0),due30=G.hist.reduce((t,x)=>t+x.due,0);
    if(dep30<due30)G.trust=clamp(G.trust-(0.15+0.6*(1-dep30/due30)),0,100);}
  const inv=totalInv();G.peakInv=Math.max(G.peakInv,inv);G.peakOwed=Math.max(G.peakOwed,G.owed);

  // The investigation. Never shown directly.
  const size=0.08*Math.log10(Math.max(G.owed,1e5)/1e5), skimHeat=G.skim*0.4*e.skimHeat, law=pen(BY.law);
  if(!G.detected){
    G.susp+=(0.15+size+e.sev*0.08+skimHeat+law*1.5+inv/8000*0.2)*e.susp;
    if(G.susp>=100){G.detected=true;G.detectedDay=G.day;}
  }else{
    const agencies=0.18+(G.owed>50e6?0.12:0)+(G.owed>200e6||G.case>50?0.2:0);
    G.case+=(agencies+e.sev*0.04+law+skimHeat)*e.case;
  }

  // Market drift
  if(Math.random()<0.004){G.market=G.market==="normal"?pick(["boom","bust"]):"normal";addNews(pick(MARKET_NEWS[G.market]),"market");}

  // Bubbles
  for(const b of G.bubbles)b.ttl--;
  for(const b of G.bubbles.filter(b=>b.ttl<=0&&b.type==="complaint")){if(G.detected)G.case+=2;else G.susp+=5;}
  G.bubbles=G.bubbles.filter(b=>b.ttl>0);
  const infected=CIRCLES.filter(c=>G.inv[c.id]>=1);
  if(infected.length&&Math.random()<0.13)addBubble("prospect",pick(infected));
  const cp=0.02+(70-G.trust)/70*0.12+(G.short?0.3:0)+inv/20000;
  if(infected.length&&Math.random()<cp)addBubble("complaint",pick(infected));
  const rich=infected.filter(c=>c.tags.includes("affluent")||c.tags.includes("elite"));
  if(rich.length&&Math.random()<0.025)addBubble("whale",pick(rich));

  // Rumors start on their own
  if(inv>100&&G.day>=G.nextRumor){const pool=RUMORS.filter(x=>!G.rumors.some(y=>y.t===x.t));
    if(pool.length){const ru=pick(pool);G.rumors.push(ru);addNews(`Word on the street: "${ru.t}"`,"rumor");}
    G.nextRumor=G.day+rand(50,90);}

  // Circle milestones
  for(const c of CIRCLES)for(const m of [0.25,0.5,0.9]){const k=c.id+m;if(!G.mile[k]&&pen(c)>=m){G.mile[k]=true;G.clout+=2;
    addNews(m===0.25?`${c.name} buzzing about a local fund`:m===0.5?`Half of ${c.name} now invested with ${FUND}`:`${c.name}: "Everyone we know is in Evergreen"`,"mile");}}

  // Ledger
  if(G.day>=G.nextNews){
    const roll=Math.random();
    if(roll<0.6){const tier=clamp(Math.floor(threat()+randn()*0.7),0,5);addNews(pick(SIGNALS[tier]),"signal");}
    else if(roll<0.78)addNews(pick(HERRINGS),"herring");
    else if(roll<0.9)addNews(pick(MARKET_NEWS[G.market]),"market");
    else addNews(pick(FILLER),"filler");
    G.nextNews=G.day+Math.round(rand(4,7));
  }

  G.day++;
  if(G.detected&&G.case>=100){raid();return;}
  if(G.short>=10||G.trust<=0){collapse();return;}
}
function addBubble(type,c){
  if(G.bubbles.filter(b=>b.c===c.id).length>=2)return;
  G.bubbles.push({id:++G.bubId,type,c:c.id,ttl:type==="whale"?5:type==="complaint"?6:8,x:c.x+rand(22,90),y:c.y+rand(30,70)});
}
function addNews(text,kind){G.news.unshift({day:G.day,text,kind});if(G.news.length>40)G.news.pop();}

function updateMap(){
  for(const c of CIRCLES){const p=pen(c);
    $("f-"+c.id).setAttribute("opacity",p>0?(0.12+p*0.7).toFixed(3):0);
    $("p-"+c.id).textContent=G.inv[c.id]>=1?`${num(G.inv[c.id])} · ${(p*100).toFixed(p<0.1?1:0)}%`:"";}

}
function popBubble(id){
  const b=G.bubbles.find(x=>x.id===id);if(!b)return;
  G.bubbles=G.bubbles.filter(x=>x!==b);
  const c=BY[b.c];
  if(b.type==="prospect")G.clout+=Math.random()<0.5?2:3;
  if(b.type==="whale"){const a=c.dep*rand(8,20);G.cash+=a*(1-G.skim);G.stash+=a*G.skim;G.owed+=a;G.inv[c.id]=Math.min(c.pop,G.inv[c.id]+1);
    if(G.detected)G.case+=0.5;else G.susp+=1;addNews(`Mystery investor puts ${fmt(a)} into local fund`,"mile");}
  updateMap();renderStats();
}

// ---------- Endgames ----------
function raid(){
  G.speed=0;G.over=true;
  if(G.prep.jet)modal(`<div class="tag">Day ${G.day}</div><h3>Agents are at the front door</h3><p>Your pilot is fueling the jet. You might make it out the back.</p>
    <div class="btns"><button class="big run" data-act="jetflee">Run for the jet</button><button class="big alt" data-act="surrender">Surrender</button></div>`);
  else ending("caught","raid");
}
function collapse(){
  G.speed=0;G.over=true;G.collapsed=true;
  modal(`<div class="tag">Day ${G.day}</div><h3>The fund has collapsed</h3><p>You can't pay what you owe and investors are lining up outside. The authorities will be here within hours.</p>
    <p>Escape readiness: ${readyLabel(readiness())}. If you make it, you keep ${fmt(G.stash*keepShare())}.</p>
    <div class="btns"><button class="big run" data-act="collapseflee">Run</button></div>`);
}
function attemptEscape(pen,how){G.speed=0;G.over=true;const o=escapeOdds(pen);ending(Math.random()*100<o?"escaped":"failed",how,o);}

function story(kind,how){
  const out=[], kept=Math.round(G.stash*keepShare()), frozen=G.stash-kept, yrs=sentence(), inv=totalInv();
  const m=G.prep.jet?"jet":G.prep.passport?"passport":"none";
  const ESC={jet:[`At 3 a.m. your jet lifted off from a private strip outside ${CITY}. The pilot never asked your name.`,`You told your assistant you had a conference in Geneva. The jet landed somewhere else.`],

  const FAIL={jet:[`The jet never got clearance. Agents were waiting on the tarmac with coffee.`],passport:[`The passport was good. The photo wasn't.`,`You forgot your new name at passport control. Twice.`],
    none:[`You were arrested at a gas station forty miles from the border, paying cash for beef jerky.`,`You missed your flight by four minutes. The agents didn't.`]};

  if(kind==="escaped")scene+=how==="jet"?`Agents came through the front door as you went out the back. The jet left the runway ninety seconds before the airport closed.`:pick(ESC[m]);
  else if(kind==="failed")scene+=how==="jet"?`You made it to the hangar. So did the FBI.`:pick(FAIL[m]);
  else scene=how==="surrender"?`Your pilot was fueling the jet when you decided you were too tired to run.`:pick([`Agents knocked at 6 a.m. You answered in a bathrobe that cost more than most people's rent.`,`They arrested you mid-pitch at a free-lunch seminar. Three retirees still asked for your card.`,`Agents walked in while you were on the phone promising someone "nothing but upside."`]);
  if(G.day<60)scene+=` The whole thing lasted ${G.day} days.`;
  out.push(["The end",scene]);
  if(kind==="escaped"){
    let life=kept<50e3?`You got away with ${fmt(kept)}. It lasted fourteen months. Now you tend bar in a beach town under a name you keep forgetting.`
      :kept<500e3?`${fmt(kept)} bought a small café by the sea. The coffee is bad. Nobody asks questions.`
      :kept<5e6?`${fmt(kept)} bought a house on a hill, a new nose, and a golden retriever named Dividend.`
      :kept<50e6?`${fmt(kept)} goes a long way in a country with no extradition treaty. You bought the local football club.`
      :`With ${fmt(kept)}, you bought an island. Then a second island, to keep an eye on the first.`;
    if(frozen>0)life+=` Another ${fmt(frozen)} was frozen by a bank that suddenly remembered its compliance rules.`;
    out.push(["Your new life",life]);
  }else{
    out.push(["Prison",(G.stash>0?(G.bought.shells?`Your shell companies kept investigators busy for years. They clawed back ${fmt(G.stash*0.3)} of your ${fmt(G.stash)} stash. `:`Investigators found your stash in a week. All ${fmt(G.stash)} of it. `):`There was no stash. Prosecutors found that the most confusing part of the case. `)
      +`The judge gave you ${yrs} years.`+(G.bought.lawyers?` Your lawyers called it a win.`:"")+" "+pick([`You run the prison's commissary black market now. Old habits.`,`You teach a personal finance class to the other inmates. You're the only one who finds it funny.`,`Your cellmate gave you his commissary money to invest. He keeps asking about returns.`])]);
  }
  const hit=CIRCLES.filter(c=>pen(c)>=0.15).sort((a,b)=>pen(b)-pen(a));
  let t=`${num(G.peakInv)} people in ${hit.length||1} corner${hit.length===1?"":"s"} of ${CITY} believed in ${FUND}. They thought they had ${fmt(G.peakOwed)}. A trustee spent nine years recovering ${Math.round(kind==="escaped"?rand(5,25):rand(30,60))}% of it.`;
  const fates=hit.slice(0,4).map(c=>CIRCLE_FATES[c.id]);
  if(fates.length)t+=" "+fates.sort(()=>Math.random()-0.5).slice(0,2).join(" ");
  if(G.peakInv<25)t=`Only ${num(G.peakInv)} people lost money, and most of them were friends. Thanksgiving is canceled indefinitely.`;
  out.push(["The investors",t]);
  const builds=Object.keys(BUILD_FATES).filter(k=>G.bought[k]).map(k=>BUILD_FATES[k]);
  if(G.rumors.length)builds.push(`The rumor that "${G.rumors[0].t.replace(/^Evergreen /,"you ").replace(/\.$/,"")}" became the headline of your trial.`);
  if(builds.length)out.push(["Your scheme",builds.sort(()=>Math.random()-0.5).slice(0,2).join(" ")]);
  out.push(["Years later",pick(kind==="escaped"?[`Years later, you lost a third of your fortune to a crypto scheme run by a charming young man. You admired his work.`,`Once, in an airport in Lisbon, a former investor recognized you. She didn't call the police. She just stared until you left.`,`The documentary about you ends on an empty chair and the words "Whereabouts unknown."`,`You read the ${CITY} Ledger online every morning, looking for your name. It shows up less every year.`]
    :[`You applied for a presidential pardon. It was denied in four minutes.`,`Business schools teach your case now. Students are graded on spotting the warning signs.`,`${CITY} renamed the street your office was on.`,`You still get letters from investors. Most are angry. One asks if you're taking new money.`])]);
  return out;
}
function ending(kind,how,odds){
  G.over=true;G.speed=0;
  const esc=kind==="escaped", score=esc?Math.round(G.stash*keepShare()):0;
  let best=0;try{best=+localStorage.getItem("ponzi-plague-best")||0;if(score>best)localStorage.setItem("ponzi-plague-best",score);}catch(e){}
  const head=pick(esc?[`${FUND} founder vanishes; ${fmt(G.peakOwed)} missing`,`Where is ${FUND}'s founder?`,`${FUND} offices found empty except for a fern`]
    :kind==="failed"?[`${FUND} founder caught fleeing`,`Fund boss nabbed on the way out`]:[`Federal agents raid ${FUND}`,`"Nothing but upside": ${FUND} founder arrested`]);
  const truth=G.detected?`The investigation opened on day ${G.detectedDay}. The case was ${Math.min(100,Math.round(G.case))}% complete.`:`Nobody had opened a case yet.`;
  modal(`<div class="tag">${esc?"You got away":"Caught"} · day ${G.day}</div><div class="headline">${head}</div>
    ${story(kind,how).map(([h,t])=>`<div class="ep"><div class="tag">${h}</div><p>${t}</p></div>`).join("")}
    <div class="ep"><div class="tag">What you couldn't see</div><p>${truth}${odds!=null?` Your real escape odds were ${odds}%.`:""}</p></div>
    <div class="endstats"><span>Days running</span><span>${G.day}</span><span>Peak investors</span><span>${num(G.peakInv)}</span>
    <span>Peak owed</span><span>${fmt(G.peakOwed)}</span><span>Upgrades bought</span><span>${Object.keys(G.bought).length}</span>
    <span>Score (stash kept)</span><span class="${score?"good":"bad"}">${fmt(score)}</span><span>Best escape</span><span>${fmt(Math.max(best,score))}</span></div>
    <div class="btns"><button class="big go" data-act="again">New scheme</button></div>`);
}

// ---------- Modals ----------
function modal(html){$("card").innerHTML=html;$("modal").hidden=false;$("card").scrollTop=0;}
function closeModal(){$("modal").hidden=true;}
$("modal").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.home){G=newGame(b.dataset.home);addNews(`${FUND} opens its doors`,"filler");closeModal();buildMap();updateMap();renderStats();return;}
  const a=b.dataset.act;
  if(a==="jetflee")attemptEscape(15,"jet");
  if(a==="surrender")ending("caught","surrender");
  if(a==="collapseflee")attemptEscape(15,"collapse");
  if(a==="again")intro();
});
function intro(){
  modal(`<h3>PONZI RUN<small>v${VERSION}</small></h3>
    <p>Build a Ponzi scheme across ${CITY}. Spend clout on your pitch, your promises and your cover. Skim what you can. Get out before the feds arrive.</p>
    <p class="hint">Nobody tells you how close the investigation is. Read the Ledger and judge for yourself. Tap bubbles on the map: green for clout, gold for whales, red for complaints you need to calm down before they reach a regulator.</p>
    <div class="tag">Pick where your first investors come from</div>
    <div class="pickc">${CIRCLES.filter(c=>!["law","hall"].includes(c.id)).map(c=>`<button data-home="${c.id}">${c.name}<small>${c.kind} · ${skLabel(c.sk).toLowerCase()} · typical check ${fmt(c.dep)}</small></button>`).join("")}</div>`);
}

// ---------- Input ----------
$("map").addEventListener("pointerdown",ev=>{
  if(!G||G.over||!$("modal").hidden)return;
  const bub=ev.target.closest("[data-b]");if(bub){popBubble(+bub.dataset.b);return;}
});
$("map").addEventListener("click",ev=>{
  if(!G||G.over||!$("modal").hidden)return;
  if(ev.target.closest("[data-b]"))return;
  const d=ev.target.closest("[data-c]");if(d)openSheet("circle",d.dataset.c);
});
$("speed").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b||!G||G.over)return;G.speed=+b.dataset.s;if(G.speed)speedBeforeSheet=G.speed;renderTop();});
document.querySelector(".tabs").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b||!G)return;openSheet(b.dataset.tab);});
$("ticker").addEventListener("click",()=>G&&openSheet("news"));

// ---------- Loop ----------
let last=0;
function loop(ts){
  const dt=Math.min(0.25,(ts-last)/1000||0);last=ts;
  if(G&&!G.over&&$("modal").hidden&&$("sheet").hidden&&!document.hidden&&G.speed){
    acc+=dt*SPEEDS[G.speed];
    let ticked=false;
    while(acc>=1&&!G.over){acc-=1;day();ticked=true;}
    if(ticked){updateMap();renderStats();}
  }
  requestAnimationFrame(loop);
}

if(typeof window.claude?.hot?.snapshot==="function")window.claude.hot.snapshot(()=>({G}));
const start=d=>{
  if(d&&d.G&&d.G.inv){G=d.G;buildMap();updateMap();renderStats();}
  else{G=null;buildMapEmpty();intro();}
  requestAnimationFrame(loop);
};
function buildMapEmpty(){G={inv:Object.fromEntries(CIRCLES.map(c=>[c.id,0])),bubbles:[]};buildMap();updateMap();G=null;}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
