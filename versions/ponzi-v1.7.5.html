    <div class="btns"><button class="big go" data-act="paper">Read the Ledger</button></div>`,"gold");
}

// ---------- The raid: ten real seconds ----------
let raidIv=null;
function startRaid(){
  // Your lawyer stalls them in the lobby; the penthouse panic room buys a little more.
  const s=S;s.raidT=(has(s,"lawyer")?15:10)+(s.life.penthouse?5:0);s.raidGrab=false;
  // Black. Silence. One flash of red and blue. Then the sirens, and the clock starts.
  const b=$("blackout");musicDuck(true);b.className="on";
  setTimeout(()=>{b.className="on flash";play("siren");},1400);
  setTimeout(()=>{b.className="";musicDuck(false);raidModal();
    let last=performance.now(),sec=s.raidT;
    raidIv=setInterval(()=>{const now=performance.now();s.raidT-=(now-last)/1000;last=now;
      const c=Math.ceil(s.raidT);if(c<sec){sec=c;play("thump");}
      if(s.raidT<=0){stopRaid();ending("caught",null,"froze");return;}
      const el=$("raidT");if(el)el.textContent=Math.max(0,c);},100);
  },2300);
}
function raidModal(){
  const s=S, amt=Math.max(0,Math.round(s.cash*0.5));
  modal(`<div class="tag">Month ${s.week} · right now</div><h3>Agents in the lobby</h3><div class="count" id="raidT">${Math.ceil(s.raidT)}</div>
    <p>They're coming up the stairs. ${has(s,"lawyer")?"Your lawyer is stalling them in the lobby. ":""}${s.life.penthouse?"The panic room door is holding. ":""}${s.prep.jet?"Your pilot is fueling the jet.":"The fire escape is out the back window."}</p>
    <div class="btns"><button class="big run" data-act="raidrun">${s.prep.jet?"Run for the jet":"Out the back window"}</button>
    <button class="big alt" data-act="raidgrab" ${s.raidGrab||amt<1?"disabled":""}>Empty the safe first · ${fmt(amt)} · costs 4 sec</button>
    <button class="big alt" data-act="raidgive">Surrender</button></div>`,"raid");
}
function stopRaid(){clearInterval(raidIv);raidIv=null;}

// ---------- One last deal, then the Night of the Run ----------
let nightIv=null;
const ROUTES=[
  {id:"jet",name:"Private jet",scan:"the private airstrip",need:s=>s.prep.jet,d:"Wheels up from the private strip"},
  {id:"yacht",name:"The marina",scan:"the marina",need:s=>s.yacht||(s.life&&s.life.island),d:"Open water by sunrise"},
  {id:"passport",name:"The airport",scan:"the airport",need:s=>s.prep.passport,d:"A new name and a window seat"},
  {id:"car",name:"The sports car",scan:"the coast highway",need:s=>s.life&&s.life.car,d:"Floor it down the coast highway"},
  {id:"none",name:"Drive for the border",scan:"the highways south",need:()=>true,d:"Nineteen hours, radio off"},
];
const scanOf=id=>ROUTES.find(r=>r.id===id).scan;
function beginRun(){
  const s=S;
  // Greed's last trick: the call always comes when you've decided to leave.
  if(s.owed>1e6&&s.week-s.lastDeal>=4&&Math.random()<0.5){
    s.lastDeal=s.week;s.dealDep=Math.round(Math.max(1e6,s.owed*rand(0.15,0.3))/1e5)*1e5;play("ring");
    modal(`<div class="tag">Your phone rings</div><h3>One last deal</h3>
      <p>A family office from Geneva: "We'd like to place <b class="good">${fmt(s.dealDep)}</b> with you. But we need to meet in person. Monday."</p>
      <p class="narr">“One more month. What's one more month?”</p>
      <div class="btns"><button class="big go" data-act="staydeal">Stay for the ${fmt(s.dealDep)}</button><button class="big run" data-act="startnight">Hang up and go</button></div>`);
    return;
  }
  startNight(false);
}
function stayDeal(){const s=S;s.whaleNext={dep:s.dealDep};s.heat=clamp(s.heat+5,0,100);s.notes.push("You told Geneva you'd see them Monday.");closeModal();render();}

function startNight(collapsed){
  const s=S, open=ROUTES.filter(r=>r.need(s));
  // One route is being watched. The scanner names it, usually correctly.
  const hot=open.length>1?pick(open):null, named=hot&&Math.random()<0.8?hot:pick(ROUTES);
  s.night={t:collapsed?30:45,step:0,mods:0,hot:hot&&hot.id,named:named.id,collapsed};
  play("siren");renderNight();
  let last=performance.now(),sec=s.night.t;
  nightIv=setInterval(()=>{const n=S.night;if(!n)return;const now=performance.now();n.t-=(now-last)/1000;last=now;
    const c=Math.ceil(n.t);if(c<sec){sec=c;if(c<=10)play("thump");}
    if(n.t<=0){stopNight();S.night=null;ending("caught",null,"tooslow");return;}
    const el=$("nightT");if(el)el.textContent=Math.max(0,c);},100);
}
function stopNight(){clearInterval(nightIv);nightIv=null;}
function nightSteps(s){
  const n=s.night, grab=Math.max(0,Math.round(s.cash*0.6));
  return [
    {h:"The safe",p:`There's ${fmt(Math.max(0,s.cash))} of fund money in the office safe.`,o:[
      {l:`Empty it into a gym bag · +${fmt(grab)}`,c:8,dis:grab<1,f:()=>{s.cash-=grab;s.stash+=grab;s.grabbed=grab;play("coins");}},
      ...(s.life.watch?[{l:"Pawn the gold watch on the way · +$20k",c:3,f:()=>{s.stash+=20e3;s.pawned=true;s.life.watch=false;play("coins");}}]:[]),
      {l:"Leave it. Go.",c:0,f:()=>{}}]},
    {h:"The files",p:"Filing cabinets and hard drives full of fake statements.",o:[
      {l:"Shred everything you can",c:10,f:()=>{n.mods+=8;s.shredded=true;play("roar");}},
      {l:"Pull the hard drive and run",c:4,f:()=>{n.mods+=3;}},
      {l:"Leave it all",c:0,f:()=>{}}]},
    {h:"One call",p:"One call before you ditch the phone. They might be listening.",o:[
      {l:"Your lawyer: which way is safe?",c:6,f:()=>{s.calledLawyer=true;n.msg=n.hot?`Your lawyer: "Stay away from ${scanOf(n.hot)}. They're waiting there."`:`Your lawyer: "They're not watching any one route. Just go."`;}},
      {l:"Your mother, to say goodbye",c:5,f:()=>{s.calledMom=true;
        if(Math.random()<(s.heat>60?0.55:0.2)){n.t-=15;s.momTapped=true;n.msg="Halfway through, the line clicks. They heard. You just lost 15 seconds.";play("thump");}

function renderNight(){
  const s=S, n=s.night, st=nightSteps(s)[n.step];

    <div class="btns">${st.o.map((o,i)=>`<button class="big ${i===0?"run":"alt"}" data-act="nightpick" data-v="${i}" ${o.dis?"disabled":""}>${o.l}${o.c?` · ${o.c}s`:""}</button>`).join("")}</div>`,"raid");

function nightPick(i){

// ---------- Epilogue ----------
// Built from sections chosen by what actually happened in the run, each with its own variants.
const flag=(s,t)=>s.flags?s.flags[t]:undefined;
const methodOf=s=>s.route||(s.prep.jet?"jet":s.yacht?"yacht":s.prep.passport?"passport":"none");
function epilogue(s,kind,how){
  const out=[], m=methodOf(s), kept=Math.round(s.stash*keepShare(s)), frozen=s.stash-kept, yrs=sentence(s), esc=kind==="escaped";
  const R=RANKS[s.rank].t.toLowerCase(), L=s.life||{}, owned=s.owned||{};

  // The ending scene
  const ESC={
    jet:[`At 3 a.m. your jet lifted off from a private strip outside ${CITY}. The pilot never asked your name.`,

      `Your new passport said you were a Canadian dentist. You practiced the accent for the whole flight.`,
      `The gate agent wished "Mr. Delacroix" a pleasant flight. You smiled like someone who had never heard of ${FUND}.`],

    none:[`You crossed the border on a Greyhound bus with a duffel bag of cash and a fake mustache. Somehow, it worked.`,
      `You drove south for nineteen hours with the radio off and the cash in a picnic cooler.`,
      `You bought a rusty pickup for cash at a truck stop and drove until the road signs changed language.`],
  };
  const FAIL={
    jet:[`The jet never got clearance. Agents were waiting on the tarmac with coffee.`,`Your pilot had made a deal with the FBI. He landed the jet right back in ${CITY}.`,
      `The jet sat on the runway for forty minutes, "waiting for a slot." You knew before the door opened.`],
    yacht:[`The coast guard boarded your yacht eleven miles out. You were wearing a captain's hat.`,`The yacht ran out of fuel within sight of the shore. Nobody had checked.`,
      `A harbor patrol boat was waiting at the mouth of the marina, lights off, engine idling.`],
    passport:[`The passport was good. The photo wasn't. The border agent compared it to the poster on her wall.`,`You forgot your new name at passport control. Twice.`,
      `The gate agent smiled, said "One moment, Mr. Delacroix," and picked up a phone.`],
    car:[`A roadblock at the county line. The sports car was easy to spot. It's the only red one in the state.`,`You hit a speed trap doing a hundred and forty. The trooper recognized you from the news.`],
    none:[`You were arrested at a gas station forty miles from the border, paying cash for beef jerky.`,`You missed your flight by four minutes. The agents didn't.`,

  };

      :pick([`You went down the fire escape as agents came up the stairs, flagged a cab, and made the last flight out with a gym bag full of cash.`,`You climbed out the bathroom window, dropped into the dumpster behind the building, and walked to the bus station smelling like old lettuce. Worth it.`]))
      :(how==="collapse"?pick(["With investors pounding on the front door, you slipped out through the noodle shop next door. ","The lobby was full of screaming investors. You went out through the parking garage in a janitor's jacket. "]):"")+pick(ESC[m]||ESC.none);
  }else if(kind==="failed"){
    scene=how==="raid"?(s.prep.jet?`You made it to the hangar. So did the FBI.`:pick([`You made it down the fire escape. Two agents were waiting in the alley, eating sandwiches.`,`The fire escape ended one floor short. You hung there until the agents brought a ladder.`]))
      :(how==="collapse"?"You ran the night the fund collapsed, with half the city looking for you. ":"")+pick(FAIL[m]||FAIL.none);
  }else if(how==="surrender"){
    scene=pick([`Agents filled the lobby. You straightened your tie, put your hands up and asked for a lawyer.`,`You met them at the elevator with your coat on. "Let's not make a scene," you said. They made a scene anyway.`]);
  }else if(how==="tooslow"){
    scene=pick([`You were still stuffing cash into a gym bag when the elevator doors opened.`,`You were halfway down the stairs when you heard them coming up.`,`You had one shoe on and the car keys in your teeth when they kicked the door in.`]);
  }else if(how==="froze"){
    scene=pick([`You heard them on the stairs and froze. You were still standing at the window, watching the street, when they came in.`,`Your legs wouldn't move. You sat back down at your desk and waited. It took them four minutes.`]);
  }else{

      `Agents walked into your office while you were on the phone promising someone "nothing but upside."`,
      `They picked you up at the car wash. Your car was half rinsed.`,

  }

  out.push(["The end",scene]);

    let life=kept<50e3?pick([`You got away with ${fmt(kept)}. It lasted fourteen months. Now you tend bar in a beach town under a name you keep forgetting.`,
        `${fmt(kept)} doesn't go far. You rent a room above a laundromat and give tennis lessons you're not qualified to give.`])
      :kept<500e3?pick([`${fmt(kept)} bought a small café by the sea. The coffee is bad. Nobody asks questions.`,`With ${fmt(kept)}, you opened a surf shop. You can't surf. Business is fine.`])
      :kept<5e6?pick([`${fmt(kept)} bought a house on a hill, a new nose, and a golden retriever named Dividend.`,`${fmt(kept)} bought a vineyard. The wine is terrible. You drink it anyway, every afternoon, on the porch.`])
      :kept<50e6?pick([`${fmt(kept)} goes a long way in a country with no extradition treaty. You bought the local football club. The stadium carries your new name.`,
        `With ${fmt(kept)}, you live in a walled villa with a pool shaped like a dollar sign. The locals call you "the Canadian."`])
      :pick([`With ${fmt(kept)}, you bought an island. Then a second island, to keep an eye on the first.`,`${fmt(kept)}. You stopped counting. You started a foundation in your new name. It gives money to journalism schools, as a joke only you get.`]);
    if(frozen>0)life+=` Another ${fmt(frozen)} was frozen by a bank that suddenly remembered its compliance rules.`;
    if(!s.prep.villa&&!L.island)life+=" "+pick([`You never set up a safe home, so you move every few months and never unpack.`,`With no safe house, you sleep in a different bed every month. You keep a bag packed by the door.`]);
    out.push(["Your new life",life]);
  }else{
    let fate=s.prep.shells?`Your shell companies kept investigators busy for years. They clawed back ${fmt(s.stash*0.3)} of your ${fmt(s.stash)} stash.`
      :s.stash>0?pick([`Investigators found your offshore stash in a month. All ${fmt(s.stash)} of it.`,`The ${fmt(s.stash)} you skimmed was found in an account with your dog's name as the password.`])
      :`There was no stash. You never kept a dollar for yourself. Prosecutors found that the most confusing part of the case.`;
    fate+=` The judge gave you ${yrs} years.`+(yrs>=100?" "+pick([`The judge said the number was symbolic. It doesn't feel symbolic.`,`Your lawyer did the math on a napkin and stopped talking.`])
      :yrs<=15?` You'll be out before your hair goes fully gray.`:"");
    fate+=" "+pick([`You run the prison's commissary black market now. Old habits.`,
      `You teach a personal finance class to the other inmates. You're the only one who finds it funny.`,
      `You wrote a memoir in your cell. The royalties go to your victims.`,
      `Your cellmate gave you his commissary money to invest. He keeps asking about returns.`,
      `You started a book club. Every pick is about a heist. The warden asked you to stop.`,
      `You work in the prison laundry. You've never been this honest, and you've never been this bored.`,
      `The other inmates call you "the Banker." Two of them owe you cigarettes. You charge interest.`,
      `You get one hour in the yard a day. You spend it pacing, doing math on money you'll never see.`]);
    out.push(["Prison",fate]);
  }

  // The investors
  if(s.peakInv>0){
    const rec=esc?Math.round(rand(5,25)):Math.round(rand(30,60));
    let t=s.peakInv<25?pick([`Only ${num(s.peakInv)} people lost money, and most of them were friends. Thanksgiving is canceled indefinitely.`,`${num(s.peakInv)} people lost money. You know all of them by name. They know you by a different one now.`])
      :pick([`${num(s.peakInv)} people believed in ${FUND}. A court-appointed trustee spent nine years recovering ${rec}% of the ${fmt(s.peakOwed)} they thought they had.`,
        `The trustee's final report ran to 2,300 pages. ${num(s.peakInv)} investors got back ${rec} cents on the dollar.`,
        `${num(s.peakInv)} investors filed claims. The trustee called it "the largest pile of hope and paperwork in ${CITY}'s history." They got back ${rec}%.`]);
    const vig=[`Edna Fisk, a retired schoolteacher, lost the house she paid off in 1998.`,
      `Carl Ruiz, a dentist, had put in his kids' college fund. He gives talks on warning signs now.`,
      `Walt Brennan, a fisherman, lost his late wife's life insurance money.`,
      `Maria Delgado had remortgaged her bakery to "double down." It's a vape shop now.`,
      `Ruth Abernathy, a nurse, had talked six coworkers into investing. Five still aren't speaking to her.`,
      `Sunil Mehta had invested his lottery winnings. He says he's "technically back where he started."`,
      `The Ashford Otters' Little League lost its uniform fund. The kids played the season in plain white T-shirts.`,
      `A retired firefighter named Dale Okafor drove four hours to every hearing. He sat in the front row and never said a word.`,
      `Twins Patty and Pam Lindqvist each invested without telling the other. They found out at the same creditors' meeting.`,
      `A widower named Ernest Pruitt framed his last account statement. "So I remember to read the fine print," he said.`];
    if(flag(s,"A church group wants to invest")===0)vig.push(`Pastor Hollis's congregation lost the new-roof fund. That Sunday's sermon was about forgiveness. It was short.`);
    if(s.peakInv>=25)t+=" "+shuffle(vig.slice()).slice(0,Math.random()<0.5?1:2).join(" ");
    const mom=flag(s,"Your mom wants to invest");
    if(mom===0)t+=` Your mother lost her retirement savings. She still sends a birthday card every year. It's blank inside.`;
    else if(mom===1)t+=` Your mother, the one person you wouldn't take money from, told reporters you "had one decent bone."`;
    if(flag(s,"A retired prosecutor wants in")===0)t+=` The retired prosecutor who invested with you came out of retirement to lead the case.`;
    out.push(["The investors",t]);
  }

  // Optional sections. Each ending draws a different few.
  const extra=[];
  if(!esc)extra.push(["The trial",[
      pick([`The prosecutor opened by reading your old ${FUND} brochure aloud. The jury laughed in all the wrong places.`,
        `The trial lasted six weeks. Your lawyer's best argument was that the investors "should have known." It didn't land.`,
        `Your defense called one witness: you. It was a mistake you made with total confidence.`,
        `The courtroom sketch artist drew you smirking. You weren't, but the sketch went viral anyway.`]),
      s.grabbed?`Exhibit 1 was a gym bag with ${fmt(s.grabbed)} in it.`:s.parties?`The jury saw photos from ${s.parties} of your parties on the water. One juror asked for copies.`:(s.hush||[]).length?`${s.hush[0].who} testified about the "consulting fees." In detail.`:`The jury saw a chart of your returns. It was a perfectly straight line. That was the whole case.`,
      pick([`The jury deliberated for forty minutes, including lunch.`,`The jury took two days. You later learned one juror held out because he liked your suits.`,`The verdict took less time than reading the charges.`])].join(" ")]);
  if(s.named&&s.named.length){
    const first=s.named[0], big=s.biggest;
    let w=`${first}, your very first investor, `+pick([`still has the welcome letter you signed. It hangs in their bathroom.`,`testified that you "seemed so sure." That was the problem.`,`started a support group for your investors. It meets in the room where you used to hold seminars.`,`now runs a podcast about financial fraud. You're episodes one through nine.`]);
    if(big&&big.name!==first)w+=` ${big.name}, who handed you ${fmt(big.dep)} in a single afternoon, `+pick([`wants you to know they're "fine." Their lawyer says otherwise.`,`moved in with their adult children. Everyone is coping.`,`sued the bank, the auditor, and the Little League. They won against the bank.`,`still has the pen you signed with. They use it to sign checks they can actually cash.`]);
    extra.push(["Where are they now",w]);
  }
  extra.push(["The story",pick([
    `A streaming service made an eight-part series about you called "${pick(["Steady Returns","The Closer","Too Good To Be True","Evergreen"])}." The actor who played you won an award. Critics said he was "too likable."`,
    `A true-crime podcast spent eleven episodes on ${FUND}. The host's verdict: "${pick(["Charming. Terrifying. Kind of impressive.","A ${R} with excellent posture.","The best liar this town ever produced."]).replace("${R}",R)}"`,
    `The Ledger's reporter wrote a book about you. The cover is your face, in gold foil. It sells best at airports.`,
    `Business schools teach your case now. Students are graded on spotting the warning signs. Most of them miss at least three.`,
    `Someone made a board game about ${FUND}. Nobody ever wins it. That's the point.`])]);
  const toys=[];
  for(const it of LIFE.filter(x=>!x.repeat&&owned[x.id])){
    const lost=!L[it.id]&&!(it.id==="watch"&&s.pawned);
    toys.push(it.id==="watch"?(s.pawned?`You pawned the gold watch on your way out of town for twenty grand. The pawnbroker knew exactly who you were.`:esc?`You still wear the gold watch. It stopped working years ago. You wear it anyway.`:`The gold watch went into an evidence bag. You watched them write "1 watch, gold, gaudy" on the label.`)
      :it.id==="car"?(lost?`The bank repossessed your sports car before the feds could. Nobody was surprised.`:esc?`Your sports car was found at the airport in a no-parking zone, engine still warm.`:`Your sports car was auctioned. The winning bid came from one of your investors.`)
      :it.id==="yacht"?(lost?`The yacht was seized at the marina for unpaid fees. It's a party boat for bachelorette parties now.`:esc?`The yacht drifts in a harbor you'll never name. You named it "Steady Returns."`:`Your yacht was auctioned. A dentist bought it.`)
      :it.id==="penthouse"?(lost?`The bank took the penthouse back. The listing photos still show your portrait on the wall.`:`The harbor penthouse is an FBI evidence room now. The view is wasted on it.`)
      :(lost?`The island went up for back taxes. A hotel chain bought it.`:esc?`You live on your island now. It has one bar, and you own it.`:`Your island was seized. A government bird researcher lives there now.`));
  }
  if(toys.length)extra.push(["What you owned",shuffle(toys).slice(0,2).join(" ")]);
  const FATE={
    cfo:{loyal:[n=>`${n}, your CFO, never said a word to anyone. You still don't know if that was loyalty or fear.`,n=>`${n}, your CFO, took the fifth so many times the judge started counting out loud.`],
      rat:[n=>`${n}, your CFO, walked prosecutors through every fake spreadsheet. The jury called it "a guided tour."`]},
    marketer:{loyal:[n=>`${n} sells timeshares now. Same pitch, different product.`,n=>`${n} started a marketing agency. Their slogan is "Trust us."`],rat:[n=>`${n} testified that every slogan was your idea. Most of them were.`]},
    lawyer:{loyal:[n=>`${n} became a cable news legal analyst and discusses your case most nights.`,n=>`${n} billed the estate for nine hundred hours. The trustee paid it.`],rat:[n=>`${n} cut a deal, then got disbarred anyway.`]},
    source:{loyal:[n=>`${n} was quietly pushed off the force and opened a private security firm.`,n=>`${n} retired to a fishing boat that cost more than a detective's salary. Nobody asked.`],rat:[n=>`${n} had been wearing a wire for two months.`]},
    pr:{loyal:[n=>`${n} wrote a tell-all called "Spin Cycle." It's mostly about ${n}.`,n=>`${n} now does crisis communications for a cruise line. They say it's calmer.`],rat:[n=>`${n} sold your text messages to a tabloid for six figures.`]},
    smuggler:{loyal:[n=>esc?`${n} got you out, then vanished too. Every year you get a postcard with no return address.`:`${n} was never found. They used the escape route you paid for.`],rat:[n=>`${n} sold your escape route to the FBI.`]},
  };
  const crew=s.lts.map(l=>pick(FATE[l.role][l.loyalty>=45?"loyal":"rat"])(l.name));
  for(const l of s.flipped||[])crew.push(pick(FATE[l.role].rat)(l.name)+` That's how the feds knew where to look.`);
  for(const l of s.fired||[])if(Math.random()<0.5)crew.push(`${l.name}, whom you fired, gave the first interview. It ran four pages.`);
  if(crew.length)extra.push(["Your crew",shuffle(crew).slice(0,2).join(" ")]);
  const ends=[];
  if(flag(s,"A streaming producer wants to film you")===0)ends.push(`The documentary crew got an ending they didn't plan for. It won an Emmy.`);
  if(flag(s,"A journalist wants an interview")===0)ends.push(`The reporter who profiled you wrote a follow-up. It won a Pulitzer.`);
  if(flag(s,"A famous skeptic posts about you")!==undefined)ends.push(`The influencer who called you out now sells a course called "How I Spotted ${FUND}."`);
  if(flag(s,"A councilman hints at a donation")===0)ends.push(`The councilman who took your donation resigned "to spend more time with his family."`);
  if(flag(s,"A foreign businessman wants to park money")===0)ends.push(esc?`The foreign businessman's associates are also looking for you. They're more motivated than the FBI.`:`In prison, you got a fruit basket with no card. You didn't eat it.`);
  if(flag(s,"Old records in the basement")===0)ends.push(`The basement records were never recovered. The fire department still uses your alley for training.`);
  if(flag(s,"Your ex wants more alimony")===1)ends.push(`Your ex sold the movie rights to your marriage.`);
  if(flag(s,"A celebrity offers an endorsement")===0)ends.push(`The reality star who endorsed you claims they "were a victim too." They're doing a podcast about it.`);
  if(s.plantsAccepted>0)ends.push(s.plantsAccepted===1?`One investor you signed personally turned out to be working against you. You still remember the handshake.`:`${s.plantsAccepted} investors you signed personally turned out to be agents, reporters or regulators. You'd shaken every one of their hands.`);
  if(s.honestRejected>=5)ends.push(`You turned ${s.honestRejected} real investors away at your desk. They're the only ones who came out ahead.`);
  if(s.calledMom)ends.push(s.momTapped?`Your goodbye call to your mother was played at trial. She cried. So did two jurors.`:esc?`Your mother gets a postcard every year with no return address. She keeps them on the fridge.`:`Your mother visits every other Sunday. She brings the same lemon cake. You've never told her you hate lemon.`);
  if(s.shredded)ends.push(`You fed the shredder until it jammed. Investigators spent eight months taping strips back together.`);
  if(s.bribes>0&&!(s.hush||[]).length)ends.push(`The regulator who lost your file was indicted too. He blames you.`);
  if(s.rank>=4)ends.push(`For one glorious year, the Ledger called you "the Wolf of ${CITY}." They still do, but differently.`);
  if(ends.length)extra.push(["Loose ends",shuffle(ends).slice(0,2).join(" ")]);
  for(const x of shuffle(extra).slice(0,3))out.push(x);

  // Years later
  const later=esc?[
    `Years later, you lost a third of your fortune to a crypto scheme run by a charming young man. You admired his work.`,
    `Once, in an airport in Lisbon, a former investor recognized you. She didn't call the police. She just stared until you left.`,
    `You tried starting a small, honest investment club in your new town. It didn't stay honest.`,
    `The documentary about you ends on an empty chair and the words "Whereabouts unknown."`,
    `You read the ${CITY} Ledger online every morning, looking for your name. It shows up less every year.`,
    `On your birthday, an envelope arrives with no return address. Inside is a single ${CITY} Otters ticket stub. You never find out who sent it.`,
    `You learned the local language, married a fisherman's widow, and became a deacon at the church. You've never been happier. You've never slept worse.`,
    `A tourist asked to take a photo with you because you "look like that guy from the documentary." You said you get that a lot.`,
    `Every time a car slows down outside your gate, you still check the mirror.`,
    ...(s.prep.villa?[]:[`You check the news every morning for new extradition treaties.`])]
   :[...(yrs<=20?[`You were released after ${Math.max(2,Math.round(yrs*0.7))} years for good behavior. On your first day out, someone handed you a flyer for a can't-miss investment.`,
      `You got out after ${Math.max(2,Math.round(yrs*0.7))} years. You sell used cars now. You're very, very good at it.`]:[]),
    `You applied for a presidential pardon. It was denied in four minutes.`,
    `${CITY} renamed the street your office was on.`,
    `You still get letters from investors. Most are angry. One asks if you're taking new money.`,
    `A young inmate asked you to teach him "how you did it." You told him to get a real job. He laughed. So did you, eventually.`,
    `Your old office is a laundromat now. The sign still has a ghost of the ${FUND} logo if you squint.`,
    `On visiting days, nobody comes. You put on your good shirt anyway.`,
    `The prison library has three books about you. You've checked them all out, so nobody else can.`];
  out.push(["Years later",pick(later)]);
  return out;
}

// ---------- Events ----------
const big=s=>Math.max(50e3,s.owed*0.03);
const lt=c=>c.lt;
const EVENTS=[
  {t:"A retired prosecutor wants in", b:s=>`She wants to invest ${fmt(big(s))}. She asks a lot of questions.`, ch:[
    {l:"Take her money", f:s=>{const a=big(s);s.cash+=a;s.owed+=a;s.investors++;s.heat+=7;return "Her check clears. She asks for a quick look at your books.";}},
    {l:"Politely decline", f:()=>"She invests somewhere else."}]},
  {t:"An early investor wants out", when:s=>s.investors>20, b:s=>`He wants all ${fmt(Math.max(10e3,s.owed*0.04))} back, today.`, ch:[
    {l:"Pay him in full", cost:s=>Math.max(10e3,s.owed*0.04), f:s=>{s.trust+=6;return "He tells everyone how smoothly it went.";}},
    {l:"Stall him", f:s=>{s.trust-=10;s.heat+=5;return "He starts posting about it online.";}}]},
  {t:"A journalist wants an interview", b:()=>"She's writing a profile on high-performing funds.", ch:[
    {l:"Turn on the charm", f:s=>{if(Math.random()<0.5){s.heat-=8;s.trust+=5;return "The profile is glowing.";}s.heat+=12;return "The article asks how your returns are possible.";}},
    {l:"Decline", f:s=>{s.heat+=4;return "\"Declined to comment\" looks bad in print.";}}]},
  {t:"Your accountant has questions", when:s=>s.week>5&&!has(s,"cfo"), b:()=>"He says the numbers don't add up.", ch:[
    {l:"Give him a big raise", cost:s=>Math.max(20e3,s.owed*0.005), f:()=>"He stops asking."},
    {l:"Fire him", f:s=>{s.heat+=10;return "He leaves with a box of files.";}}]},
  {t:"The market crashes", when:s=>s.market!=="bust", b:()=>"Every investor in the country is nervous.", ch:[
    {l:"Hold steady", f:s=>{s.market="bust";s.trust-=15;return "Your phones ring all week.";}},
    {l:"Pay a loyalty bonus", cost:s=>Math.max(10e3,s.owed*0.02), f:s=>{s.market="bust";s.trust+=6;s.heat+=2;return "Your fund seems crash-proof. Suspiciously so.";}}]},
  {t:"A celebrity offers an endorsement", b:s=>`A reality TV star will promote ${FUND} for ${fmt(Math.max(50e3,s.owed*0.02))}.`, ch:[
    {l:"Sign the deal", cost:s=>Math.max(50e3,s.owed*0.02), f:s=>{const d=Math.max(50e3,s.owed*0.02)*4*rand(0.6,1.6),n=Math.round(d/(5e3*(1+0.04*s.week)));s.cash+=d;s.owed+=d;s.investors+=n;s.heat+=6;return `${num(n)} fans invest ${fmt(d)}.`;}},
    {l:"Pass", f:()=>"They promote a crypto coin instead."}]},
  {t:"A letter from the regulator", when:s=>s.heat>20, b:()=>"A routine request for your filings.", ch:[
    {l:"Send forged documents", f:s=>{if(Math.random()<0.7){s.heat-=6;return "They file it away.";}s.heat+=20;return "Someone noticed the font changes halfway down the page.";}},
    {l:"Ignore it", f:s=>{s.heat+=10;return "A second letter arrives. It's less polite.";}}]},
  {t:"An angry thread goes viral", when:s=>s.investors>50, b:()=>"An investor's spouse is calling you a fraud online.", ch:[
    {l:"Pay them to delete it", cost:s=>Math.max(10e3,s.owed*0.003), f:s=>{s.heat-=2;return "The thread disappears.";}},
    {l:"Ignore it", f:s=>{s.trust-=8;s.heat+=5;return "A finance blog picks it up.";}}]},
  {t:"A rival scheme collapses", b:()=>"Another fund just imploded on the evening news.", ch:[
    {l:"Lie low", f:s=>{s.trust-=6;s.heat-=4;return "You cancel the yacht party.";}},
    {l:"Say \"we're different\"", f:s=>{s.trust+=6;s.heat+=6;return "Investors believe you. Nobody at the SEC does.";}}]},
  {t:"Your mom wants to invest", when:s=>!s.momDone, b:()=>"She wants to put in her retirement savings.", ch:[
    {l:"Take her $40k", f:s=>{s.momDone=true;s.cash+=40e3;s.owed+=40e3;s.investors++;s.trust+=3;return "\"Even his own mother invests.\"";}},
    {l:"Tell her the fund is full", f:s=>{s.momDone=true;return "She's offended. You feel something unfamiliar.";}}]},
  {t:"A church group wants to invest", when:s=>s.week>4, b:s=>`150 members want to pool ${fmt(Math.max(200e3,s.owed*0.05))}.`, ch:[
    {l:"Welcome them", f:s=>{const a=Math.max(200e3,s.owed*0.05);s.cash+=a;s.owed+=a;s.investors+=150;s.heat+=5;return "The pastor mentions you in his sermon.";}},
    {l:"Decline", f:()=>"They thank you for your honesty."}]},
  {t:"Your offshore bank flags transfers", when:s=>s.stash>50e3, b:()=>"Compliance wants to know where the money comes from.", ch:[
    {l:"Pay a \"compliance fee\"", cost:s=>s.stash*0.05, from:"stash", f:()=>"The question goes away."},
    {l:"Move it all to crypto", f:s=>{s.heat+=7;return "A blockchain analyst takes an interest.";}}]},
  {t:"A whistleblower threatens to talk", when:s=>s.investors>200, b:()=>"A junior employee figured it out.", ch:[
    {l:"Pay hush money", cost:s=>Math.max(25e3,s.stash*0.08), from:"stash", f:()=>"She signs an NDA and moves to Portugal."},
    {l:"Call her bluff", f:s=>{if(Math.random()<0.5)return "She doesn't talk. Yet.";s.heat+=22;return "She talks.";}}]},
  {t:"Tax audit", when:s=>s.week>6, b:()=>"The tax office wants to review last year.", ch:[
    {l:"Hire a slick accountant", cost:s=>Math.max(15e3,s.owed*0.004), f:s=>{s.heat-=2;return "The audit finds nothing it can understand.";}},
    {l:"Ignore it", f:s=>{s.heat+=12;return "The tax office shares notes with the regulator.";}}]},
  {t:"A streaming producer wants to film you", when:s=>s.investors>300, b:()=>"A docuseries about \"the genius behind the returns.\"", ch:[
    {l:"Roll the cameras", f:s=>{s.trust+=10;s.heat+=8;return "Episode one airs. Your smile is everywhere.";}},
    {l:"Stay off camera", f:()=>"They make one about a crypto bro instead."}]},
  {t:"An investor passed away", when:s=>s.investors>100, b:s=>`The heirs want the full ${fmt(Math.max(15e3,s.owed*0.01))} account paid out.`, ch:[
    {l:"Pay the heirs", cost:s=>Math.max(15e3,s.owed*0.01), f:s=>{s.trust+=3;return "They send a thank-you card.";}},
    {l:"Contest the will", f:s=>{s.heat+=8;s.trust-=4;return "Their lawyer subpoenas your statements.";}}]},
  {t:"A copycat is using your name", when:s=>s.week>6, b:()=>`Someone is selling \"${FUND} Gold\" accounts online.`, ch:[
    {l:"Sue them", cost:s=>Math.max(30e3,s.owed*0.005), f:s=>{s.trust+=4;return "The site goes dark. You look like the victim.";}},
    {l:"Ignore it", f:s=>{s.trust-=6;s.heat+=3;return "Their victims start calling your office.";}}]},
  {t:"Your bank is closing your account", when:s=>s.heat>30, b:()=>"\"We've reviewed our relationship.\" You have 10 days.", ch:[
    {l:"Open accounts abroad", cost:s=>Math.max(40e3,s.owed*0.01), f:s=>{s.heat+=2;return "A bank in a small island nation is happy to help.";}},
    {l:"Use cash couriers", f:s=>{const l=s.cash*0.05;s.cash-=l;s.heat+=6;return `One courier vanishes with ${fmt(l)}.`;}}]},
  {t:"A councilman hints at a donation", b:()=>"He says he could \"keep people off your back.\"", ch:[
    {l:"Donate generously", cost:s=>Math.max(50e3,s.owed*0.01), f:s=>{s.heat-=10;return "He shakes your hand at a ribbon cutting.";}},
    {l:"Refuse", f:s=>{s.heat+=4;return "He asks the city to look into your permits.";}}]},
  {t:"Your ex wants more alimony", when:s=>s.stash>30e3, b:()=>"They know about the offshore account.", ch:[
    {l:"Pay up", cost:s=>Math.max(20e3,s.stash*0.1), from:"stash", f:()=>"They buy a boat. You try not to think about it."},
    {l:"Refuse", f:s=>{if(Math.random()<0.4){s.heat+=15;return "They called a reporter.";}return "They grumble but stay quiet.";}}]},
  {t:"A famous skeptic posts about you", when:s=>s.investors>500, b:()=>"A finance influencer calls your returns \"mathematically impossible.\"", ch:[
    {l:"Threaten to sue", f:s=>{if(Math.random()<0.5){s.trust+=6;return "They delete the post and apologize.";}s.heat+=10;s.trust-=6;return "They post your cease-and-desist letter. It goes viral.";}},
    {l:"Ignore it", f:s=>{s.heat+=5;s.trust-=5;return "The replies are not kind.";}}]},
  {t:"Investors want an annual meeting", when:s=>s.investors>300, b:()=>"They'd like to see the fund's performance in person.", ch:[
    {l:"Throw a lavish conference", cost:s=>Math.max(40e3,s.owed*0.01), f:s=>{s.trust+=12;return "Open bar, fireworks, and a slideshow with no numbers on it.";}},
    {l:"Send a newsletter", f:s=>{s.trust-=4;return "Some investors call it \"vague.\"";}}]},
  {t:"Angry investors demand a meeting", when:s=>s.trust<45, b:()=>"Two hundred people want answers.", ch:[
    {l:"Promise higher returns", f:s=>{s.trust+=12;if(s.rate<RATES.length-1)s.rate++;s.heat+=3;return `You announce a new ${RATES[s.rate]*100}% monthly rate. Applause.`;}},
    {l:"Skip it", f:s=>{s.trust-=10;return "They hold the meeting without you.";}}]},
  {t:"A yacht is for sale", when:s=>s.stash>600e3&&!s.yacht, b:()=>"Sixty feet, fast, and fueled for open water.", ch:[
    {l:"Buy it", cost:()=>500e3, from:"stash", f:s=>{s.yacht=true;s.heat+=4;s.trust+=5;return "Escape readiness up. Your investors see the photos and assume business is great.";}},
    {l:"Pass", f:()=>"Some tech founder buys it."}]},
  {t:"Old records in the basement", when:s=>s.week>8, b:()=>"Boxes of real numbers. The shredder is broken.", ch:[
    {l:"Burn them tonight", f:s=>{if(Math.random()<0.7){s.heat-=8;return "Ashes in the alley. Nobody saw.";}s.heat+=18;return "A neighbor filmed you.";}},
    {l:"Leave them", f:()=>"They'll keep. Probably."}]},
  {t:"A foreign businessman wants to park money", b:s=>`He wants to invest ${fmt(Math.max(300e3,s.owed*0.08))} and asks no questions.`, ch:[
    {l:"Take it", f:s=>{const a=Math.max(300e3,s.owed*0.08);s.cash+=a;s.owed+=a;s.investors++;s.heat+=10;return "The wire comes from three countries at once.";}},
    {l:"Decline", f:()=>"He says he'll remember this."}]},
  {t:"A new investor asks odd questions", when:s=>s.heat>30, b:()=>"He wants to know exactly where the returns come from. He's sweating.", ch:[
    {l:"Take his $100k", f:s=>{s.cash+=100e3;s.owed+=100e3;s.investors++;if(Math.random()<0.5){s.heat+=15;return "He was wearing a wire.";}return "He was just nervous.";}},
    {l:"Refuse his money", f:()=>"He leaves. A car picks him up outside."}]},
  // Lieutenant events
  {t:"A lieutenant wants a raise", when:s=>s.lts.length>0, lt:true, b:(s,c)=>`${lt(c).name} wants 50% more salary.`, ch:[
    {l:"Give the raise", f:(s,c)=>{lt(c).raise*=1.5;lt(c).loyalty+=25;return `${lt(c).name} is happy.`;}},
    {l:"Refuse", f:(s,c)=>{lt(c).loyalty-=20;return `${lt(c).name} goes quiet.`;}}]},
  {t:"A lieutenant has been skimming from you", when:s=>s.lts.length>0, lt:true, b:(s,c)=>`${lt(c).name} took ${fmt(Math.max(10e3,s.owed*0.01))} from the fund.`, ch:[
    {l:"Fire them", f:(s,c)=>{s.cash-=Math.max(10e3,s.owed*0.01);s.lts=s.lts.filter(x=>x!==lt(c));s.fired.push(lt(c));s.heat+=6;return `${lt(c).name} leaves angry.`;}},
    {l:"Let it slide", f:(s,c)=>{s.cash-=Math.max(10e3,s.owed*0.01);lt(c).loyalty+=10;return `${lt(c).name} appreciates your understanding.`;}}]},
  {t:"A lieutenant got arrested", when:s=>s.lts.length>0, lt:true, b:(s,c)=>`${lt(c).name} was picked up for drunk driving.`, ch:[
    {l:"Post bail", cost:()=>25e3, f:(s,c)=>{lt(c).loyalty+=15;return `${lt(c).name} is grateful and hungover.`;}},
    {l:"Leave them in there", f:(s,c)=>{lt(c).loyalty-=30;s.heat+=4;return `${lt(c).name} had a long night to think.`;}}]},
  {t:"A lieutenant wants a cut", when:s=>s.lts.length>0&&s.stash>100e3, lt:true, b:(s,c)=>`${lt(c).name} knows about the stash and wants ${fmt(s.stash*0.05)}.`, ch:[
    {l:"Pay them", cost:s=>s.stash*0.05, from:"stash", f:(s,c)=>{lt(c).loyalty+=30;return `${lt(c).name} is all in now.`;}},
    {l:"Refuse", f:(s,c)=>{lt(c).loyalty-=25;return `${lt(c).name} says \"fine\" in a way you don't like.`;}}]},
];
let curEvent=null;
function showEvent(){
  const s=S, pool=EVENTS.filter(e=>!e.when||e.when(s));
  const e=pick(pool);
  curEvent={e,lt:e.lt?pick(s.lts):null};
  modal(`<div class="tag">Month ${s.week}</div><h3>${e.t}</h3><p>${e.b(s,curEvent)}</p><div class="btns">${e.ch.map((c,i)=>{
    const cost=c.cost?c.cost(s):0, from=c.from||"cash", ok=!cost||s[from]>=cost;
    return `<button class="big ${i===0?"go":"alt"}" data-act="choose" data-v="${i}" ${ok?"":"disabled"}>${c.l}${cost?` · ${fmt(cost)}${from==="stash"?" from stash":""}`:""}</button>`;}).join("")}</div>`);
}
function resolveEvent(i){
  const s=S, {e}=curEvent, c=e.ch[i], cost=c.cost?c.cost(s):0;
  if(cost)s[c.from||"cash"]-=cost;
  s.flags[e.t]=i;
  s.notes.push(`<b>${e.t}.</b> ${c.f(s,curEvent)}`);
  curEvent=null; closeModal(); raidCheck();
}

// ---------- UI plumbing ----------
function modal(html,cls){const c=document.getElementById("card");c.className="card"+(cls?" "+cls:"");c.innerHTML=html;document.getElementById("modal").hidden=false;c.scrollTop=0;}
function closeModal(){document.getElementById("modal").hidden=true;}
const modalOpen=()=>!document.getElementById("modal").hidden;
const ACT={
  rate:v=>{S.rate=+v;render();},
  mkt:v=>{S.mkt=+v;render();},
  cover:v=>{S.cover=v;render();},
  buy:v=>{const p=PREP.find(x=>x.id===v);if(S.prep[v]||S.stash<p.cost)return;S.stash-=p.cost;S.prep[v]=true;if(p.heat)S.heat=clamp(S.heat+p.heat,0,100);S.notes.push(`You bought: ${p.name}.`);render();showPlan();},
  hire:v=>{if(S.lts.length>=MAX_LTS||has(S,v))return;const c=S.candidates.find(x=>x.role===v);S.lts.push({role:v,name:c.name,raise:1,loyalty:Math.round(rand(55,80))});S.notes.push(`You hired ${c.name} as ${role(v).title}.`);render();showCrew();},
  fire:v=>{const l=S.lts.find(x=>x.role===v);if(!l)return;S.lts=S.lts.filter(x=>x!==l);S.fired.push(l);S.heat=clamp(S.heat+(l.loyalty<50?6:2),0,100);
    const used=new Set([...S.lts.map(x=>x.name),...S.candidates.map(x=>x.name)]);const nm=NAMES.find(n=>!used.has(n))||l.name;
    S.candidates=S.candidates.map(c=>c.role===v?{role:v,name:nm}:c);S.notes.push(`You fired ${l.name}. They took their keycard with them.`);render();showCrew();},
  bonus:v=>{const l=S.lts.find(x=>x.role===v);if(!l)return;const b=salary(S,l)*4;if(S.cash<b)return;S.cash-=b;l.loyalty=clamp(l.loyalty+20,0,100);S.notes.push(`${l.name} got a ${fmt(b)} bonus.`);render();showCrew();},
  paper:()=>showGazette(),
  report:()=>showReport(),
  crew:()=>showCrew(),
  plan:()=>showPlan(),
  help:()=>showHelp(),
  book:()=>showBook(),
  story:()=>showStory(),
  life:()=>showLife(),
  buylife:v=>buyLife(v),
  snd:()=>{setSound(!SND.on);render();},
  pitch:()=>showPitch(),
  dopitch:v=>doPitch(+v),
  speech:v=>doSpeech(+v),
  bullpen:()=>renderBullpen(),
  rankinfo:()=>showRankInfo(),
  risk:v=>doRisk(+v),
  riskskip:()=>closeModal(),
  raidrun:()=>{stopRaid();attemptEscape(S.prep.jet?5:20,"raid");},
  raidgrab:()=>{const s=S;if(s.raidGrab)return;const amt=Math.max(0,Math.round(s.cash*0.5));s.cash-=amt;s.stash+=amt;s.raidGrab=true;s.raidT-=4;play("coins");raidModal();},
  raidgive:()=>{stopRaid();ending("caught",null,"surrender");},
  end:()=>{if(!modalOpen())startDesk();},
  dchk:v=>deskCheck(v),
  ddec:v=>deskDecide(v),
  dopt:v=>{const [f,o]=v.split(":").map(Number);S.desk.q[S.desk.i].fields[f].pick=o;renderDesk();},
  dclose:()=>{S.desk=null;endWeek();},
  run:()=>{if(!modalOpen())confirmRun();},
  flee:v=>{if(+v===0)beginRun();else attemptEscape(+v);},
  staydeal:()=>stayDeal(),
  startnight:()=>startNight(false),
  nightcollapse:()=>startNight(true),
  nightpick:v=>nightPick(+v),
  caught:()=>ending("caught",null,"surrender"),
  close:()=>closeModal(),
  choose:v=>resolveEvent(+v),
  restart:()=>{stopRaid();stopNight();S=newGame();shown=null;closeModal();render();window.scrollTo(0,0);showGazette();},
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;ACT[b.dataset.act]?.(b.dataset.v);});

if(typeof window.claude?.hot?.snapshot==="function")window.claude.hot.snapshot(()=>({S}));
const start=d=>{S=d&&d.S&&d.S.gazette?Object.assign(newGame(),d.S):newGame();if(S.desk)renderDesk();else render();if(!(d&&d.S))showGazette();};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
