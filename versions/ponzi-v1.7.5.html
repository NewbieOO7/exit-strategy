<title>Exit Strategy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one screen, never a page scroll. Planning: status strip, one panel of compact control rows, actions at the bottom. The desk is its own screen with the document in the middle. Sizes are in rem and the root size follows the viewport, so everything shrinks to fit shorter phones. Single dark look by choice; documents and the Ledger are newsprint. */
:root{
  --bg:#0f1512; --panel:#17201b; --panel2:#1e2a23; --line:#2b3a31; --fg:#e8efe9; --muted:#8fa497;
  --money:#5fd48a; --gold:#e9c46a; --danger:#ff6b5b; --warn:#f4a259; --chipon:#2c2a1a;
  --paper:#efe9da; --ink:#1d1b17; --inkmuted:#5d574b; --rule:#1d1b17;
  --idbg:#d9e4ec; --idline:#9fb3c2; --idhead:#4a6274; --note:#fff8c9;
  --cold:#0b1018; --sky:#141c22; --narr:#d8cfa8; --stamp:#e2483a;
  --display:"Archivo Black", Impact, "Arial Black", sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --news:"Old Standard TT", Georgia, "Times New Roman", serif;
  --script:"Caveat", "Segoe Script", "Brush Script MT", cursive;
  color-scheme:dark;
}
html{font-size:clamp(10.5px,min(1.9vh,3.9vw),15px)}
@supports (height:1dvh){html{font-size:clamp(10.5px,min(1.9dvh,3.9vw),15px)}}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
.screen{box-sizing:border-box;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:.55rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.6rem;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.warn{color:var(--warn)} .bad{color:var(--danger)} .good{color:var(--money)}

/* Planning screen */
.bar{display:flex;align-items:center;gap:.5rem}
.brand{font-family:var(--display);font-size:1.1rem;letter-spacing:.5px;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-left:.3rem;letter-spacing:0}
.week{flex:1;text-align:center;font-family:var(--display);font-size:1.1rem;color:var(--gold);white-space:nowrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.4rem .65rem;font-size:.8rem;white-space:nowrap}
.chip.paper{background:var(--paper);color:var(--ink);border-color:var(--paper);font-family:var(--news);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:.3rem .45rem;min-width:0}
.stat .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--mono);font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.v.money{color:var(--money)} .v.gold{color:var(--gold)} .v.neg{color:var(--danger)}
.trust{display:flex;align-items:center;gap:.5rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.trust b{font-size:.78rem;text-transform:none;letter-spacing:0;font-weight:600;min-width:5.2rem;text-align:right}
.tbar{flex:1;height:.45rem;background:var(--panel2);border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--money);transition:width .4s}
.last{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.last .k{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.last .ln1{font-family:var(--mono);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last .ln2{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last em{font-style:normal;color:var(--gold)}
.panel{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 .7rem;display:flex;flex-direction:column;justify-content:space-around}
.row{display:grid;grid-template-columns:6.2rem minmax(0,1fr);align-items:center;gap:.6rem;padding:.4rem 0}
.row+.row{border-top:1px solid var(--line)}
.lab{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:.1rem}
.lab small{font-size:.68rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);opacity:.8;line-height:1.25}
.seg{display:flex;gap:.3rem}
.seg button{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.5rem .15rem;font-size:.82rem}
.seg.mono button{font-family:var(--mono)}
.seg button.on{border-color:var(--gold);background:var(--chipon);color:var(--gold)}
.step{display:flex;align-items:center;gap:.4rem}
.step button{width:2.3rem;height:2.3rem;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:7px;font-size:1.1rem}
.step span{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column}
.step b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step small{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.skim{display:flex;align-items:center;gap:.6rem}
.skim input{flex:1;min-width:0;accent-color:var(--gold)}
.skim b{font-family:var(--mono);font-size:.85rem;min-width:2.6rem;text-align:right}
.crew{display:flex;gap:.3rem}
.slot{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.5rem .3rem;font-size:.76rem;display:flex;align-items:center;justify-content:center;gap:.3rem}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty{border-style:dashed;color:var(--muted)}
.dot{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.planbtn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.55rem .7rem;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.forecast{font-size:.76rem;display:flex;justify-content:space-between;gap:.6rem;padding:0 .15rem;min-height:1.1em}
.forecast b{font-family:var(--mono);font-weight:500}
.actions{display:flex;gap:.6rem}
.big{border:none;border-radius:9px;padding:.85rem .5rem;font-family:var(--display);font-size:1rem;letter-spacing:.5px}
.big.go{flex:2;background:var(--money);color:#0b1a10}
.big.run{flex:1;background:var(--danger);color:#1d0806}
.big.alt{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.wide{width:100%}

/* Desk screen */
.deskhead{display:flex;align-items:center;gap:.7rem}
.clock{font-family:var(--display);font-size:1.8rem;color:var(--gold);line-height:1}
.clock.late{color:var(--danger)}
.deskhead .k{font-size:.68rem;color:var(--muted);margin-top:.15rem}
.tray{flex:1;font-family:var(--mono);font-size:.76rem;color:var(--muted);text-align:center;line-height:1.3}
.tools{display:flex;flex-direction:column;gap:.3rem}
.tools .chip{font-size:.74rem;padding:.3rem .55rem}
.docwrap{flex:1;min-height:0;overflow:auto;border-radius:3px}
.doc{background:var(--paper);color:var(--ink);border-radius:3px;padding:.8rem;display:flex;flex-direction:column;gap:.55rem;font-family:var(--news);min-height:100%}
.doctype{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;border-bottom:2px solid var(--rule);padding-bottom:.25rem;display:flex;justify-content:space-between;gap:.5rem}
.doctype span{font-weight:400;text-transform:none;letter-spacing:0;font-style:italic;color:var(--inkmuted);text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;font-size:.92rem}
.kv span{color:var(--inkmuted)} .kv b{min-width:0;overflow-wrap:anywhere}
.quote{margin:0;font-style:italic;font-size:.92rem}
.idcard{background:var(--idbg);color:var(--ink);border:1px solid var(--idline);border-radius:8px;padding:.45rem .65rem;font-family:var(--mono);font-size:.8rem;display:flex;flex-wrap:wrap;gap:.15rem .9rem}
.idcard .idh{width:100%;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--idhead)}
.idcard b{width:100%}
.found{font-family:var(--body);font-size:.78rem;background:var(--note);color:var(--ink);padding:.35rem .5rem;border-radius:2px}
.fld{display:flex;flex-direction:column;gap:.25rem}
.fld>span{font-size:.72rem;color:var(--inkmuted);text-transform:uppercase;letter-spacing:.06em}
.fopt{font-family:var(--body);font-size:.84rem;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--inkmuted);border-radius:4px;padding:.4rem .6rem}
.fopt.on{background:var(--ink);color:var(--paper)}
.deskacts{display:flex;gap:.4rem}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.55rem .45rem;font-size:.8rem}
.deskacts .mini{flex:1}
.deskdec{display:flex;gap:.5rem}
.deskdec .big{flex:1;font-size:.92rem;padding:.85rem .3rem}
.daylog{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.4rem}
.mh{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:600}
.news{border-left:3px solid var(--warn);padding-left:.5rem;font-size:.82rem}

/* Overlays */
.modal{position:fixed;inset:0;background:rgba(5,8,6,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.1rem;max-width:440px;width:100%;display:flex;flex-direction:column;gap:.7rem;max-height:100%;overflow:auto;font-size:.95rem}
.card h3{font-family:var(--display);font-size:1.25rem;margin:0;text-wrap:balance}
.card p{margin:0}
.card .btns{display:flex;flex-direction:column;gap:.5rem}
.card .btns .big{width:100%}
.card .tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.report{display:flex;flex-direction:column;gap:.3rem;font-size:.88rem}
.report .ln{display:flex;justify-content:space-between;gap:.6rem;font-variant-numeric:tabular-nums}
.report .ln span:last-child{font-family:var(--mono)}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{display:flex;justify-content:space-between;gap:.6rem;text-align:left;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.55rem .7rem}
.opt .nm{min-width:0}
.opt .nm small{display:block;color:var(--muted);font-size:.75rem}
.opt .c{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
.opt.owned{border-style:dashed;cursor:default}
.lt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.6rem;display:flex;flex-direction:column;gap:.35rem}
.lt .top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.lt .top b{min-width:0}
.lt .top span{font-size:.75rem;white-space:nowrap}
.lt small{color:var(--muted);font-size:.75rem}
.lt .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.rule{margin:0;font-size:.88rem;padding-left:.6rem;border-left:3px solid var(--gold)}
.cover{display:grid;gap:.45rem;font-size:.88rem}
.cover div{display:flex;flex-direction:column}
.cover span{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cover b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.card.paper{background:var(--paper);color:var(--ink);border-color:var(--paper);border-radius:3px;font-family:var(--news)}
.mast{font-family:var(--news);font-weight:700;font-size:1.6rem;text-align:center;line-height:1.05;border-bottom:3px double var(--rule);padding-bottom:.35rem;text-wrap:balance}
.dateline{display:flex;justify-content:space-between;font-size:.72rem;border-bottom:1px solid var(--rule);padding-bottom:.25rem;color:var(--inkmuted);font-style:italic}
.lead h4{font-size:1.35rem;line-height:1.1;margin:0 0 .2rem;text-wrap:balance}
.lead p,.story p{margin:0;font-size:.8rem;color:var(--inkmuted)}
.stories{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .8rem;border-top:1px solid var(--rule);padding-top:.55rem}
.story{min-width:0}
.story h5{font-size:.9rem;line-height:1.15;margin:0 0 .1rem;text-wrap:balance}
.tipnote{font-family:var(--body);font-size:.8rem;background:var(--note);color:var(--ink);padding:.45rem .6rem;transform:rotate(-1deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.card.paper .big{font-family:var(--display)}
.card.paper .big.alt{background:var(--ink);color:var(--paper);border:none}
.headline{font-family:var(--news);font-weight:700;font-size:1.2rem;background:var(--paper);color:var(--ink);padding:.6rem .75rem;border-radius:3px;text-wrap:balance}
.ep{display:flex;flex-direction:column;gap:.2rem}
.ep p{font-size:.88rem;line-height:1.45}
.endstats{border-top:1px solid var(--line);padding-top:.6rem;display:grid;grid-template-columns:1fr auto;gap:.25rem .8rem;font-size:.88rem}
.endstats span:nth-child(even){font-family:var(--mono);text-align:right}
.big.wide,.wide{width:100%;flex:none}
#blackout{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none;transition:opacity .2s}
#blackout.on{opacity:1;pointer-events:auto}
#blackout.flash{animation:police .9s steps(1) forwards}
@keyframes police{0%{background:#d0101c}22%{background:#000}44%{background:#1238d0}66%{background:#000}100%{background:#000}}
button.brand{background:none;border:none;padding:0;text-align:left;font-family:var(--display);font-size:1.1rem;letter-spacing:.5px;cursor:pointer}
.perks{display:flex;flex-direction:column;gap:.25rem;text-align:left;font-size:.86rem}
.perks p{margin:0}
.pen{flex:1;min-height:0;border-radius:10px;overflow:hidden;background:#151d18}
.pen svg{display:block;width:100%;height:100%}
.fx{margin:0;font-size:.85rem;font-weight:600}
.pp-dial{animation:rush .45s ease-in-out infinite alternate}
@keyframes rush{from{transform:translateX(-3px) rotate(-2deg)}to{transform:translateX(3px) rotate(2deg)}}
.ringl{animation:blinkr .35s steps(2) infinite}
@keyframes blinkr{50%{opacity:0}}
.pp-late .sq{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.pp-late{animation:slump 3s ease-in-out infinite}
@keyframes slump{50%{transform:translateY(2px)}}
.pp-riled{animation:jump .42s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-7px)}}
.flashlite{animation:flashl 1.3s steps(1) infinite}
@keyframes flashl{0%{opacity:0}10%{opacity:.12}20%{opacity:0}60%{opacity:.08}70%{opacity:0}}

/* Feel: the rush and the dread */
body{background:var(--bg);background:color-mix(in srgb,var(--bg),var(--cold) calc(var(--chill,0)*80%))}
.screen>:not(.street){filter:saturate(calc(1 - var(--chill,0)*.55))}
.street{position:relative;z-index:18;box-shadow:0 0 0 1px #2b3a31,0 0 1.2rem rgba(233,196,106,.08)}
.cruise{animation:cruise 10s linear infinite}
@keyframes cruise{from{transform:translateX(-90px)}to{transform:translateX(400px)}}
.ping{animation:ping 1.2s ease-out 3;opacity:0}
@keyframes ping{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.4)}}
.ping{transform-box:fill-box;transform-origin:center}
.blink{animation:blinkr .8s steps(2) infinite}
.whale{font-style:normal!important;background:var(--gold);color:#2a2005!important;padding:0 .45rem;border-radius:3px;letter-spacing:.12em;font-weight:700}
.whaledoc{box-shadow:inset 0 0 0 3px var(--gold)}
.whalenote{color:var(--gold)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 calc(var(--dark,0)*16rem) calc(var(--dark,0)*6rem) rgba(0,0,0,calc(var(--dark,0)*.95))}
body.dread::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:16;box-shadow:inset 0 0 7rem 1.2rem rgba(170,20,20,.4);animation:dreadpulse 1.05s ease-in-out infinite}
@keyframes dreadpulse{0%,100%{opacity:.25}12%{opacity:1}30%{opacity:.4}42%{opacity:.85}}
.brand{display:flex;flex-direction:column;line-height:1.1;color:var(--gold)}
.brand small{margin:0;font-family:var(--body);font-size:.62rem;color:var(--muted)}
.week{color:var(--fg)}
button.stat{font:inherit;color:inherit;text-align:left}
.stat .k em{font-style:normal;color:var(--gold)}
.street{height:4.2rem;flex:none;border-radius:7px;overflow:hidden;background:var(--sky)}
.cig{animation:cig 2.6s ease-in-out infinite}
@keyframes cig{0%,100%{opacity:.25}45%{opacity:1}}
.rain{animation:rain .5s linear infinite}
@keyframes rain{to{transform:translate(-4px,9px)}}
.sig{font-family:var(--script);font-weight:400;font-size:1.15em;letter-spacing:.02em}
.speech button small{display:block;font-family:var(--body);font-style:normal;font-size:.72rem;color:var(--muted);margin-top:.1rem}
.street svg{display:block;width:100%;height:100%}
.narr{margin:0;font-family:var(--news);font-style:italic;font-size:.84rem;color:var(--narr);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.coin{position:absolute;left:50%;top:45%;width:.9rem;height:.9rem;margin:-.45rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#a8801f);animation:coin 1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:1}55%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}100%{transform:translate(calc(var(--dx)*1.15),calc(var(--dy) + 9rem)) scale(.9);opacity:0}}
.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg);border:.3rem solid var(--stamp);color:var(--stamp);border-radius:.5rem;padding:.3rem 1rem;text-align:center;font-family:var(--display);background:rgba(239,233,218,.08);animation:stampin 1.4s ease-out forwards}
.stamp b{display:block;font-size:2.6rem;letter-spacing:.15em;line-height:1}
.stamp span{display:block;font-size:1.3rem;color:var(--money);letter-spacing:.05em}
.stamp.no{border-color:var(--muted);color:var(--muted)}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-16deg) scale(2.6);opacity:0}16%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}78%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.takebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.2rem;align-items:center;text-align:center}
.take{font-family:var(--display);font-size:2.6rem;color:var(--money);line-height:1.05;font-variant-numeric:tabular-nums}
.speech{display:flex;flex-direction:column;gap:.35rem}
.speech button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.5rem .7rem;font-family:var(--news);font-style:italic;font-size:.88rem;text-align:left}
.card.gold{background:linear-gradient(165deg,#3b3012,var(--panel) 70%);border-color:var(--gold);text-align:center}
.rk{font-family:var(--display);font-size:2.6rem;color:var(--gold);line-height:1;letter-spacing:.04em}
.card.raid{border:2px solid var(--danger);animation:alarm 1s infinite}
@keyframes alarm{50%{box-shadow:0 0 2.5rem rgba(255,107,91,.45)}}
.count{font-family:var(--display);font-size:4.2rem;color:var(--danger);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}.coin,.stamp,.shake,.card.raid{animation-duration:.01s}.rain,.cig,.pp,.ringl,.sq,.flashlite,.cruise,.ping,.blink,body.dread::before{animation:none}}
</style>

<div class="screen" id="app"></div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<div id="fx" aria-hidden="true"></div>
<div id="blackout" aria-hidden="true"></div>

<script>
const VERSION = "1.7.5";
const FUND = "Evergreen Capital";
const CITY = "Port Ashford";
const RATES = [0.01, 0.02, 0.03, 0.05, 0.08];

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const randn=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function fmt(n){const a=Math.abs(n),s=n<0?"−":"";
  if(a>=1e9)return s+"$"+(a/1e9).toFixed(2)+"B";
  if(a>=1e6)return s+"$"+(a/1e6).toFixed(a>=1e8?0:1)+"M";
  if(a>=1e3)return s+"$"+(a/1e3).toFixed(a>=1e5?0:1)+"k";
  return s+"$"+Math.round(a);}
const num=n=>Math.round(n).toLocaleString("en-US");

const tierOf=h=>h<15?0:h<35?1:h<55?2:h<75?3:h<90?4:5;
const HEAT_WORDS=["Nobody's looking","Some online chatter","A reporter is digging","Regulators opened a file","Federal investigation","Agents are closing in"];
function trustLabel(t){return t>=75?"Devoted":t>=50?"Confident":t>=30?"Uneasy":t>=15?"Nervous":"Panicking";}
function loyaltyLabel(l){return l>=75?"Devoted":l>=55?"Loyal":l>=35?"Restless":"Shifty";}
const has=(s,id)=>s.lts.some(l=>l.role===id);
const role=id=>ROLES.find(r=>r.id===id);
const salary=(s,l)=>Math.round(role(l.role).base*(1+s.owed/20e6)*l.raise);
const payroll=s=>s.lts.reduce((t,l)=>t+salary(s,l),0);
const hushTotal=s=>(s.hush||[]).reduce((t,h)=>t+h.amt,0);
const upkeep=s=>payroll(s)+hushTotal(s);

function withdrawFrac(s){const r=RATES[s.rate];const panic=s.trust<40?(40-s.trust)/40*0.15:0;return (0.02+0.5*r)*MARKET[s.market].wd+panic;}
function raidChance(s){const h=s.heat;return (h<35?0:Math.pow((h-35)/65,2)*0.4)*(has(s,"lawyer")?0.7:1);}
function readiness(s){let o=20;for(const p of PREP)if(s.prep[p.id])o+=p.odds;if(has(s,"smuggler"))o+=15;if(s.yacht)o+=10;if(s.life&&s.life.island)o+=10;return o;}
function readyLabel(r){return r<30?"Poor":r<50?"Fair":r<70?"Good":r<90?"Strong":"Excellent";}
function escapeOdds(s,pen=0){return clamp(Math.round(readiness(s)-pen-s.heat*0.3),5,95);}

const coverCost=s=>COVERS.find(c=>c.id===s.cover).cost(s.owed);

function makeGazette(s){
  const used=new Set(), items=[];
  const take=pool=>{let o=pool.filter(x=>!used.has(x[0]));if(!o.length)o=pool;const x=pick(o);used.add(x[0]);return x.map(t=>t.replace("{pct}",RATES[s.rate]*100));};
  const signal=()=>take(SIGNALS[tierOf(clamp(s.heat+randn()*12,0,100))]);
  items.push(signal());
  if(Math.random()<0.6)items.push(signal());
  items.push(take(MARKET_NEWS[s.market]));
  // While nobody's looking, the paper loves you.
  if((tierOf(s.heat)<=1||(s.rank>=4&&tierOf(s.heat)<=2))&&s.week>1&&Math.random()<0.7)items.push(take(PUFF));
  for(const r of (s.repos||[]).splice(0))items.push(r);
  if(Math.random()<0.6)items.push(take(HERRINGS));
  if(s.lts.some(l=>l.loyalty<30)&&Math.random()<0.7)items.push(["Insider at unnamed fund said to be talking to prosecutors","Sources describe the person as \"senior staff.\""]);
  for(const m of MILESTONES)if(!s.milestones[m.k]&&m.t(s)){s.milestones[m.k]=true;items.push(m.h);break;}
  const news=shuffle(items);
  // Lead with the market if it just turned; otherwise a random real story.
  let lead=s.marketShift?news.findIndex(x=>MARKET_NEWS[s.market].some(m=>m[0]===x[0])):0;
  if(lead<0)lead=0;
  const leadItem=news.splice(lead,1)[0];
  while(news.length<4)news.push(take(FILLER));
  // The source only calls now and then, and is wrong about a third of the time.
  const tip=has(s,"source")&&Math.random()<0.35?TIPS[clamp(tierOf(s.heat)+(Math.random()<0.35?pick([-2,-1,1,2]):0),0,5)]:null;
  return {week:s.week,lead:leadItem,items:news,tip};
}
function gazetteDate(w){return gameDate(w).toLocaleDateString("en-US",{month:"long",year:"numeric"});}

}

const $=id=>document.getElementById(id);

const loyColor=l=>l<35?"var(--danger)":l<55?"var(--warn)":"var(--money)";
const plain=t=>t.replace(/<[^>]+>/g,"");
// Drop selections the player can no longer afford.
function fixSelections(){
  const avail=S.cash-upkeep(S);
  if(MKT[S.mkt].cost>avail){let i=S.mkt;while(i>0&&MKT[i].cost>avail)i--;S.mkt=i;}
  if(coverCost(S)>avail-MKT[S.mkt].cost)S.cover="none";
}

function updateSkim(){
  const s=S, left=Math.max(0,s.cash-upkeep(s)-MKT[s.mkt].cost-coverCost(s)), skim=Math.floor(left*s.skim), after=left-skim;
  const due=s.owed*(1+RATES[s.rate])*withdrawFrac(s);
  $("skimPct").textContent=Math.round(s.skim*100)+"%";
  $("skimAmt").textContent=skim?`${fmt(skim)} to you`:"Nothing";
  $("forecast").innerHTML=`<span>Cash after spending <b>${fmt(after)}</b></span>
    <span class="${due>after*2?"bad":due>after?"warn":""}">Payouts due ≈ <b>${fmt(due)}</b></span>`;
}

// ---------- Weekly simulation ----------
function endWeek(){
  const s=S, r=RATES[s.rate], m=MKT[s.mkt], notes=s.revealNext.slice();
  s.revealNext=[];
  let dHeat=0, dTrust=0;
  const cfo=has(s,"cfo")?0.7:1;

  const pay=payroll(s);
  if(s.cash>=pay){s.cash-=pay;for(const l of s.lts)l.loyalty+=1;}
  else if(pay>0){s.cash=Math.max(0,s.cash-pay);for(const l of s.lts)l.loyalty-=20;notes.push("You couldn't make payroll. Your lieutenants noticed.");}

  // Everyone you've bribed wants paying, every month. Miss a payment and they talk.
  let hushPaid=0;
  for(const h of s.hush.slice()){
    if(s.cash>=h.amt){s.cash-=h.amt;hushPaid+=h.amt;}
    else{s.hush=s.hush.filter(x=>x!==h);dHeat+=10;notes.push(`You missed ${h.who}'s payment. ${h.who} stopped taking your calls.`);}
  }

  const cvCost=coverCost(s);
  s.cash-=m.cost+cvCost;
  // The hotter it gets, the less your fixes work. You keep trying anyway.
  const fixPower=clamp(1-s.heat/130,0.25,1), weak=fixPower<0.6;
  if(s.cover==="audit"){dHeat-=8*fixPower;dTrust+=2;notes.push(weak?"The audit landed with a thud. Nobody seemed reassured.":"A respectable-looking firm signs off on your books.");}
  if(s.cover==="gala"){dTrust+=5;dHeat-=3*fixPower;notes.push(weak?"Your gala made the papers. Mostly the photos of the champagne tower.":"Your charity gala makes the society pages.");}
  if(s.cover==="bribe"){s.bribes++;
    if(Math.random()<0.15+s.heat/250){dHeat+=25;notes.push("The regulator you tried to bribe reported you.");}
    else{dHeat-=15*fixPower;const who=pick(HUSH_NAMES.filter(n=>!s.hush.some(h=>h.who===n)))||"Another regulator",amt=Math.round(cvCost*0.25/1e3)*1e3;
      s.hush.push({who,amt});notes.push(`A regulator quietly loses your file. ${who} now expects a "consulting fee" of ${fmt(amt)} every month.`);}}
  s.cover="none";

  const skim=Math.floor(Math.max(0,s.cash)*s.skim);
  s.cash-=skim; s.stash+=skim; s.totalSkim+=skim;
  dHeat+=skim/Math.max(s.owed,50e3)*20*(s.prep.shells?0.5:1)*cfo;

  const trustF=Math.max(0.1,s.trust/70);
  const leads=m.leads+s.investors*0.03;
  const newInv=Math.max(0,Math.round(leads*APPEAL[s.rate]*trustF*MARKET[s.market].rec*(has(s,"marketer")?1.3:1)*rand(0.7,1.3)));
  const dep=Math.round(newInv*5e3*(1+0.04*s.week)*rand(0.8,1.2));
  s.investors+=newInv; s.cash+=dep; s.owed+=dep;

  s.owed+=s.owed*r;
  const wf=withdrawFrac(s), due=s.owed*wf, paid=Math.min(Math.max(s.cash,0),due);
  s.cash-=paid; s.owed-=paid;
  const left=Math.min(s.investors,Math.round(s.investors*(0.006+Math.max(0,wf-0.02-0.5*r)*0.5)));
  s.investors-=left;

  if(due>0&&paid<due*0.999){s.missed++;dTrust-=22;dHeat+=12;for(const l of s.lts)l.loyalty-=5;notes.push(`You missed ${fmt(due-paid)} in payouts. Investors are calling the office.`);}
  else{s.missed=0;dTrust+=r>=0.05?1:0.5;}
  if(has(s,"pr"))dTrust+=1;
  if(s.market==="bust")dTrust-=2;
  // Trust doesn't build itself. Left alone, it drifts back to lukewarm.
  dTrust+=(50-s.trust)*0.06;

  // The good life costs money every month. If the stash can't cover it, it gets repossessed, in public.
  let lifeUp=0;
  for(const it of LIFE.filter(x=>x.upkeep&&s.life[x.id])){
    if(s.stash>=it.upkeep){s.stash-=it.upkeep;lifeUp+=it.upkeep;}
    else{s.life[it.id]=false;if(it.id==="yacht")s.yacht=false;dTrust-=15;dHeat+=5;s.repos.push(it.repo);
      notes.push(`Repo men took your ${it.name.toLowerCase()}. In daylight, with a crowd watching.`);}
  }

  dHeat+=(0.6*Math.log10(Math.max(s.owed,1e4)/1e4)+s.investors/1000*0.3)*cfo+m.heat+Math.max(0,r-0.03)*80-1;
  if(s.trust<30)dHeat+=2;
  dHeat+=RANKS[s.rank].heat;
  s.heat=clamp(s.heat+dHeat,0,100); s.trust=clamp(s.trust+dTrust,0,100);

  // Lieutenants get nervous when things are hot. Shifty ones may flip.
  for(const l of s.lts.slice()){
    if(s.heat>50)l.loyalty-=(s.heat-50)/8;
    l.loyalty=clamp(l.loyalty,0,100);
    if(l.loyalty<30&&Math.random()<(30-l.loyalty)/60){
      s.lts=s.lts.filter(x=>x!==l);s.flipped.push(l);s.heat=clamp(s.heat+25,0,100);
      notes.push(`${l.name} stopped coming to work. Their desk has been cleaned out.`);
    }
  }

  // Market drifts between boom, normal and bust.
  s.marketShift=false;
  if(Math.random()<0.12){s.market=s.market==="normal"?pick(["boom","bust"]):"normal";s.marketShift=true;}

  s.peakOwed=Math.max(s.peakOwed,s.owed); s.peakInv=Math.max(s.peakInv,s.investors);
  const nr=rankOf(s);if(nr>s.rank){s.rank=nr;s.rankUp=true;
    // Bigger fund, bigger names. The lie changes, and you have to keep up with it.
    if(nr>=2){s.story.auditor=decoy(s,"auditor");s.story.bank=decoy(s,"bank");
      notes.push(`<b>Your cover story changed.</b> Bigger fund, bigger names: your auditor is now ${s.story.auditor}, and your money "sits" at ${s.story.bank}.`);}}
  const nx=RANKS[s.rank+1];if(nx&&s.peakOwed>=nx.min&&image(s)<nx.img&&s.imgHint!==s.rank+1){s.imgHint=s.rank+1;notes.push(`You have the money to be a ${nx.t.toLowerCase()}. You don't look like one yet. (Image ${image(s)} of ${nx.img}. Tap your stash.)`);}
  // What the player feels instead of sees: a noisy reading of the heat.
  s.chill=clamp((s.heat+randn()*8)/100,0,1);
  s.prevCar=s.carSeen;s.prevVan=s.vanSeen;
  s.carSeen=Math.random()<clamp((s.heat-20)/80,0,1)*0.9;
  s.vanSeen=s.carSeen&&s.chill>0.7&&Math.random()<0.7;
  s.narr=narrate(s);
  s.report={newInv,dep,due,paid,skim,left,pay,hush:hushPaid,life:lifeUp,spend:m.cost+cvCost};
  s.reportedAUM=s.owed; s.claimed+=r*100;
  const known=rulesKnown(s).length;
  s.week++;
  for(const rl of rulesKnown(s).slice(known))notes.push(`<b>New page in your black book:</b> ${rl.t}`);
  s.notes=notes;

  if(s.missed>=2||s.trust<=0){collapse();return;}
  if(s.week>=3&&Math.random()<0.55){showEvent();return;}
  raidCheck();
}

function raidCheck(){
  const s=S; s.heat=clamp(s.heat,0,100); s.trust=clamp(s.trust,0,100);
  for(const l of s.lts)l.loyalty=clamp(l.loyalty,0,100);
  if(Math.random()<raidChance(s)){startRaid();return;}
  s.gazette=makeGazette(s);
  render();
  if(s.rankUp){s.rankUp=false;showRankUp();}else showGazette();
}

function collapse(){
  const s=S;
  modal(`<div class="tag">Month ${s.week}</div><h3>The fund has collapsed</h3><p>You can't pay what you owe and investors are lining up outside. The authorities will be here within hours.</p>
    <p>Escape readiness: ${readyLabel(readiness(s))}. If you make it, you keep ${fmt(s.stash*keepShare(s))}.</p>
    <p class="hint">You'll have 30 seconds.</p>
    <div class="btns"><button class="big run" data-act="nightcollapse">Run</button></div>`);
}

function confirmRun(){
  const s=S;

    <p class="hint">Once you start, you'll have 45 seconds to get out.</p>
    <div class="btns"><button class="big run" data-act="flee" data-v="0">Disappear</button><button class="big alt" data-act="close">Stay another month</button></div>`);

function attemptEscape(pen,how){
  const o=escapeOdds(S,pen);
  ending(Math.random()*100<o?"escaped":"failed",o,how||(pen===20?"collapse":"run"));
}

function sentence(s){return Math.round(clamp(4+Math.log10(Math.max(s.owed+s.totalSkim,1e5)/1e5)*35,4,150)*(has(s,"lawyer")?0.5:1)*(s.calledLawyer?0.8:1));}
function ending(kind,odds,how){
  const s=S, kept=Math.round(s.stash*keepShare(s));
  const tag=kind==="escaped"?"You got away":"Caught";
  const head=pick(kind==="escaped"?[`${FUND} founder vanishes; ${fmt(s.peakOwed)} missing`,`Where is ${FUND}'s founder?`,`${FUND} offices found empty except for a fern`]
    :kind==="failed"?[`${FUND} founder caught fleeing`,`Fund boss nabbed on the way out`,`${FUND} founder's getaway ends early`]
    :[`Federal agents raid ${FUND}`,`${FUND} founder in handcuffs`,`"Nothing but upside": ${FUND} founder arrested`]);
  const story=epilogue(s,kind,how).map(([h,t])=>`<div class="ep"><div class="tag">${h}</div><p>${t}</p></div>`).join("");
  const score=kind==="escaped"?kept:0;
  let best=0;try{best=+localStorage.getItem("ponzi-best")||0;if(score>best)localStorage.setItem("ponzi-best",score);}catch(e){}
  modal(`<div class="tag">${tag} · month ${s.week}</div><div class="headline">${head}</div>${story}
    <div class="endstats"><span>Months running</span><span>${s.week}</span><span>Peak investors</span><span>${num(s.peakInv)}</span>
    <span>Peak owed</span><span>${fmt(s.peakOwed)}</span><span>Total skimmed</span><span>${fmt(s.totalSkim)}</span>
    <span>How close they really were</span><span>${HEAT_WORDS[tierOf(s.heat)]}</span>
    ${odds!=null?`<span>Your real escape odds</span><span>${odds}%</span>`:""}
    <span>Score (stash kept)</span><span class="${score?"good":"bad"}">${fmt(score)}</span><span>Best escape</span><span>${fmt(Math.max(best,score))}</span></div>
    <div class="btns"><button class="big go" data-act="restart">New scheme</button></div>`);
}

function makeApplicant(s){

  const a={kind:"app",plant,type:plant?pick(["agent","agent","reporter","regulator"]):null,
    born:yr-age-(Math.random()<0.5?1:0),sig:`${first[0]}. ${last}`,idSig:`${first[0]}. ${last}`,
    name:`${first} ${last}`,idName:`${first} ${last}`,age,job:job[0],employer:job[1],

  }else{
    // Real people want one thing: safety, status or a big score. Their job hints at it; their words sometimes mislead.
    a.pref=JOB_PREF[a.job]?wpick(JOB_PREF[a.job]):pick(PREFS);
    const r=Math.random();
    a.quote=r<0.5?pick(QBY[a.pref]):r<0.8?pick(NEUTRAL_Q):pick(QBY[pick(PREFS.filter(p=>p!==a.pref))]);
    if(a.pref==="status")a.dep=Math.round(a.dep*(1+image(s)*0.04)/1e3)*1e3;
    // Not every crook is a cop. Some just write bad checks.
    if(s.week>=3&&Math.random()<0.06){a.bounce=true;a.pay="Personal check, Ashford Federal Savings";}
  }
  return a;
}
const WHALE_JOBS=[["Shipping heir","Halvorsen Lines"],["Retired hedge fund manager","Self-employed"],["Oil family trustee","Delacroix Family Trust"],
  ["Tech founder","Recently sold a startup"],["Real estate developer","Gallo Towers"],["Cardiac surgeon","Owns three clinics"]];
// The typical check at your current rank, drawn exactly the way regular applicants are.
function avgDeposit(s){let t=0;for(let i=0;i<1000;i++)t+=Math.max(5e3*(1+0.04*s.week)*rand(3,10),s.owed*rand(0.003,0.012));return t/1000*(1+RANKS[s.rank].dep);}
// A whale is always at least five times the typical check.
function makeWhale(s){
  const a=makeApplicant(s), j=pick(WHALE_JOBS);
  a.whale=true;a.job=j[0];a.employer=j[1];a.bounce=false;
  if(a.pay.includes("Ashford Federal"))a.pay=`Wire, ${pick(BANKS)}`;
  a.dep=Math.ceil(avgDeposit(s)*rand(5.2,8)/1e4)*1e4;
  if(!a.plant){a.pref=pick(PREFS);a.quote=Math.random()<0.6?pick(QBY[a.pref]):pick(NEUTRAL_Q);}
  return a;
}
function makeWithdrawal(s){
  const job=pick(JOBS);
  return {kind:"wd",name:s.named.length&&Math.random()<0.5?pick(s.named):newName(),job:job[0],
    amt:Math.round(Math.max(10e3,s.owed*rand(0.005,0.02))/1e3)*1e3,quote:pick(WD_Q),vis:pick(VIS_TAGS),hid:pick(HID_TAGS),checks:{}};
}
function makeForm(s){
  const AUM=["Assets under management",[["c",fmt(s.reportedAUM)],["t",fmt(Math.max(0,s.cash))],["o",fmt(s.reportedAUM*rand(1.2,1.5))]]];
  const RET=["Return since launch",[["c",`${s.claimed.toFixed(0)}%`],["t","0%"],["o",`${Math.round(s.claimed*rand(1.2,1.5)+3)}%`]]];
  const AUD=["Auditor of record",[["c",s.story.auditor],["t","None"],["o",decoy(s,"auditor")]]];
  const BANK=["Custodian bank",[["c",s.story.bank],["t","Self-custodied"],["o",decoy(s,"bank")]]];
  const STRAT=["Investment strategy",[["c",s.story.strategy],["t","New deposits pay old investors"],["o",decoy(s,"strategy")]]];
  const WIRE=["Purpose of outgoing wires",[["c",s.story.wires],["t","Transfers to my offshore account"],["o",decoy(s,"wires")]]];
  const POS=["Largest position",[["c",s.story.position],["t","None. There are no trades."],["o",decoy(s,"position")]]];
  const T=pick([
    {from:"State Securities Division",title:"Form ADV annual update",fields:[AUM,BANK,STRAT,POS]},
    {from:"Grant & Lyle LLP, for a large investor",title:"Audit confirmation request",fields:[AUM,AUD,RET,POS]},
    {from:"First Ashford Trust, compliance desk",title:"Wire activity review",fields:[WIRE,AUM,BANK]},
    {from:"A wealthy investor's family office",title:"Annual performance letter",fields:[RET,STRAT,AUD,POS]},
  ]);
  // A surprise audit: the auditor sits across from you, so your notes stay in the drawer.
  const surprise=s.week>=5&&Math.random()<0.3+s.heat/300;
  return {kind:"form",surprise,from:surprise?"An auditor, sitting across your desk":T.from,title:surprise?`Surprise audit: ${T.title.toLowerCase()}`:T.title,
    fields:T.fields.map(([l,o])=>({l,o:shuffle(o.map(x=>x.slice())),pick:null}))};
}

function startDesk(){
  const s=S, q=[];
  const buff=s.buff&&s.buff.week===s.week?s.buff.k:null;
  // Trust, the sports car out front and a fired-up bullpen all bring more people through the door.
  const nApps=clamp(2+Math.floor(s.mkt*0.8)+(Math.random()<0.5?1:0)+(s.trust>=70?1:s.trust<35?-1:0)+(s.life.car?1:0)+(buff==="dial"?2:0)+RANKS[s.rank].apps,1,10);
  for(let i=0;i<nApps;i++)q.push(makeApplicant(s));
  // The penthouse draws whales.
  // A Kingpin gets a whale every day; the penthouse draws one now and then. Whales walk in announced.
  if(RANKS[s.rank].whale||(s.life.penthouse&&Math.random()<0.35))q.push(makeWhale(s));
  if(s.investors>20)for(let i=Math.random()<0.5?1:2;i>0;i--)q.push(makeWithdrawal(s));
  if(s.week>=3){if(Math.random()<0.25+s.heat/200)q.push(makeForm(s));if(s.heat>60&&Math.random()<0.5)q.push(makeForm(s));}
  // When things get hot, the tray floods: panicked investors and more paperwork than one day can hold.
  const flood=s.heat>=55?1+Math.floor((s.heat-55)/15):0;
  for(let i=0;i<flood;i++){if(s.investors>20){const w=makeWithdrawal(s);w.amt=Math.round(w.amt*rand(1.5,2.5)/1e3)*1e3;w.quote=pick(PANIC_Q);q.push(w);}if(s.week>=3&&Math.random()<0.6)q.push(makeForm(s));}
  // The whale you stayed for.
  if(s.whaleNext){const a=makeApplicant(s);Object.assign(a,{plant:false,type:null,idName:a.name,fakeRef:false,pref:"greed",pitched:true,hooked:true,
    dep:s.whaleNext.dep,quote:"As promised. Let's do this before anyone changes their mind.",resp:"Wire's ready. Where do I sign?",pitchName:"One last deal"});
    q.push(a);s.whaleNext=null;}
  s.desk={time:DAY,q:shuffle(q),i:0,log:[],freeBg:has(s,"source")?1:0,done:false,flood,buff};
  // Don't make the whale wait until the end of the day.
  const wi=s.desk.q.findIndex(c=>c.whale);if(wi>1){const [w]=s.desk.q.splice(wi,1);s.desk.q.splice(Math.random()<0.5?0:1,0,w);}
  renderDesk();
  if(flood>=2)modal(`<h3>Your phone hasn't stopped ringing</h3><p>Investors are calling, the mail is piled up, and there's a line in the lobby. You won't get to all of it today.</p>
    <div class="btns"><button class="big go" data-act="close">Start with the pile</button></div>`);
  if(s.week===1)modal(`<h3>Your desk</h3><p>Big investors come to you in person. Most are real. Some are plants: agents, reporters or regulators collecting evidence.</p>
    <p>Your black book lists the tells you know. Every check costs time, and the office closes at 5.</p>
    <div class="btns"><button class="big go" data-act="close">Open the door</button></div>`);
}

function renderDesk(){
  const s=S, d=s.desk;
  if(d.i>=d.q.length||d.time<BASE){deskSummary();return;}
  const p=cardParts(d.q[d.i],s,d);
  setChill(s);
  // The phone rings more as the walls close in.
  if(d.rung!==d.i){d.rung=d.i;if(d.q[d.i].whale)play("coins");else if(d.i>0&&Math.random()<s.heat/150)play("ring");}
  $("app").innerHTML=`<header class="deskhead"><div><div class="clock ${d.time<90?"late":""}">${clock(d.time)}</div>
      <div class="k">Today: ${gameDate(s.week).toLocaleDateString("en-US",{month:"long",year:"numeric"})}</div></div>
    <div class="tray">${d.q.length-d.i} in tray<br>${d.q.slice(d.i).some(c=>c.whale)?`<b class="whalenote">Whale in the lobby</b>`:"Closes 5:00 pm"}</div>
    <div class="tools"><button class="chip" data-act="book" ${d.q[d.i].surprise?"disabled":""}>Black book</button><button class="chip" data-act="story" ${d.q[d.i].surprise?"disabled":""}>Cover story</button></div></header>
    <div class="docwrap">${p.doc}</div>${p.acts}${p.dec}`;
}

// Each card has three parts: the paper, the checks you can run, and the decision.
function cardParts(c,s,d){
  const t=d.time, dis=cost=>t<cost+BASE?"disabled":"";
  if(c.kind==="app"){
    const free=d.freeBg>0;
    return {doc:`<div class="doc ${c.whale?"whaledoc":""}"><div class="doctype">New investor application${c.whale?`<span class="whale">WHALE</span>`:""}</div>
      <div class="kv"><span>Name</span><b>${c.name}</b><span>Age</span><b>${c.age}</b><span>Occupation</span><b>${c.job}, ${c.employer}</b>
      <span>Address</span><b>${c.address}</b><span>Deposit</span><b>${fmt(c.dep)}</b><span>Payment</span><b>${c.pay}</b>
      <span>Referred by</span><b>${c.ref||"Heard about you from "+c.channel}</b><span>Signed</span><b class="sig">${c.sig}</b></div>
      <p class="quote">"${c.quote}"</p>
      <div class="idcard"><div class="idh">State of Ashford · ID card</div><b>${c.idName.toUpperCase()}</b><span>Born ${c.born}</span><span>Exp. ${c.exp}</span><span class="sig">${c.idSig}</span></div>
      ${c.checks.ref?`<div class="found"><b>Referral:</b> ${c.checks.ref}</div>`:""}
      ${c.checks.bg?`<div class="found"><b>Background:</b> ${c.checks.bg}</div>`:""}
      ${c.checks.talk?`<div class="found"><b>Small talk:</b> ${c.checks.talk}</div>`:""}
      ${c.resp?`<div class="found"><b>You pitched "${c.pitchName}":</b> "${c.resp}"</div>`:""}</div>`,
      acts:`<div class="deskacts"><button class="mini" data-act="dchk" data-v="ref" ${c.checks.ref?"disabled":dis(T_REF)}>Referral · 30m</button>
        <button class="mini" data-act="dchk" data-v="bg" ${c.checks.bg?"disabled":free?"":dis(T_BG)}>Background · ${free?"free":"1h"}</button>
        <button class="mini" data-act="dchk" data-v="talk" ${c.checks.talk||c.pitched?"disabled":dis(T_TALK)}>Small talk · 15m</button></div>`,
      dec:`<div class="deskdec"><button class="big run" data-act="ddec" data-v="reject">Turn away</button>${c.pitched
        ?`<button class="big go" data-act="ddec" data-v="accept">Close · ${fmt(c.dep)}</button>`
        :`<button class="big go" data-act="pitch" ${dis(BASE)}>Pitch · ${fmt(c.dep)}</button>`}</div>`};
  }
  if(c.kind==="wd"){
    return {doc:`<div class="doc"><div class="doctype">Withdrawal request</div>
      <div class="kv"><span>Investor</span><b>${c.name}</b><span>Occupation</span><b>${c.job}</b><span>Amount</span><b>${fmt(c.amt)}</b><span>What you know</span><b>${c.vis.l}</b></div>
      <p class="quote">"${c.quote}"</p>
      ${c.checks.ask?`<div class="found"><b>Word around town:</b> ${c.checks.ask}</div>`:""}</div>`,
      acts:`<div class="deskacts"><button class="mini" data-act="dchk" data-v="ask" ${c.checks.ask?"disabled":dis(T_ASK)}>Ask around · 20m</button></div>`,
      dec:`<div class="deskdec"><button class="big run" data-act="ddec" data-v="stall">Stall</button>
        <button class="big alt" data-act="ddec" data-v="half" ${s.cash<c.amt/2?"disabled":""}>Pay half</button>
        <button class="big go" data-act="ddec" data-v="pay" ${s.cash<c.amt?"disabled":""}>Pay ${fmt(c.amt)}</button></div>`};
  }
  const ready=c.fields.every(f=>f.pick!=null), ft=formTime(s);
  return {doc:`<div class="doc"><div class="doctype">${c.title}<span>${c.from}</span></div>
    ${c.surprise?`<div class="found"><b>No notes allowed.</b> The auditor is watching. Your black book and cover story stay in the drawer.</div>`:""}
    ${c.fields.map((f,fi)=>`<div class="fld"><span>${f.l}</span>${f.o.map((o,oi)=>`<button class="fopt ${f.pick===oi?"on":""}" data-act="dopt" data-v="${fi}:${oi}">${o[1]}</button>`).join("")}</div>`).join("")}</div>`,
    acts:"",
    dec:`<div class="deskdec"><button class="big run" data-act="ddec" data-v="ignore">Leave it</button>
      <button class="big go" data-act="ddec" data-v="file" ${ready&&t>=ft?"":"disabled"}>File it · ${ft} min</button></div>`};
}

function deskCheck(v){
  const s=S, d=s.desk, c=d.q[d.i];
  if(c.checks[v])return;
  if(v==="ref"){if(d.time<T_REF+BASE)return;d.time-=T_REF;
    c.checks.ref=c.fakeRef?`Nobody named ${c.ref} has an account with you.`
      :c.ref?(c.plant&&Math.random()<0.5?`${c.ref}: "Never met them. Maybe at the gym?"`:`${c.ref}: "${pick(["Yeah, I told them about you. Good people.","Sure, we play golf together.","That's my neighbor. Take their money!"])}"`)
      :`Their name is on the list from ${c.channel}.`;}
  if(v==="bg"){const free=d.freeBg>0;if(!free&&d.time<T_BG+BASE)return;if(free)d.freeBg--;else d.time-=T_BG;
    c.checks.bg=c.plant?BG[c.type]:`${c.job}, ${c.employer}. Credit is solid. No red flags.`;}
  if(v==="ask"){if(d.time<T_ASK+BASE)return;d.time-=T_ASK;c.checks.ask=c.hid?c.hid.l:"Nothing else worth knowing.";}
  if(v==="talk"){if(d.time<T_TALK+BASE)return;d.time-=T_TALK;
    const p=c.pref&&!(c.plant&&c.eager)&&Math.random()<0.85?c.pref:pick(PREFS);c.checks.talk=pick(SMALLTALK[p]);}
  renderDesk();
}

function stallHit(s,c,k){for(const t of [c.vis,c.hid])if(t){s.heat+=t.h*k;s.trust+=t.t*k;}}
function deskDecide(v){
  const s=S, d=s.desk, c=d.q[d.i];
  if(c.kind==="app"){
    d.time-=BASE;
    if(v==="accept"){
      if(!c.bounce)s.cash+=c.dep;
      else s.revealNext.push(`${c.name}'s check bounced. Ashford Federal Savings closed last spring. On paper, you still owe them ${fmt(c.dep)}.`);
      s.owed+=c.dep;s.investors++;d.take=(d.take||0)+c.dep;d.signed=(d.signed||0)+1;d.log.push(`Signed ${c.name} for ${fmt(c.dep)}.`);
      if(c.plant){s.heat+={agent:18,reporter:12,regulator:15}[c.type];s.plantsAccepted++;s.revealNext.push(REVEAL[c.type](c.name));}
      else{s.named.push(c.name);if(!s.biggest||c.dep>s.biggest.dep)s.biggest={name:c.name,dep:c.dep,job:c.job};}
      // The rush. Plants get the same celebration; you don't know yet.
      play("stamp");setTimeout(()=>play("kaching"),160);stampFx("SIGNED","+"+fmt(c.dep));burst(c.hooked?18:9);
      if(c.dep>=Math.max(80e3,s.owed*0.02))shake();
    }else{
      play("walk");
      d.log.push(`Turned away ${c.name}.`);
      if(c.plant){if(Math.random()<0.5)s.revealNext.push(DODGE[c.type](c.name));}
      else{s.trust-=1;s.honestRejected++;if(Math.random()<0.3)s.revealNext.push(`${c.name}, whom you turned away, put ${fmt(c.dep)} in a savings account instead. Lucky them.`);}
    }
  }else if(c.kind==="wd"){
    if(v==="pay"){if(s.cash<c.amt)return;s.cash-=c.amt;s.owed-=c.amt;s.trust+=2;d.log.push(`Paid ${c.name} ${fmt(c.amt)}.`);}
    else if(v==="half"){const h=Math.round(c.amt/2);if(s.cash<h)return;s.cash-=h;s.owed-=h;stallHit(s,c,0.5);d.log.push(`Paid ${c.name} half. They want the rest.`);}
    else{stallHit(s,c,1);d.log.push(`Stalled ${c.name}. "The check is in the mail."`);}
    d.time-=BASE;
  }else{
    if(v==="file"){
      if(c.fields.some(f=>f.pick==null)||d.time<formTime(s))return;
      d.time-=formTime(s);let errs=0;
      for(const f of c.fields){const k=f.o[f.pick][0];
        if(k==="t"){s.heat+=12;errs++;d.log.push(`${c.title}: you told the truth about "${f.l.toLowerCase()}." That's a confession.`);}
        else if(k==="o"){s.heat+=7;errs++;d.log.push(`${c.title}: "${f.l.toLowerCase()}" doesn't match what you've told everyone else.`);}}
      if(!errs){s.heat-=2;d.log.push(`${c.title}: filed. Your story holds.`);}
    }else{d.time-=BASE;s.heat+=6;d.log.push(`You ignored the ${c.title.toLowerCase()}. ${c.from} will follow up.`);}
  }
  s.heat=clamp(s.heat,0,100);s.trust=clamp(s.trust,0,100);
  d.i++;renderDesk();
}

function deskSummary(){
  const s=S, d=s.desk;
  if(!d.done){
    for(const c of d.q.slice(d.i)){
      if(c.kind==="app")d.log.push(`${c.name} gave up waiting and left.`);
      else if(c.kind==="wd"){stallHit(s,c,1);d.log.push(`${c.name} never heard back about their ${fmt(c.amt)}.`);}
      else{s.heat+=6;d.log.push(`The ${c.title.toLowerCase()} sat in your tray all day.`);}
    }
    s.heat=clamp(s.heat,0,100);s.trust=clamp(s.trust,0,100);
    d.i=d.q.length;d.done=true;
  }
  $("app").innerHTML=`<header class="deskhead"><div><div class="clock">${d.time<BASE?"5:00 pm":clock(d.time)}</div><div class="k">Month ${s.week}</div></div><div class="tray">Tray empty</div></header>
    <div class="takebox"><div class="mh">Today's take</div><div class="take" id="take">${d.counted?fmt(d.take||0):"$0"}</div><div class="hint">${num(d.signed||0)} signed today</div></div>
    <div class="daylog"><div class="mh">How the day went</div>${d.log.map(l=>`<div class="news">${l}</div>`).join("")||`<div class="news">A quiet day.</div>`}</div>
    ${s.rank>=1?`<button class="big go wide" data-act="bullpen">Go to the bullpen →</button>`:`<button class="big go wide" data-act="dclose">Close the office →</button>`}`;
  if(!d.counted){d.counted=true;const take=d.take||0;
    if(take>0){countUp($("take"),0,take,fmt,1400);
      for(let i=0;i<10;i++)setTimeout(()=>play("tick"),i*130);
      setTimeout(()=>{play("kaching");burst(take>=Math.max(150e3,s.owed*0.05)?24:12);},1400);}}
}
function showBook(){
  if(S.desk&&!S.desk.done&&S.desk.q[S.desk.i]&&S.desk.q[S.desk.i].surprise)return;
  modal(`<h3>Black book</h3><p class="hint">Tells you know so far. A background check always tells the truth, but it takes an hour.</p>
    ${rulesKnown(S).map(r=>`<p class="rule">${r.t}</p>`).join("")}
    <div class="btns"><button class="big alt" data-act="close">Back to the desk</button></div>`);
}
function showStory(){
  if(S.desk&&!S.desk.done&&S.desk.q[S.desk.i]&&S.desk.q[S.desk.i].surprise)return;
  const s=S;
  modal(`<h3>Cover story</h3><p class="hint">What you've told the world. Every document you file has to match this. The truth is a confession.</p>
    <div class="cover"><div><span>Fund size, last report</span><b>${fmt(s.reportedAUM)}</b></div>
    <div><span>Return since launch</span><b>${s.claimed.toFixed(0)}%</b></div>
    <div><span>Auditor</span><b>${s.story.auditor}</b></div>
    <div><span>Custodian bank</span><b>${s.story.bank}</b></div>
    <div><span>Strategy</span><b>${s.story.strategy}</b></div>
    <div><span>Outgoing wires are</span><b>${s.story.wires}</b></div>
    <div><span>Largest position</span><b>${s.story.position}</b></div></div>
    <div class="btns"><button class="big alt" data-act="close">Back to the desk</button></div>`);
}

// ---------- Feel: the rush, the dread, the run ----------
// Rank takes money and image. You can't be the Wolf from a strip mall in a used sedan.
// Each rank brings real perks, and real attention.
const RANKS=[
  {t:"Hustler",min:0,img:0,office:"Strip-mall office",dep:0,apps:0,heat:0,
    gain:["Just you, a phone and a dream."],cost:[]},
  {t:"Closer",min:3e5,img:0,office:"Downtown suite",dep:0,apps:1,heat:0.3,
    gain:["A bullpen: rally your team after every workday.","One more person at your desk every day."],cost:["People around town start to notice you."]},
  {t:"Shark",min:2e6,img:1,office:"Glass tower, 20th floor",dep:0.2,apps:1,heat:0.6,
    gain:["Every check is 20% bigger. People pay more to be with a winner."],cost:["More eyes on you every month."]},
  {t:"Kingpin",min:1.2e7,img:4,office:"The whole tower",dep:0.2,apps:1,heat:1,whale:true,
    gain:["A whale walks into your office every day."],cost:["Regulators know your name now."]},
  {t:"Wolf",min:6e7,img:8,office:"Penthouse headquarters",dep:0.4,apps:2,heat:1.5,whale:true,
    gain:["Every check is 40% bigger.","Two more people at your desk every day."],cost:["Everyone is watching. Everyone."]},
];
// Everything your rank does for you, and to you, so far.
function rankPerks(r){const g=[],c=[];for(let i=1;i<=r;i++){g.push(...RANKS[i].gain);c.push(...RANKS[i].cost);}return {g,c};}
function perkList(r,onlyNew){
  const g=onlyNew?RANKS[r].gain:rankPerks(r).g, c=onlyNew?RANKS[r].cost:rankPerks(r).c;
  return `<div class="perks">${g.map(x=>`<p class="good">+ ${x}</p>`).join("")}${c.map(x=>`<p class="bad">− ${x}</p>`).join("")}</div>`;
}
function showRankInfo(){
  const s=S, R=RANKS[s.rank], nx=RANKS[s.rank+1];
  modal(`<div class="tag">Your status</div><div class="rk">${R.t.toUpperCase()}</div><p class="hint">${R.office}</p>
    ${s.rank?perkList(s.rank):`<p>${R.gain[0]}</p>`}
    ${nx?`<p class="hint">Next: <b>${nx.t}</b>. It takes ${fmt(nx.min)} under management${nx.img?` and an image of ${nx.img} (yours is ${image(s)})`:""}.</p>${perkList(s.rank+1,true)}`:`<p class="hint">There's nothing above this. Only down.</p>`}
    <div class="btns"><button class="big alt" data-act="close">Back</button></div>`,"gold");
}
const image=s=>LIFE.reduce((t,x)=>t+(!x.repeat&&s.life&&s.life[x.id]?x.img:0),0);
const rankOf=s=>{let r=0;RANKS.forEach((x,i)=>{if(i===r+1&&s.peakOwed>=x.min&&image(s)>=x.img)r=i;});return Math.max(r,s.rank||0);};
const RANK_LINES=["Look at you. Look at this office.","You were born for this.","Nobody has ever done it like you.","Somebody pinch you. Actually, don't."];
const PUFF=[
  [`${CITY}'s golden child`,`How ${FUND}'s founder keeps beating the market.`],
  ["Business Monthly cover: \"The Closer\"","\"I just believe in people,\" the founder says."],
  [`${FUND} named Fund of the Year`,"The Ashford Business Journal calls its returns \"remarkable.\""],
  [`${FUND} gala raises record sum for children's hospital`,"The founder's toast drew a standing ovation."],
  ["Local fund founder buys a round for the whole bar","Witnesses describe \"a legend.\""],
];

// The narrator's confidence tracks the hidden heat, with the occasional lie to yourself.
const NARR=[
  ["You're a genius. Say it out loud.","Money never sleeps. Neither do you.","Easiest money you've ever made.","They can't teach what you've got."],
  ["A few people are talking. People always talk.","Haters mean you're winning.","Some blogger called you too good to be true. Frame it.","You bought a second phone. Just for convenience."],
  ["A reporter called the front desk. Probably wants a profile.","Third time that gray car has driven past. Probably nothing.","You've started checking the mirror. Just habit.","Your accountant laughed too hard at your joke."],
  ["Your banker stopped making eye contact.","Keep smiling. Smiling is free.","You haven't slept more than four hours since Tuesday.","Somebody went through your trash. Raccoons, probably."],
  ["The van outside has been there since Tuesday.","Your phone clicks when you pick it up. It's fine.","Breathe. It's fine. It's fine.","You flinch every time the elevator dings."],
  ["Pack a bag. Just in case.","Every knock on the door stops your heart.","You keep looking at flight times. Just looking.","You can hear your own pulse in the quiet."],
];
function narrate(s){
  let t=tierOf(s.heat);
  if(t>=3&&Math.random()<0.15)t-=2;
  if(t===0&&s.stash>0&&Math.random()<0.3)return `${fmt(s.stash)} offshore and counting.`;
  return pick(NARR[t]);
}

// The pitch. Real people want safety, status or a big score. Most plants say yes to anything.
const QBY={
  safety:["I just want something steady for retirement.","I can't afford to lose this.","Is it true you've never had a down month?"],
  status:["My financial adviser is going to be so jealous.","I hear the mayor's in. Is that true?","My brother-in-law can't stop talking about you."],
  greed:["How soon can I add more?","What's the most anyone's made with you?","I want in before everyone else finds out."],
};
const PITCHES=[
  {k:"safety",n:"Safe",line:"Your money's safe with me. Steady returns, every single month."},
  {k:"status",n:"Exclusive",line:"This fund is invite only. Most people never get a seat at this table."},
  {k:"greed",n:"Greed",line:"My clients doubled their money last year. Imagine next year."},
];
const HOOKED=["I'm in. Where do I sign?","That's exactly what I needed to hear.","Say no more. Let's do this."];
const LUKEWARM=["Hm. Okay. I'll start smaller and see.","I'll put in a little and see how it goes."];
const EAGER=["Sounds great. Sign me up.","Perfect. Could you put that in writing for me?","Wonderful. That's exactly what I wanted to hear."];
function showPitch(){
  const c=S.desk.q[S.desk.i];
  modal(`<h3>Pitch ${c.name.split(" ")[0]}</h3><p class="hint">Read them first. Do they want safety, status or a big score?</p>
    <div class="opts">${PITCHES.map((p,i)=>`<button class="opt" data-act="dopitch" data-v="${i}"><span class="nm"><b>${p.n}</b><small>“${p.line}”</small></span></button>`).join("")}</div>
    <div class="btns"><button class="big alt" data-act="close">Back</button></div>`);
}
function doPitch(i){
  const s=S, d=s.desk, c=d.q[d.i], p=PITCHES[i];
  closeModal();
  if(d.time<BASE)return;
  d.time-=BASE;c.pitched=true;c.pitchName=p.n;
  if(c.plant&&c.eager){c.resp=pick(EAGER);hook(c,p.k);}
  else if(c.pref===p.k){c.dep=Math.round(c.dep*rand(1.3,1.6)/1e3)*1e3;c.resp=pick(HOOKED);hook(c,p.k);play("coins");}
  else{
    // A bad read usually loses them. The gold watch keeps status-seekers in the chair; a fired-up bullpen softens the blow.
    let walk=d.buff==="close"?0.33:0.65;if(p.k==="status"&&s.life.watch)walk=0;
    if(Math.random()<walk){d.log.push(`${c.name} walked out: "This feels like a sales pitch."`);play("walk");stampFx("WALKED","",true);d.i++;}
    else{c.dep=Math.round(c.dep*0.8/1e3)*1e3;c.resp=pick(LUKEWARM);}
  }
  renderDesk();
  if(c.hooked&&d.q[d.i]===c)showRisk();
}

// Push your luck. Once they bite, their own words hint at what really moves them.
const RISK={
  safety:{x:1.5,o:[{k:"family",l:"Your family will be taken care of. Forever."},{k:"proof",l:"I'll guarantee it in writing. Signed today."},{k:"authority",l:"Even the bank's own managers invest with us."}]},
  status:{x:2,o:[{k:"names",l:"The mayor's in. Keep that between us."},{k:"scarcity",l:"There are two seats left this year. One is yours."},{k:"ego",l:"I want you on our advisory board."}]},
  greed:{x:3,o:[{k:"urgency",l:"Double it. Now. The window closes Friday."},{k:"allin",l:"Put the house in. You'll buy two more."},{k:"secret",l:"There's a side fund. Insiders only. Triple returns."}]},
};
const HOT_HINT={family:"My kids are my whole world, you know.",proof:"Is there something I can sign?",authority:"Who else banks with you?",
  names:"Anyone I'd know invest with you?",scarcity:"I'd hate to miss out on something like this.",ego:"People in this town know my name, you know.",
  urgency:"How fast can this happen?",allin:"Honestly, I'd put in everything if this is real.",secret:"Is there anything that's not in the brochure?"};
const RISK_YES=["Okay. Okay! Let's do it.","You know what? Make it bigger.","I've never done anything like this. I love it."];
function hook(c,cat){
  c.hooked=true;c.cat=cat;c.hot=pick(RISK[cat].o).k;
  // The hint points at the real hot button four times out of five.
  c.hint=HOT_HINT[Math.random()<0.8?c.hot:pick(RISK[cat].o.filter(o=>o.k!==c.hot)).k];
}
function showRisk(){
  const c=S.desk.q[S.desk.i], R=RISK[c.cat];
  modal(`<div class="tag">They're hooked</div><h3>Push your luck?</h3>
    <p>${c.name.split(" ")[0]} leans in: <i>“${c.hint}”</i></p>
    <p class="hint">Say the right thing and the check becomes <b class="good">${fmt(c.dep*R.x)}</b> (×${R.x}). Say the wrong thing and they walk out.</p>
    <div class="opts">${R.o.map((o,i)=>`<button class="opt" data-act="risk" data-v="${i}"><span class="nm"><small>“${o.l}”</small></span><span class="c">×${R.x}</span></button>`).join("")}</div>
    <div class="btns"><button class="big alt" data-act="riskskip">Don't push it · ${fmt(c.dep)}</button></div>`);
}
function doRisk(i){
  const s=S, d=s.desk, c=d.q[d.i], R=RISK[c.cat], o=R.o[i];
  closeModal();
  if((c.plant&&c.eager)||o.k===c.hot){
    c.dep=Math.round(c.dep*R.x/1e3)*1e3;c.resp=pick(RISK_YES);c.pitchName=`${c.pitchName}, then went for more`;
    play("coins");setTimeout(()=>play("kaching"),200);burst(16);
  }else{
    d.log.push(`${c.name} got spooked and walked out: "Whoa. That's... no. I need to think."`);play("walk");stampFx("SPOOKED","",true);d.i++;
  }
  renderDesk();
}

// The speech to the bullpen. Each one changes tomorrow.
const SPEECH=[
  {k:"dial",l:"Pick up the phone and start dialing!",fx:"Next month: two more people at your desk."},
  {k:"close",l:"Nobody leaves this office until they close!",fx:"Next month: fewer walk-outs on a bad pitch. Your crew is exhausted."},
  {k:"stay",l:"I'm not leaving! I'm not leaving!",fx:"Your crew would follow you anywhere. Word gets around town."},
];
function doSpeech(i){
  const s=S, d=s.desk;if(d.speech)return;
  const sp=SPEECH[i];d.speech=sp;
  if(sp.k==="stay"){for(const l of s.lts)l.loyalty=clamp(l.loyalty+15,0,100);s.trust=clamp(s.trust+2,0,100);s.heat=clamp(s.heat+2,0,100);}
  else{s.buff={k:sp.k,week:s.week+1};if(sp.k==="close")for(const l of s.lts)l.loyalty=clamp(l.loyalty-5,0,100);}
  s.revealNext.push(`The bullpen is fired up. ${sp.fx}`);
  if(sp.k==="dial"){play("ring");setTimeout(()=>play("ring"),350);setTimeout(()=>play("ring"),700);}
  else if(sp.k==="close"){play("thump");setTimeout(()=>play("tick"),500);setTimeout(()=>play("tick"),1000);}
  else{play("roar");shake();}
  renderBullpen();
}

// The bullpen, seen from where you stand: a faceless crowd that does whatever you tell it to.
const PEN_POS=[[102,118,.72],[141,114,.72],[180,118,.72],[219,114,.72],[258,118,.72],[118,180,1],[180,184,1],[242,180,1]];
function penPerson(x,y,k,i,mode){
  const head=mode==="late"?-38:-44;
  let extra="";
  if(mode==="dial")extra=`<path d="M12 -24 Q24 -36 13 -47" stroke="#05080a" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="8" y="-55" width="9" height="13" rx="2" fill="#05080a"/><path class="ringl" d="M21 -58 q5 -5 10 0 M23 -64 q7 -7 14 0" stroke="#e9c46a" stroke-width="1.6" fill="none"/>`;
  if(mode==="riled")extra=`<path d="M-15 -24 L-27 -66" stroke="#05080a" stroke-width="7" stroke-linecap="round"/><path d="M15 -24 L27 -66" stroke="#05080a" stroke-width="7" stroke-linecap="round"/><circle cx="-28" cy="-69" r="5" fill="#05080a"/><circle cx="28" cy="-69" r="5" fill="#05080a"/>`;
  if(mode==="late")extra=`<path class="sq" d="M-12 ${head-20} l4 -5 l4 5 l4 -5 l4 5 l4 -5 l4 5" stroke="#ff6b5b" stroke-width="1.6" fill="none"/>`;
  const body=`<path d="M-21 0 Q-21 -31 0 -33 Q21 -31 21 0 Z" fill="#05080a"/><circle cx="0" cy="${head}" r="11" fill="#05080a"/>`;
  const desk=mode==="late"?`<rect x="-32" y="-16" width="64" height="18" fill="#140e07"/><rect x="-14" y="-30" width="28" height="15" fill="#0d1a24"/><rect x="-12" y="-28" width="24" height="11" fill="#5fb0d4" opacity=".35"/>`:"";
  return `<g transform="translate(${x} ${y}) scale(${k})"><g class="pp pp-${mode}" style="animation-delay:${(i*0.09).toFixed(2)}s">${body}${extra}</g>${desk}</g>`;
}
function bullpenSVG(mode){
  const late=mode==="late";
  let g=`<rect width="360" height="210" fill="${late?"#0d141c":"#2a3328"}"/>`
    +`<rect x="20" y="16" width="100" height="58" fill="${late?"#050a12":"#8fb3c4"}" opacity="${late?1:.55}"/><rect x="240" y="16" width="100" height="58" fill="${late?"#050a12":"#8fb3c4"}" opacity="${late?1:.55}"/>`
    +(late?`<circle cx="300" cy="34" r="7" fill="#e8e4cf" opacity=".8"/>`:"")
    +`<rect x="140" y="24" width="80" height="34" fill="#1d2a23"/><text x="180" y="45" text-anchor="middle" font-family="Archivo Black,Impact,sans-serif" font-size="9" fill="#e9c46a">${FUND.toUpperCase()}</text>`
    +`<rect x="0" y="150" width="360" height="60" fill="${late?"#0a0f14":"#1c231c"}"/>`
    +(mode==="riled"?`<rect class="flashlite" width="360" height="210" fill="#e9c46a" opacity="0"/>`:"");
  PEN_POS.forEach(([x,y,k],i)=>g+=penPerson(x,y,k,i,mode));
  if(late)g+=`<rect width="360" height="210" fill="url(#lamp)" opacity=".5"/>`;
  return `<svg viewBox="0 0 360 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="lamp" cx=".5" cy=".85" r=".6"><stop offset="0" stop-color="#e9c46a" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient></defs>${g}</svg>`;
}
const PEN_REACT={dial:"They scramble for their phones. The room fills with the sound of dialing.",
  close:"Nobody goes home. The lights stay on until two in the morning.",
  stay:"The room explodes. Someone climbs on a desk. Someone cries."};
function renderBullpen(){
  const s=S, d=s.desk, sp=d.speech;
  $("app").innerHTML=`<header class="deskhead"><div><div class="clock">The bullpen</div><div class="k">Month ${s.week} · after hours</div></div>
      <div class="tray">${num(d.signed||0)} signed today<br>${fmt(d.take||0)} in</div></header>
    <div class="pen">${bullpenSVG(sp?sp.k==="stay"?"riled":sp.k==="close"?"late":"dial":"idle")}</div>
    ${sp?`<p class="narr">“${sp.l}” ${PEN_REACT[sp.k]}</p><p class="good fx">${sp.fx}</p><button class="big go wide" data-act="dclose">Go home →</button>`
      :`<p class="narr">They're all looking at you. Say something.</p>
        <div class="speech">${SPEECH.map((x,i)=>`<button data-act="speech" data-v="${i}">“${x.l}”<small>${x.fx}</small></button>`).join("")}</div>`}`;
}

// The good life, paid from your stash.
// Every toy does a job: it lifts your image (which rank needs), and it helps when it's time to run.
// Most of them cost money every month. Miss the upkeep and they get repossessed, in public.
const LIFE=[
  {id:"watch",name:"Gold watch",cost:25e3,img:1,trust:2,heat:0,d:"Status-seekers never walk out on an Exclusive pitch. Pawnable on the way out."},
  {id:"car",name:"Italian sports car",cost:350e3,img:2,trust:3,heat:3,upkeep:3e3,
    repo:["Repo men tow fund founder's sports car","Neighbors filmed the whole thing."],d:"One more person at your desk every day. A fast way out of town."},
  {id:"party",name:"Throw a party on the water",cost:400e3,img:0,trust:8,heat:6,loy:12,repeat:true,d:"Once a month. A big lift in trust and crew loyalty. Big attention too."},
  {id:"yacht",name:"Yacht",cost:1.2e6,img:3,trust:3,heat:4,upkeep:20e3,
    repo:["Fund founder's yacht seized at the marina","Harbor master: \"The slip fee hadn't been paid in weeks.\""],d:"Opens the marina as a way out."},
  {id:"penthouse",name:"Harbor penthouse",cost:2.5e6,img:3,trust:4,heat:5,upkeep:25e3,
    repo:["Bank takes back founder's harbor penthouse","Movers carried out a solid-gold espresso machine."],d:"Whales come to you. A panic room buys 5 more seconds in a raid."},
  {id:"island",name:"Private island",cost:25e6,img:4,trust:3,heat:8,upkeep:60e3,
    repo:["Founder's private island listed for back taxes","The listing calls it \"recently vacated.\""],d:"Somewhere to go when this is over. Better escape odds."},
];
function showLife(){
  const s=S, nx=RANKS[s.rank+1];
  modal(`<h3>The good life</h3>
    <p class="hint">Paid from your stash (${fmt(s.stash)}). Your image is <b>${image(s)}</b>.${nx?` Becoming a ${nx.t.toLowerCase()} takes ${fmt(nx.min)} under management and an image of ${nx.img}.`:""} Upkeep comes out of your stash every month.</p>
    <div class="opts">${LIFE.map(it=>{const own=!it.repeat&&s.life[it.id], used=it.repeat&&s.partyWeek===s.week;
      return `<button class="opt ${own?"owned":""}" data-act="buylife" data-v="${it.id}" ${own||used||s.stash<it.cost?"disabled":""}><span class="nm">${it.name}${it.img?` · image +${it.img}`:""}<small>${it.d}${it.upkeep?` Upkeep ${fmt(it.upkeep)} a month.`:""}</small></span><span class="c">${own?"Owned":used?"Done":fmt(it.cost)}</span></button>`;}).join("")}</div>
    <div class="btns"><button class="big alt" data-act="close">Back</button></div>`);
}
function buyLife(id){
  const s=S, it=LIFE.find(x=>x.id===id);
  if(s.stash<it.cost||(!it.repeat&&s.life[id])||(it.repeat&&s.partyWeek===s.week))return;
  s.stash-=it.cost;s.trust=clamp(s.trust+it.trust,0,100);s.heat=clamp(s.heat+it.heat,0,100);
  if(it.loy)for(const l of s.lts)l.loyalty=clamp(l.loyalty+it.loy,0,100);
  if(it.repeat){s.partyWeek=s.week;s.parties=(s.parties||0)+1;s.notes.push("Your party on the water ran until sunrise. Somebody's phone was filming.");}
  else{s.life[id]=true;if(id==="yacht")s.yacht=true;s.owned=s.owned||{};s.owned[id]=true;s.notes.push(`You bought a ${it.name.toLowerCase()}.`);}
  play("kaching");burst(14);render();showLife();
}

// The view out your office window. It changes with every office, and it's where the dread shows up first.
function streetSVG(s){
  const r=s.rank, ch=s.chill||0, night=r>=3||ch>0.55;
  let g=`<rect width="360" height="70" fill="${night?"#0c1320":r>=2?"#24324a":"#2c3d4a"}"/>`;
  const lit=(x,y,w,h,step,seed)=>{let o="";for(let yy=y+3;yy<y+h-2;yy+=step)for(let xx=x+3;xx<x+w-3;xx+=step)
    if((xx*13+yy*7+seed*5)%7>3)o+=`<rect x="${xx}" y="${yy}" width="2" height="2" fill="#f2d48a" opacity="${night?0.9:0.5}"/>`;return o;};
  const blocks=(list,fill,step)=>list.map(([x,y,w,h],i)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`+lit(x,y,w,h,step,i)).join("");
  let carY=60, k=1;
  if(r===0){ // across the parking lot
    g+=`<rect x="0" y="42" width="360" height="28" fill="#22292d"/>`+[40,95,150,205,260].map(x=>`<rect x="${x}" y="54" width="2" height="12" fill="#58606a"/>`).join("")

      +`<text x="200" y="32" font-family="Archivo Black,Impact,sans-serif" font-size="10" fill="#5fd48a">PAWN · CASH</text>`
      +`<rect x="306" y="8" width="2" height="36" fill="#454b52"/><circle cx="307" cy="8" r="3" fill="#ffe9a8"/>`;
  }else if(r===1){ // street level, downtown
    g+=blocks([[0,8,70,40],[74,14,60,34],[138,4,80,44],[222,12,64,36],[290,6,70,42]],"#28323a",6)
      +`<rect x="0" y="48" width="360" height="22" fill="#1d2226"/><rect x="0" y="48" width="360" height="2" fill="#3a4148"/>`;carY=64;
  }else if(r===2){ // 20th floor
    g+=blocks([[0,20,50,50],[54,10,40,60],[98,26,60,44],[162,6,46,64],[212,22,54,48],[270,14,40,56],[314,28,46,42]],"#1f2935",5);carY=68;k=0.45;
  }else if(r===3){ // top of the tower, harbor beyond
    g+=blocks([[0,30,40,26],[44,22,36,34],[84,34,50,22],[138,18,30,38],[172,28,60,28],[236,24,40,32],[280,32,80,24]],"#1b2430",5)
      +`<rect x="0" y="56" width="360" height="14" fill="#10202a"/>`+[20,80,150,230,300].map(x=>`<rect x="${x}" y="61" width="18" height="1" fill="#f2d48a" opacity=".5"/>`).join("");carY=56;k=0.35;
  }else{ // penthouse: the whole city below you
    g+=`<circle cx="300" cy="14" r="6" fill="#e8e4cf" opacity=".85"/>`+[30,70,120,200,250,335].map((x,i)=>`<circle cx="${x}" cy="${5+(i*5)%14}" r=".8" fill="#fff" opacity=".6"/>`).join("")
      +blocks([[0,46,30,14],[34,42,24,18],[62,48,40,12],[106,40,20,20],[130,46,50,14],[184,44,30,16],[218,48,60,12],[282,42,26,18],[312,47,48,13]],"#141c26",4)
      +`<rect x="0" y="60" width="360" height="10" fill="#0b1820"/>`;carY=60;k=0.3;
  }
  // The sedan never parks anymore. It cruises past with its lights on, and faster as things get worse.

  if(s.vanSeen)g+=van(186,carY,kk,!s.prevVan);

  if(ch>0.6)g+=`<g class="rain">${Array.from({length:40},(_,i)=>`<line x1="${(i*37)%360}" y1="${(i*23)%70}" x2="${(i*37)%360-5}" y2="${(i*23)%70+11}" stroke="#b8cad6" stroke-width=".8" opacity=".6"/>`).join("")}</g>`;
  // The window frame and the top of the blinds.

  return `<svg viewBox="0 0 360 70" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`;
}
// The darkness at the edges grows faster than the heat: barely there at first, crushing at the end.
const setChill=s=>{const c=s.chill||0;document.body.style.setProperty("--chill",c.toFixed(3));document.body.style.setProperty("--dark",Math.min(1,Math.pow(c,1.6)*1.25).toFixed(3));document.body.classList.toggle("dread",c>0.72);};
let shown=null;

// ---------- Sound (synthesized, no files) ----------
const SND={on:true,ctx:null,fx:null,mus:null};
try{SND.on=localStorage.getItem("ponzi-sound")!=="off";}catch(e){}
function ac(){
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C();
    SND.fx=SND.ctx.createGain();SND.fx.gain.value=0.5;SND.fx.connect(SND.ctx.destination);
    SND.mus=SND.ctx.createGain();SND.mus.gain.value=0.16;SND.mus.connect(SND.ctx.destination);}catch(e){return null;}}
  if(SND.ctx.state==="suspended")SND.ctx.resume();

}
function tone(f,t,dur,type,vol,to,out){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out||SND.fx);o.start(t);o.stop(t+dur+0.02);
}
let NOISE=null;
function noise(t,dur,vol,freq,type,out){
  const c=SND.ctx;
  if(!NOISE){NOISE=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=NOISE;src.loop=true;f.type=type||"bandpass";f.frequency.value=freq||1000;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(out||SND.fx);src.start(t);src.stop(t+dur+0.02);
}
const SFX={
  kaching:t=>{noise(t,0.06,0.25,5000,"highpass");tone(1568,t+0.02,0.12,"square",0.12);tone(2093,t+0.09,0.45,"square",0.12);tone(2637,t+0.09,0.45,"triangle",0.08);},
  coins:t=>{for(let i=0;i<7;i++)tone(1800+Math.random()*1600,t+i*0.045,0.08,"triangle",0.07);},
  stamp:t=>{tone(120,t,0.18,"sine",0.6,45);noise(t,0.1,0.35,900,"lowpass");},
  tick:t=>tone(1200,t,0.025,"square",0.03),
  walk:t=>tone(300,t,0.2,"triangle",0.1,170),
  ring:t=>{for(let k=0;k<2;k++)for(let i=0;i<8;i++){tone(440,t+k*0.55+i*0.05,0.045,"sine",0.06);tone(480,t+k*0.55+i*0.05,0.045,"sine",0.06);}},
  thump:t=>{tone(60,t,0.14,"sine",0.7,38);tone(55,t+0.2,0.12,"sine",0.5,38);},
  roar:t=>{noise(t,1.6,0.4,700,"bandpass");noise(t+0.1,1.4,0.25,1600,"bandpass");},
  siren:t=>{const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type="sawtooth";o.frequency.setValueAtTime(600,t);
    for(let i=0;i<4;i++){o.frequency.linearRampToValueAtTime(950,t+i*0.6+0.3);o.frequency.linearRampToValueAtTime(600,t+i*0.6+0.6);}
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06,t+0.05);g.gain.setValueAtTime(0.06,t+2.3);g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
    o.connect(g);g.connect(SND.fx);o.start(t);o.stop(t+2.5);},
};
function play(name){if(!SND.on)return;const c=ac();if(!c)return;try{SFX[name](c.currentTime+0.01);}catch(e){}}
// Music: a swaggering groove while things are good, a heartbeat and a drone when they aren't.
const MUS={iv:null,step:0,next:0};
function musicOn(){const c=ac();if(!c||MUS.iv||!SND.on)return;MUS.next=c.currentTime+0.1;MUS.iv=setInterval(musicTick,60);}
function musicOff(){clearInterval(MUS.iv);MUS.iv=null;}
function musicTick(){
  const c=SND.ctx;if(!c||!SND.on)return;
  // Ease toward the current mood over several seconds, so the shift creeps in instead of switching.
  MUS.mood=(MUS.mood==null?0:MUS.mood)+((S&&S.chill||0)-(MUS.mood||0))*0.015;
  const m=MUS.mood, swag=clamp(1-(m-0.25)*2,0,1), dread=clamp((m-0.2)*1.8,0,1), spb=60/(108-34*m)/4, o=SND.mus;
  const v=(x,k)=>Math.max(0.0002,x*k);
  while(MUS.next<c.currentTime+0.25){
    const st=MUS.step%16, bar=Math.floor(MUS.step/16), t=MUS.next;
    if(swag>0.01){
      if(st===0||st===6||st===8)tone(70,t,0.18,"sine",v(0.9,swag),40,o);
      if(st===4||st===12)noise(t,0.12,v(0.35,swag),1800,"bandpass",o);
      if(st%2===0)noise(t,0.03,v(0.12,swag),8000,"highpass",o);
      const root=[55,55,49,61.7][bar%4];
      if(st===0||st===3||st===8||st===11)tone(root*(st===11?1.5:1),t,0.22,"sawtooth",v(0.18,swag),null,o);
      if(st===14&&bar%2===1)tone(root*4,t,0.12,"square",v(0.06,swag),null,o);
    }
    if(dread>0.01){
      if(st===0)tone(55,t,0.16,"sine",v(1,dread),36,o);
      if(st===3)tone(50,t,0.14,"sine",v(0.7,dread),36,o);
      if(st===0&&bar%2===0)tone(73.4,t,spb*32,"sawtooth",v(0.05,dread),null,o);
      if(st===8&&m>0.7)tone(1046+Math.random()*30,t,0.08,"sine",v(0.04,dread),null,o);
    }
    MUS.next+=spb;MUS.step++;
  }
}
// Drop the music out entirely (the raid's moment of black), then bring it back.
function musicDuck(off){if(SND.mus&&SND.ctx)SND.mus.gain.setTargetAtTime(off?0.0001:0.16,SND.ctx.currentTime,off?0.05:0.6);}
function setSound(on){SND.on=on;try{localStorage.setItem("ponzi-sound",on?"on":"off");}catch(e){}if(on){ac();musicOn();}else musicOff();}
document.addEventListener("pointerdown",()=>{if(SND.on){ac();musicOn();}});

// ---------- Effects ----------
function burst(n){const L=$("fx");for(let i=0;i<n;i++){const e=document.createElement("i"),a=Math.random()*Math.PI*2,r=60+Math.random()*130;
  e.className="coin";e.style.setProperty("--dx",Math.cos(a)*r+"px");e.style.setProperty("--dy",(Math.sin(a)*r-70)+"px");e.style.animationDelay=Math.random()*0.08+"s";
  L.appendChild(e);setTimeout(()=>e.remove(),1200);}}
function stampFx(top,bottom,no){const e=document.createElement("div");e.className="stamp"+(no?" no":"");e.innerHTML=`<b>${top}</b>${bottom?`<span>${bottom}</span>`:""}`;$("fx").appendChild(e);setTimeout(()=>e.remove(),1450);}
function shake(){const a=$("app");a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");}
function countUp(el,from,to,f,ms=900){if(!el)return;const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

function showRankUp(){
  const R=RANKS[S.rank];play("kaching");setTimeout(()=>play("roar"),200);burst(28);
  modal(`<div class="tag">Month ${S.week}</div><div class="rk">${R.t.toUpperCase()}</div>
    <p>You're a ${R.t.toLowerCase()} now. New digs: <b>${R.office}</b>.</p><p class="narr">“${pick(RANK_LINES)}”</p>
