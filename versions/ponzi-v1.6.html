<title>Ponzi Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one screen, never a page scroll. Planning: status strip, one panel of compact control rows, actions at the bottom. The desk is its own screen with the document in the middle. Sizes are in rem and the root size follows the viewport, so everything shrinks to fit shorter phones. Single dark look by choice; documents and the Ledger are newsprint. */
:root{
  --bg:#0f1512; --panel:#17201b; --panel2:#1e2a23; --line:#2b3a31; --fg:#e8efe9; --muted:#8fa497;
  --money:#5fd48a; --gold:#e9c46a; --danger:#ff6b5b; --warn:#f4a259; --chipon:#2c2a1a;
  --paper:#efe9da; --ink:#1d1b17; --inkmuted:#5d574b; --rule:#1d1b17;
  --idbg:#d9e4ec; --idline:#9fb3c2; --idhead:#4a6274; --note:#fff8c9;
  --cold:#0b1018; --sky:#141c22; --narr:#d8cfa8; --stamp:#e2483a;
  --display:"Archivo Black", Impact, "Arial Black", sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --news:"Old Standard TT", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
html{font-size:clamp(10.5px,min(1.9vh,3.9vw),15px)}
@supports (height:1dvh){html{font-size:clamp(10.5px,min(1.9dvh,3.9vw),15px)}}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
.screen{box-sizing:border-box;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:.55rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.6rem;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.warn{color:var(--warn)} .bad{color:var(--danger)} .good{color:var(--money)}

/* Planning screen */
.bar{display:flex;align-items:center;gap:.5rem}
.brand{font-family:var(--display);font-size:1.1rem;letter-spacing:.5px;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-left:.3rem;letter-spacing:0}
.week{flex:1;text-align:center;font-family:var(--display);font-size:1.1rem;color:var(--gold);white-space:nowrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.4rem .65rem;font-size:.8rem;white-space:nowrap}
.chip.paper{background:var(--paper);color:var(--ink);border-color:var(--paper);font-family:var(--news);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:.3rem .45rem;min-width:0}
.stat .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--mono);font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.v.money{color:var(--money)} .v.gold{color:var(--gold)} .v.neg{color:var(--danger)}
.trust{display:flex;align-items:center;gap:.5rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.trust b{font-size:.78rem;text-transform:none;letter-spacing:0;font-weight:600;min-width:5.2rem;text-align:right}
.tbar{flex:1;height:.45rem;background:var(--panel2);border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--money);transition:width .4s}
.last{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.last .k{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.last .ln1{font-family:var(--mono);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last .ln2{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last em{font-style:normal;color:var(--gold)}
.panel{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 .7rem;display:flex;flex-direction:column;justify-content:space-around}
.row{display:grid;grid-template-columns:6.2rem minmax(0,1fr);align-items:center;gap:.6rem;padding:.4rem 0}
.row+.row{border-top:1px solid var(--line)}
.lab{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:.1rem}
.lab small{font-size:.68rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);opacity:.8;line-height:1.25}
.seg{display:flex;gap:.3rem}
.seg button{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.5rem .15rem;font-size:.82rem}
.seg.mono button{font-family:var(--mono)}
.seg button.on{border-color:var(--gold);background:var(--chipon);color:var(--gold)}
.step{display:flex;align-items:center;gap:.4rem}
.step button{width:2.3rem;height:2.3rem;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:7px;font-size:1.1rem}
.step span{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column}
.step b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step small{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.skim{display:flex;align-items:center;gap:.6rem}
.skim input{flex:1;min-width:0;accent-color:var(--gold)}
.skim b{font-family:var(--mono);font-size:.85rem;min-width:2.6rem;text-align:right}
.crew{display:flex;gap:.3rem}
.slot{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.5rem .3rem;font-size:.76rem;display:flex;align-items:center;justify-content:center;gap:.3rem}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty{border-style:dashed;color:var(--muted)}
.dot{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.planbtn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.55rem .7rem;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.forecast{font-size:.76rem;display:flex;justify-content:space-between;gap:.6rem;padding:0 .15rem;min-height:1.1em}
.forecast b{font-family:var(--mono);font-weight:500}
.actions{display:flex;gap:.6rem}
.big{border:none;border-radius:9px;padding:.85rem .5rem;font-family:var(--display);font-size:1rem;letter-spacing:.5px}
.big.go{flex:2;background:var(--money);color:#0b1a10}
.big.run{flex:1;background:var(--danger);color:#1d0806}
.big.alt{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.wide{width:100%}

/* Desk screen */
.deskhead{display:flex;align-items:center;gap:.7rem}
.clock{font-family:var(--display);font-size:1.8rem;color:var(--gold);line-height:1}
.clock.late{color:var(--danger)}
.deskhead .k{font-size:.68rem;color:var(--muted);margin-top:.15rem}
.tray{flex:1;font-family:var(--mono);font-size:.76rem;color:var(--muted);text-align:center;line-height:1.3}
.tools{display:flex;flex-direction:column;gap:.3rem}
.tools .chip{font-size:.74rem;padding:.3rem .55rem}
.docwrap{flex:1;min-height:0;overflow:auto;border-radius:3px}
.doc{background:var(--paper);color:var(--ink);border-radius:3px;padding:.8rem;display:flex;flex-direction:column;gap:.55rem;font-family:var(--news);min-height:100%}
.doctype{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;border-bottom:2px solid var(--rule);padding-bottom:.25rem;display:flex;justify-content:space-between;gap:.5rem}
.doctype span{font-weight:400;text-transform:none;letter-spacing:0;font-style:italic;color:var(--inkmuted);text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;font-size:.92rem}
.kv span{color:var(--inkmuted)} .kv b{min-width:0;overflow-wrap:anywhere}
.quote{margin:0;font-style:italic;font-size:.92rem}
.idcard{background:var(--idbg);color:var(--ink);border:1px solid var(--idline);border-radius:8px;padding:.45rem .65rem;font-family:var(--mono);font-size:.8rem;display:flex;flex-wrap:wrap;gap:.15rem .9rem}
.idcard .idh{width:100%;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--idhead)}
.idcard b{width:100%}
.found{font-family:var(--body);font-size:.78rem;background:var(--note);color:var(--ink);padding:.35rem .5rem;border-radius:2px}
.fld{display:flex;flex-direction:column;gap:.25rem}
.fld>span{font-size:.72rem;color:var(--inkmuted);text-transform:uppercase;letter-spacing:.06em}
.fopt{font-family:var(--body);font-size:.84rem;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--inkmuted);border-radius:4px;padding:.4rem .6rem}
.fopt.on{background:var(--ink);color:var(--paper)}
.deskacts{display:flex;gap:.4rem}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.55rem .45rem;font-size:.8rem}
.deskacts .mini{flex:1}
.deskdec{display:flex;gap:.5rem}
.deskdec .big{flex:1;font-size:.92rem;padding:.85rem .3rem}
.daylog{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.4rem}
.mh{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:600}
.news{border-left:3px solid var(--warn);padding-left:.5rem;font-size:.82rem}

/* Overlays */
.modal{position:fixed;inset:0;background:rgba(5,8,6,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.1rem;max-width:440px;width:100%;display:flex;flex-direction:column;gap:.7rem;max-height:100%;overflow:auto;font-size:.95rem}
.card h3{font-family:var(--display);font-size:1.25rem;margin:0;text-wrap:balance}
.card p{margin:0}
.card .btns{display:flex;flex-direction:column;gap:.5rem}
.card .btns .big{width:100%}
.card .tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.report{display:flex;flex-direction:column;gap:.3rem;font-size:.88rem}
.report .ln{display:flex;justify-content:space-between;gap:.6rem;font-variant-numeric:tabular-nums}
.report .ln span:last-child{font-family:var(--mono)}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{display:flex;justify-content:space-between;gap:.6rem;text-align:left;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.55rem .7rem}
.opt .nm{min-width:0}
.opt .nm small{display:block;color:var(--muted);font-size:.75rem}
.opt .c{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
.opt.owned{border-style:dashed;cursor:default}
.lt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.6rem;display:flex;flex-direction:column;gap:.35rem}
.lt .top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.lt .top b{min-width:0}
.lt .top span{font-size:.75rem;white-space:nowrap}
.lt small{color:var(--muted);font-size:.75rem}
.lt .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.rule{margin:0;font-size:.88rem;padding-left:.6rem;border-left:3px solid var(--gold)}
.cover{display:grid;gap:.45rem;font-size:.88rem}
.cover div{display:flex;flex-direction:column}
.cover span{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cover b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.card.paper{background:var(--paper);color:var(--ink);border-color:var(--paper);border-radius:3px;font-family:var(--news)}
.mast{font-family:var(--news);font-weight:700;font-size:1.6rem;text-align:center;line-height:1.05;border-bottom:3px double var(--rule);padding-bottom:.35rem;text-wrap:balance}
.dateline{display:flex;justify-content:space-between;font-size:.72rem;border-bottom:1px solid var(--rule);padding-bottom:.25rem;color:var(--inkmuted);font-style:italic}
.lead h4{font-size:1.35rem;line-height:1.1;margin:0 0 .2rem;text-wrap:balance}
.lead p,.story p{margin:0;font-size:.8rem;color:var(--inkmuted)}
.stories{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .8rem;border-top:1px solid var(--rule);padding-top:.55rem}
.story{min-width:0}
.story h5{font-size:.9rem;line-height:1.15;margin:0 0 .1rem;text-wrap:balance}
.tipnote{font-family:var(--body);font-size:.8rem;background:var(--note);color:var(--ink);padding:.45rem .6rem;transform:rotate(-1deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.card.paper .big{font-family:var(--display)}
.card.paper .big.alt{background:var(--ink);color:var(--paper);border:none}
.headline{font-family:var(--news);font-weight:700;font-size:1.2rem;background:var(--paper);color:var(--ink);padding:.6rem .75rem;border-radius:3px;text-wrap:balance}
.ep{display:flex;flex-direction:column;gap:.2rem}
.ep p{font-size:.88rem;line-height:1.45}
.endstats{border-top:1px solid var(--line);padding-top:.6rem;display:grid;grid-template-columns:1fr auto;gap:.25rem .8rem;font-size:.88rem}
.endstats span:nth-child(even){font-family:var(--mono);text-align:right}
.big.wide,.wide{width:100%;flex:none}

/* Feel: the rush and the dread */
body{background:var(--bg);background:color-mix(in srgb,var(--bg),var(--cold) calc(var(--chill,0)*80%))}
.screen{filter:saturate(calc(1 - var(--chill,0)*.55))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 calc(var(--chill,0)*9rem) calc(var(--chill,0)*2rem) rgba(0,0,0,calc(var(--chill,0)*.85))}
.brand{display:flex;flex-direction:column;line-height:1.1;color:var(--gold)}
.brand small{margin:0;font-family:var(--body);font-size:.62rem;color:var(--muted)}
.week{color:var(--fg)}
button.stat{font:inherit;color:inherit;text-align:left}
.stat .k em{font-style:normal;color:var(--gold)}
.street{height:2.3rem;flex:none;border-radius:7px;overflow:hidden;background:var(--sky)}
.street svg{display:block;width:100%;height:100%}
.narr{margin:0;font-family:var(--news);font-style:italic;font-size:.84rem;color:var(--narr);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.coin{position:absolute;left:50%;top:45%;width:.9rem;height:.9rem;margin:-.45rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#a8801f);animation:coin 1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:1}55%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}100%{transform:translate(calc(var(--dx)*1.15),calc(var(--dy) + 9rem)) scale(.9);opacity:0}}
.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg);border:.3rem solid var(--stamp);color:var(--stamp);border-radius:.5rem;padding:.3rem 1rem;text-align:center;font-family:var(--display);background:rgba(239,233,218,.08);animation:stampin 1.4s ease-out forwards}
.stamp b{display:block;font-size:2.6rem;letter-spacing:.15em;line-height:1}
.stamp span{display:block;font-size:1.3rem;color:var(--money);letter-spacing:.05em}
.stamp.no{border-color:var(--muted);color:var(--muted)}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-16deg) scale(2.6);opacity:0}16%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}78%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.takebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.2rem;align-items:center;text-align:center}
.take{font-family:var(--display);font-size:2.6rem;color:var(--money);line-height:1.05;font-variant-numeric:tabular-nums}
.speech{display:flex;flex-direction:column;gap:.35rem}
.speech button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:.5rem .7rem;font-family:var(--news);font-style:italic;font-size:.88rem;text-align:left}
.card.gold{background:linear-gradient(165deg,#3b3012,var(--panel) 70%);border-color:var(--gold);text-align:center}
.rk{font-family:var(--display);font-size:2.6rem;color:var(--gold);line-height:1;letter-spacing:.04em}
.card.raid{border:2px solid var(--danger);animation:alarm 1s infinite}
@keyframes alarm{50%{box-shadow:0 0 2.5rem rgba(255,107,91,.45)}}
.count{font-family:var(--display);font-size:4.2rem;color:var(--danger);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}.coin,.stamp,.shake,.card.raid{animation-duration:.01s}}
</style>

function raidChance(s){const h=s.heat;return (h<35?0:Math.pow((h-35)/65,2)*0.4)*(has(s,"lawyer")?0.7:1);}

function makeGazette(s){
  const used=new Set(), items=[];
  const take=pool=>{let o=pool.filter(x=>!used.has(x[0]));if(!o.length)o=pool;const x=pick(o);used.add(x[0]);return x.map(t=>t.replace("{pct}",RATES[s.rate]*100));};
  const signal=()=>take(SIGNALS[tierOf(clamp(s.heat+randn()*12,0,100))]);
  items.push(signal());
  if(Math.random()<0.6)items.push(signal());
  items.push(take(MARKET_NEWS[s.market]));
  // While nobody's looking, the paper loves you.
  if(tierOf(s.heat)<=1&&s.week>1&&Math.random()<0.7)items.push(take(PUFF));
  if(Math.random()<0.6)items.push(take(HERRINGS));
  if(s.lts.some(l=>l.loyalty<30)&&Math.random()<0.7)items.push(["Insider at unnamed fund said to be talking to prosecutors","Sources describe the person as \"senior staff.\""]);
  for(const m of MILESTONES)if(!s.milestones[m.k]&&m.t(s)){s.milestones[m.k]=true;items.push(m.h);break;}
  const news=shuffle(items);
  // Lead with the market if it just turned; otherwise a random real story.
  let lead=s.marketShift?news.findIndex(x=>MARKET_NEWS[s.market].some(m=>m[0]===x[0])):0;
  if(lead<0)lead=0;
  const leadItem=news.splice(lead,1)[0];
  while(news.length<4)news.push(take(FILLER));
  return {week:s.week,lead:leadItem,items:news,tip:has(s,"source")?TIPS[tierOf(s.heat)]:null};
}

// ---------- Weekly simulation ----------
function endWeek(){
  const s=S, r=RATES[s.rate], m=MKT[s.mkt], notes=s.revealNext.slice();
  s.revealNext=[];
  let dHeat=0, dTrust=0;
  const cfo=has(s,"cfo")?0.7:1;

  const pay=payroll(s);
  if(s.cash>=pay){s.cash-=pay;for(const l of s.lts)l.loyalty+=1;}
  else if(pay>0){s.cash=Math.max(0,s.cash-pay);for(const l of s.lts)l.loyalty-=20;notes.push("You couldn't make payroll. Your lieutenants noticed.");}

  const cvCost=coverCost(s);
  s.cash-=m.cost+cvCost;
  if(s.cover==="audit"){dHeat-=8;dTrust+=4;notes.push("A respectable-looking firm signs off on your books.");}
  if(s.cover==="gala"){dTrust+=10;dHeat-=3;notes.push("Your charity gala makes the society pages.");}
  if(s.cover==="bribe"){s.bribes++;if(Math.random()<0.15){dHeat+=25;notes.push("The regulator you tried to bribe reported you.");}else{dHeat-=15;notes.push("A regulator quietly loses your file.");}}
  s.cover="none";

  const skim=Math.floor(Math.max(0,s.cash)*s.skim);
  s.cash-=skim; s.stash+=skim; s.totalSkim+=skim;
  dHeat+=skim/Math.max(s.owed,50e3)*20*(s.prep.shells?0.5:1)*cfo;

  const trustF=Math.max(0.1,s.trust/70);
  const leads=m.leads+s.investors*0.03;
  const newInv=Math.max(0,Math.round(leads*APPEAL[s.rate]*trustF*MARKET[s.market].rec*(has(s,"marketer")?1.3:1)*rand(0.7,1.3)));
  const dep=Math.round(newInv*5e3*(1+0.04*s.week)*rand(0.8,1.2));
  s.investors+=newInv; s.cash+=dep; s.owed+=dep;

  s.owed+=s.owed*r;
  const wf=withdrawFrac(s), due=s.owed*wf, paid=Math.min(Math.max(s.cash,0),due);
  s.cash-=paid; s.owed-=paid;
  const left=Math.min(s.investors,Math.round(s.investors*(0.006+Math.max(0,wf-0.02-0.5*r)*0.5)));
  s.investors-=left;

  if(due>0&&paid<due*0.999){s.missed++;dTrust-=22;dHeat+=12;for(const l of s.lts)l.loyalty-=5;notes.push(`You missed ${fmt(due-paid)} in payouts. Investors are calling the office.`);}
  else{s.missed=0;dTrust+=2+(r>=0.05?1:0);}
  if(has(s,"pr"))dTrust+=2;
  if(s.market==="bust")dTrust-=2;
  dTrust+=lifeTrust(s);

  dHeat+=(0.6*Math.log10(Math.max(s.owed,1e4)/1e4)+s.investors/1000*0.3)*cfo+m.heat+Math.max(0,r-0.03)*80-1;
  if(s.trust<30)dHeat+=2;
  s.heat=clamp(s.heat+dHeat,0,100); s.trust=clamp(s.trust+dTrust,0,100);

  // Lieutenants get nervous when things are hot. Shifty ones may flip.
  for(const l of s.lts.slice()){
    if(s.heat>50)l.loyalty-=(s.heat-50)/8;
    l.loyalty=clamp(l.loyalty,0,100);
    if(l.loyalty<30&&Math.random()<(30-l.loyalty)/60){
      s.lts=s.lts.filter(x=>x!==l);s.flipped.push(l);s.heat=clamp(s.heat+25,0,100);
      notes.push(`${l.name} stopped coming to work. Their desk has been cleaned out.`);
    }
  }

  // Market drifts between boom, normal and bust.
  s.marketShift=false;
  if(Math.random()<0.12){s.market=s.market==="normal"?pick(["boom","bust"]):"normal";s.marketShift=true;}

  s.peakOwed=Math.max(s.peakOwed,s.owed); s.peakInv=Math.max(s.peakInv,s.investors);
  const nr=rankOf(s);if(nr>s.rank){s.rank=nr;s.rankUp=true;}
  // What the player feels instead of sees: a noisy reading of the heat.
  s.chill=clamp((s.heat+randn()*8)/100,0,1);
  s.carSeen=Math.random()<clamp((s.heat-20)/80,0,1)*0.9;
  s.narr=narrate(s);
  s.report={newInv,dep,due,paid,skim,left,pay,spend:m.cost+cvCost};
  s.reportedAUM=s.owed; s.claimed+=r*100;
  const known=rulesKnown(s).length;
  s.week++;
  for(const rl of rulesKnown(s).slice(known))notes.push(`<b>New page in your black book:</b> ${rl.t}`);
  s.notes=notes;

  if(s.missed>=2||s.trust<=0){collapse();return;}
  if(s.week>=3&&Math.random()<0.55){showEvent();return;}
  raidCheck();
}

function raidCheck(){
  const s=S; s.heat=clamp(s.heat,0,100); s.trust=clamp(s.trust,0,100);
  for(const l of s.lts)l.loyalty=clamp(l.loyalty,0,100);
  if(Math.random()<raidChance(s)){startRaid();return;}
  s.gazette=makeGazette(s);
  render();
  if(s.rankUp){s.rankUp=false;showRankUp();}else showGazette();
}

function collapse(){
  const s=S;
  modal(`<div class="tag">Week ${s.week}</div><h3>The fund has collapsed</h3><p>You can't pay what you owe and investors are lining up outside. The authorities will be here within hours.</p>
    <p>Escape readiness: ${readyLabel(readiness(s))}. If you make it, you keep ${fmt(s.stash*keepShare(s))}.</p>
    <div class="btns"><button class="big run" data-act="flee" data-v="20">Run</button></div>`);
}

function confirmRun(){
  const s=S;
  modal(`<h3>Flee now?</h3><p>Escape readiness: <b>${readyLabel(readiness(s))}</b>. The closer the authorities are, the worse your real odds.</p><p>If you make it, you keep <b class="good">${fmt(s.stash*keepShare(s))}</b>${s.prep.shells?"":" (40% gets frozen without shell companies)"}. If you're caught, you lose everything.</p>
    <div class="btns"><button class="big run" data-act="flee" data-v="0">Disappear</button><button class="big alt" data-act="close">Stay another week</button></div>`);
}

function attemptEscape(pen,how){
  const o=escapeOdds(S,pen);
  ending(Math.random()*100<o?"escaped":"failed",o,how||(pen===20?"collapse":"run"));
}

function sentence(s){return Math.round(clamp(4+Math.log10(Math.max(s.owed+s.totalSkim,1e5)/1e5)*35,4,150)*(has(s,"lawyer")?0.5:1));}
function ending(kind,odds,how){
  const s=S, kept=Math.round(s.stash*keepShare(s));
  const tag=kind==="escaped"?"You got away":"Caught";
  const head=pick(kind==="escaped"?[`${FUND} founder vanishes; ${fmt(s.peakOwed)} missing`,`Where is ${FUND}'s founder?`,`${FUND} offices found empty except for a fern`]
    :kind==="failed"?[`${FUND} founder caught fleeing`,`Fund boss nabbed on the way out`,`${FUND} founder's getaway ends early`]
    :[`Federal agents raid ${FUND}`,`${FUND} founder in handcuffs`,`"Nothing but upside": ${FUND} founder arrested`]);
  const story=epilogue(s,kind,how).map(([h,t])=>`<div class="ep"><div class="tag">${h}</div><p>${t}</p></div>`).join("");
  const score=kind==="escaped"?kept:0;
  let best=0;try{best=+localStorage.getItem("ponzi-best")||0;if(score>best)localStorage.setItem("ponzi-best",score);}catch(e){}
  modal(`<div class="tag">${tag} · week ${s.week}</div><div class="headline">${head}</div>${story}
    <div class="endstats"><span>Weeks running</span><span>${s.week}</span><span>Peak investors</span><span>${num(s.peakInv)}</span>
    <span>Peak owed</span><span>${fmt(s.peakOwed)}</span><span>Total skimmed</span><span>${fmt(s.totalSkim)}</span>
    <span>How close they really were</span><span>${HEAT_WORDS[tierOf(s.heat)]}</span>
    ${odds!=null?`<span>Your real escape odds</span><span>${odds}%</span>`:""}
    <span>Score (stash kept)</span><span class="${score?"good":"bad"}">${fmt(score)}</span><span>Best escape</span><span>${fmt(Math.max(best,score))}</span></div>
    <div class="btns"><button class="big go" data-act="restart">New scheme</button></div>`);
}

// ---------- The desk ----------
// A turn-based workday: every card and every check spends minutes until 5 pm.
const DAY=480, BASE=10, T_REF=30, T_BG=60, T_ASK=20;
const formTime=s=>has(s,"cfo")?20:45;
const FIRST=["Thomas","Linda","Marcus","Grace","Owen","Beatrice","Rafael","Nora","Desmond","Ivy","Curtis","Helen","Arjun","Dolores","Frank","Yuki","Leon","Martha","Elliot","Rosa"];
const LAST=["Hale","Whitaker","Moreno","Lindqvist","Okoro","Brandt","Castillo","Pruitt","Nakamura","Feld","Dorsey","Abara","Kemp","Vance","Ostrowski","Bell","Ferreira","Gallo"];
const JOBS=[["Dentist","Ashford Dental Group"],["Orthopedic surgeon","St. Brigid's Hospital"],["Car dealer","Bayline Motors"],["Retired pilot","Coastal Airways pension"],["Restaurant owner","Gallo's Trattoria"],["Real estate agent","Harborview Realty"],["Software engineer","Kestrel Systems"],["Retiree","Living off savings"],["Plastic surgeon","Ashford Aesthetics"],["Freelance photographer","Self-employed"],["Accountant","Dunmore & Pike"],["Retired judge","State pension"],["Management consultant","Self-employed"]];
const STREETS=["Birch Lane","Ocean Ave","Harbor Rd","Maple Court","Cliffside Dr","Elm St","Pelican Way","Lighthouse Rd"];
const BANKS=["Harbor Savings","First Ashford Trust","Coastal Mutual","Bayline Credit Union"];
const PAY=["Cashier's check","Wire","Personal check"];
const HONEST_Q=["My brother-in-law can't stop talking about you.","I just want something steady for retirement.","Is it true you've never had a down month?","My financial adviser is going to be so jealous.","How soon can I add more?","Can I bring my accountant next time?","Where do the returns come from, roughly?"];
const PLANT_Q=["I'm a big believer in steady returns.","Would you walk me through the strategy?","How many investors do you have, ballpark?","I'd love to see a recent statement, if that's okay.","Do you keep the money here or overseas?"];
const NOTES_Q="Mind if I take a few notes? I like to keep track of things.";
const CHANNEL=["a friend","a flyer","your seminar sign-up sheet","your radio ad","your TV ad","your global campaign"];
const RULES=[
  {w:1,t:"The name on the ID must match the application exactly."},
  {w:1,t:"Check the ID's expiry date against today's date. Real people renew. Cover identities get sloppy."},
  {w:3,t:"Federal agents bank at the Federal Employees Credit Union. Never take their checks."},
  {w:4,t:"Plants say yes to any pitch. Real people only bite on the one that fits them."},
  {w:5,t:"200 Harbor Plaza is the federal building. Nobody lives there."},
  {w:7,t:"Reporters call themselves freelance writers and like to take notes."},
  {w:9,t:"Referrals can be faked. If the referral isn't one of your investors, it's a plant."},
  {w:11,t:"State regulators pay by wire from Capitol Savings & Loan."},
];
const rulesKnown=s=>RULES.filter(r=>s.week>=r.w-(has(s,"source")?4:0));
const COVER={auditor:"Pell & Marsh, CPAs",bank:"First Ashford Trust",strategy:"Split-strike options trading",wires:"Client redemptions"};
const VIS_TAGS=[{l:"Keeps to themselves",h:0,t:-1},{l:"Posts about everything online",h:5,t:-4},{l:"Their son is a lawyer",h:7,t:-2},{l:"Brought in 30 other investors",h:1,t:-8}];
const HID_TAGS=[{l:"Treasurer of a church investment group",h:2,t:-10},{l:"Dating a Ledger reporter",h:10,t:-2},null,null];
const WD_Q=["My daughter's wedding is in June.","The roof is leaking. I need it by Friday.","Just taking some profits. You understand.","My accountant says I should diversify.","I'm buying a boat!","I'm settling my late husband's estate."];
const BG={agent:"Employment records sealed. Previous address: FBI Academy housing, Quantico, VA.",reporter:"Byline found: Port Ashford Ledger, business desk.",regulator:"On the payroll of the State Securities Division since 2014."};
const REVEAL={agent:n=>`${n}, the investor you signed last week, is an FBI agent. They took a lot of notes.`,
  reporter:n=>`${n}, the investor you signed last week, is a Ledger reporter. Their article is coming.`,
  regulator:n=>`${n}, the investor you signed last week, works for the State Securities Division.`};
const DODGE={agent:n=>`${n}, whom you turned away, was seen walking into 200 Harbor Plaza.`,
  reporter:n=>`${n}, whom you turned away, wrote a column: "The fund that wouldn't take my money."`,
  regulator:n=>`${n}, whom you turned away, turned out to be a state regulator.`};

const gameDate=w=>new Date(2027,0,4+(w-1)*7);
const mmYYYY=d=>String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
const monthsFrom=(w,m)=>{const d=gameDate(w);return new Date(d.getFullYear(),d.getMonth()+m,1);};
function clock(t){const m=540+(DAY-t);let h=Math.floor(m/60);const mm=String(m%60).padStart(2,"0"),ap=h>=12?"pm":"am";if(h>12)h-=12;return `${h}:${mm} ${ap}`;}
const newName=()=>pick(FIRST)+" "+pick(LAST);
function misspell(w){const v="aeiou";for(let i=1;i<w.length;i++)if(v.includes(w[i]))return w.slice(0,i)+v[(v.indexOf(w[i])+1+Math.floor(Math.random()*4))%5]+w.slice(i+1);return w+"e";}

function makeApplicant(s){
  const plant=s.week>1&&Math.random()<0.05+s.heat/100*0.45;
  const first=pick(FIRST), last=pick(LAST), job=pick(JOBS);
  const a={kind:"app",plant,type:plant?pick(["agent","agent","reporter","regulator"]):null,
    name:`${first} ${last}`,idName:`${first} ${last}`,age:Math.round(rand(29,76)),job:job[0],employer:job[1],
    address:`${Math.floor(rand(2,300))} ${pick(STREETS)}`,pay:`${pick(PAY)}, ${pick(BANKS)}`,
    quote:pick(plant?PLANT_Q.concat(HONEST_Q):HONEST_Q),
    ref:s.named.length&&Math.random()<0.6?pick(s.named):null,fakeRef:false,channel:CHANNEL[s.mkt],
    exp:mmYYYY(monthsFrom(s.week,Math.round(rand(3,60)))),
    dep:Math.round(Math.max(5e3*(1+0.04*s.week)*rand(3,10),s.owed*rand(0.003,0.012))/1e3)*1e3,checks:{}};
  if(plant){
    const pool={agent:["mismatch","expired","fecu","fedaddr","fakeref"],reporter:["freelance","fakeref","expired","mismatch"],regulator:["capitol","fedaddr","mismatch"]}[a.type];
    const n=Math.random()<0.1?0:Math.random()<0.6?1:2;
    for(const t of shuffle(pool.slice()).slice(0,n)){
      if(t==="mismatch")a.idName=`${first} ${misspell(last)}`;
      if(t==="expired")a.exp=mmYYYY(monthsFrom(s.week,-Math.round(rand(1,18))));
      if(t==="fecu")a.pay="Cashier's check, Federal Employees Credit Union";
      if(t==="fedaddr")a.address="200 Harbor Plaza";
      if(t==="fakeref"){let n2;do n2=newName();while(s.named.includes(n2));a.ref=n2;a.fakeRef=true;}
      if(t==="freelance"){a.job="Freelance writer";a.employer="Self-employed";a.quote=NOTES_Q;}
      if(t==="capitol"){a.pay="Wire, Capitol Savings & Loan";a.job="Consultant";a.employer="Brightline Advisory";}
    }
  }else{
    // Real people want one thing: safety, status or a big score. Their job and their words give it away.
    a.pref=PREF[a.job]||pick(["safety","status","greed"]);
    a.quote=Math.random()<0.75?pick(QBY[a.pref]):pick(HONEST_Q);
  }
  return a;
}
function makeWithdrawal(s){
  const job=pick(JOBS);
  return {kind:"wd",name:s.named.length&&Math.random()<0.5?pick(s.named):newName(),job:job[0],
    amt:Math.round(Math.max(10e3,s.owed*rand(0.005,0.02))/1e3)*1e3,quote:pick(WD_Q),vis:pick(VIS_TAGS),hid:pick(HID_TAGS),checks:{}};
}
function makeForm(s){
  const AUM=["Assets under management",[["c",fmt(s.reportedAUM)],["t",fmt(Math.max(0,s.cash))],["o",fmt(s.reportedAUM*rand(1.2,1.5))]]];
  const RET=["Return since launch",[["c",`${s.claimed.toFixed(0)}%`],["t","0%"],["o",`${Math.round(s.claimed*rand(1.2,1.5)+3)}%`]]];
  const AUD=["Auditor of record",[["c",COVER.auditor],["t","None"],["o","Grant & Lyle LLP"]]];
  const BANK=["Custodian bank",[["c",COVER.bank],["t","Self-custodied"],["o","Coastal Mutual"]]];
  const STRAT=["Investment strategy",[["c",COVER.strategy],["t","New deposits pay old investors"],["o","Commercial real estate"]]];
  const WIRE=["Purpose of outgoing wires",[["c",COVER.wires],["t","Transfers to my offshore account"],["o","Options trading margin"]]];
  const T=pick([
    {from:"State Securities Division",title:"Form ADV annual update",fields:[AUM,BANK,STRAT]},
    {from:"Grant & Lyle LLP, for a large investor",title:"Audit confirmation request",fields:[AUM,AUD,RET]},
    {from:"First Ashford Trust, compliance desk",title:"Wire activity review",fields:[WIRE,AUM]},
    {from:"A wealthy investor's family office",title:"Annual performance letter",fields:[RET,STRAT,AUD]},
  ]);
  return {kind:"form",from:T.from,title:T.title,fields:T.fields.map(([l,o])=>({l,o:shuffle(o.map(x=>x.slice())),pick:null}))};
}

function startDesk(){
  const s=S, q=[];
  const nApps=clamp(2+Math.floor(s.mkt*0.8)+(Math.random()<0.5?1:0),2,7);
  for(let i=0;i<nApps;i++)q.push(makeApplicant(s));
  if(s.investors>20)for(let i=Math.random()<0.5?1:2;i>0;i--)q.push(makeWithdrawal(s));
  if(s.week>=3){if(Math.random()<0.25+s.heat/200)q.push(makeForm(s));if(s.heat>60&&Math.random()<0.5)q.push(makeForm(s));}
  s.desk={time:DAY,q:shuffle(q),i:0,log:[],freeBg:has(s,"source")?1:0,done:false};
  renderDesk();
  if(s.week===1)modal(`<h3>Your desk</h3><p>Big investors come to you in person. Most are real. Some are plants: agents, reporters or regulators collecting evidence.</p>
    <p>Your black book lists the tells you know. Every check costs time, and the office closes at 5.</p>
    <div class="btns"><button class="big go" data-act="close">Open the door</button></div>`);
}

function renderDesk(){
  const s=S, d=s.desk;
  if(d.i>=d.q.length||d.time<BASE){deskSummary();return;}
  const p=cardParts(d.q[d.i],s,d);
  setChill(s);
  // The phone rings more as the walls close in.
  if(d.rung!==d.i){d.rung=d.i;if(d.i>0&&Math.random()<s.heat/150)play("ring");}
  $("app").innerHTML=`<header class="deskhead"><div><div class="clock ${d.time<90?"late":""}">${clock(d.time)}</div>
      <div class="k">Today: ${gameDate(s.week).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div></div>
    <div class="tray">${d.q.length-d.i} in tray<br>Closes 5:00 pm</div>
    <div class="tools"><button class="chip" data-act="book">Black book</button><button class="chip" data-act="story">Cover story</button></div></header>
    <div class="docwrap">${p.doc}</div>${p.acts}${p.dec}`;
}

// Each card has three parts: the paper, the checks you can run, and the decision.
function cardParts(c,s,d){
  const t=d.time, dis=cost=>t<cost+BASE?"disabled":"";
  if(c.kind==="app"){
    const free=d.freeBg>0;
    return {doc:`<div class="doc"><div class="doctype">New investor application</div>
      <div class="kv"><span>Name</span><b>${c.name}</b><span>Age</span><b>${c.age}</b><span>Occupation</span><b>${c.job}, ${c.employer}</b>
      <span>Address</span><b>${c.address}</b><span>Deposit</span><b>${fmt(c.dep)}</b><span>Payment</span><b>${c.pay}</b>
      <span>Referred by</span><b>${c.ref||"Heard about you from "+c.channel}</b></div>
      <p class="quote">"${c.quote}"</p>
      <div class="idcard"><div class="idh">State of Ashford · ID card</div><b>${c.idName.toUpperCase()}</b><span>Age ${c.age}</span><span>Exp. ${c.exp}</span></div>
      ${c.checks.ref?`<div class="found"><b>Referral:</b> ${c.checks.ref}</div>`:""}
      ${c.checks.bg?`<div class="found"><b>Background:</b> ${c.checks.bg}</div>`:""}
      ${c.resp?`<div class="found"><b>You pitched "${c.pitchName}":</b> "${c.resp}"</div>`:""}</div>`,
      acts:`<div class="deskacts"><button class="mini" data-act="dchk" data-v="ref" ${c.checks.ref?"disabled":dis(T_REF)}>Call referral · 30m</button>
        <button class="mini" data-act="dchk" data-v="bg" ${c.checks.bg?"disabled":free?"":dis(T_BG)}>Background · ${free?"free":"1 hr"}</button></div>`,
      dec:`<div class="deskdec"><button class="big run" data-act="ddec" data-v="reject">Turn away</button>${c.pitched
        ?`<button class="big go" data-act="ddec" data-v="accept">Close · ${fmt(c.dep)}</button>`
        :`<button class="big go" data-act="pitch" ${dis(BASE)}>Pitch · ${fmt(c.dep)}</button>`}</div>`};
  }
  if(c.kind==="wd"){
    return {doc:`<div class="doc"><div class="doctype">Withdrawal request</div>
      <div class="kv"><span>Investor</span><b>${c.name}</b><span>Occupation</span><b>${c.job}</b><span>Amount</span><b>${fmt(c.amt)}</b><span>What you know</span><b>${c.vis.l}</b></div>
      <p class="quote">"${c.quote}"</p>
      ${c.checks.ask?`<div class="found"><b>Word around town:</b> ${c.checks.ask}</div>`:""}</div>`,
      acts:`<div class="deskacts"><button class="mini" data-act="dchk" data-v="ask" ${c.checks.ask?"disabled":dis(T_ASK)}>Ask around · 20m</button></div>`,
      dec:`<div class="deskdec"><button class="big run" data-act="ddec" data-v="stall">Stall</button>
        <button class="big alt" data-act="ddec" data-v="half" ${s.cash<c.amt/2?"disabled":""}>Pay half</button>
        <button class="big go" data-act="ddec" data-v="pay" ${s.cash<c.amt?"disabled":""}>Pay ${fmt(c.amt)}</button></div>`};
  }
  const ready=c.fields.every(f=>f.pick!=null), ft=formTime(s);
  return {doc:`<div class="doc"><div class="doctype">${c.title}<span>${c.from}</span></div>
    ${c.fields.map((f,fi)=>`<div class="fld"><span>${f.l}</span>${f.o.map((o,oi)=>`<button class="fopt ${f.pick===oi?"on":""}" data-act="dopt" data-v="${fi}:${oi}">${o[1]}</button>`).join("")}</div>`).join("")}</div>`,
    acts:"",
    dec:`<div class="deskdec"><button class="big run" data-act="ddec" data-v="ignore">Leave it</button>
      <button class="big go" data-act="ddec" data-v="file" ${ready&&t>=ft?"":"disabled"}>File it · ${ft} min</button></div>`};
}

function deskCheck(v){
  const s=S, d=s.desk, c=d.q[d.i];
  if(c.checks[v])return;
  if(v==="ref"){if(d.time<T_REF+BASE)return;d.time-=T_REF;
    c.checks.ref=c.fakeRef?`Nobody named ${c.ref} has an account with you.`
      :c.ref?(c.plant&&Math.random()<0.5?`${c.ref}: "Never met them. Maybe at the gym?"`:`${c.ref}: "${pick(["Yeah, I told them about you. Good people.","Sure, we play golf together.","That's my neighbor. Take their money!"])}"`)
      :`Their name is on the list from ${c.channel}.`;}
  if(v==="bg"){const free=d.freeBg>0;if(!free&&d.time<T_BG+BASE)return;if(free)d.freeBg--;else d.time-=T_BG;
    c.checks.bg=c.plant?BG[c.type]:`${c.job}, ${c.employer}. Credit is solid. No red flags.`;}
  if(v==="ask"){if(d.time<T_ASK+BASE)return;d.time-=T_ASK;c.checks.ask=c.hid?c.hid.l:"Nothing else worth knowing.";}
  renderDesk();
}

function stallHit(s,c,k){for(const t of [c.vis,c.hid])if(t){s.heat+=t.h*k;s.trust+=t.t*k;}}
function deskDecide(v){
  const s=S, d=s.desk, c=d.q[d.i];
  if(c.kind==="app"){
    d.time-=BASE;
    if(v==="accept"){
      s.cash+=c.dep;s.owed+=c.dep;s.investors++;d.take=(d.take||0)+c.dep;d.signed=(d.signed||0)+1;d.log.push(`Signed ${c.name} for ${fmt(c.dep)}.`);
      if(c.plant){s.heat+={agent:18,reporter:12,regulator:15}[c.type];s.plantsAccepted++;s.revealNext.push(REVEAL[c.type](c.name));}
      else s.named.push(c.name);
      // The rush. Plants get the same celebration; you don't know yet.
      play("stamp");setTimeout(()=>play("kaching"),160);stampFx("SIGNED","+"+fmt(c.dep));burst(c.hooked?18:9);
      if(c.dep>=Math.max(80e3,s.owed*0.02))shake();
    }else{
      play("walk");
      d.log.push(`Turned away ${c.name}.`);
      if(c.plant){if(Math.random()<0.5)s.revealNext.push(DODGE[c.type](c.name));}
      else{s.trust-=1;s.honestRejected++;if(Math.random()<0.3)s.revealNext.push(`${c.name}, whom you turned away, put ${fmt(c.dep)} in a savings account instead. Lucky them.`);}
    }
  }else if(c.kind==="wd"){
    if(v==="pay"){if(s.cash<c.amt)return;s.cash-=c.amt;s.owed-=c.amt;s.trust+=2;d.log.push(`Paid ${c.name} ${fmt(c.amt)}.`);}
    else if(v==="half"){const h=Math.round(c.amt/2);if(s.cash<h)return;s.cash-=h;s.owed-=h;stallHit(s,c,0.5);d.log.push(`Paid ${c.name} half. They want the rest.`);}
    else{stallHit(s,c,1);d.log.push(`Stalled ${c.name}. "The check is in the mail."`);}
    d.time-=BASE;
  }else{
    if(v==="file"){
      if(c.fields.some(f=>f.pick==null)||d.time<formTime(s))return;
      d.time-=formTime(s);let errs=0;
      for(const f of c.fields){const k=f.o[f.pick][0];
        if(k==="t"){s.heat+=12;errs++;d.log.push(`${c.title}: you told the truth about "${f.l.toLowerCase()}." That's a confession.`);}
        else if(k==="o"){s.heat+=7;errs++;d.log.push(`${c.title}: "${f.l.toLowerCase()}" doesn't match what you've told everyone else.`);}}
      if(!errs){s.heat-=2;d.log.push(`${c.title}: filed. Your story holds.`);}
    }else{d.time-=BASE;s.heat+=6;d.log.push(`You ignored the ${c.title.toLowerCase()}. ${c.from} will follow up.`);}
  }
  s.heat=clamp(s.heat,0,100);s.trust=clamp(s.trust,0,100);
  d.i++;renderDesk();
}

function deskSummary(){

}

const setChill=s=>document.body.style.setProperty("--chill",(s.chill||0).toFixed(3));

// ---------- Sound (synthesized, no files) ----------
const SND={on:true,ctx:null,fx:null,mus:null};
try{SND.on=localStorage.getItem("ponzi-sound")!=="off";}catch(e){}
function ac(){
  if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C();
    SND.fx=SND.ctx.createGain();SND.fx.gain.value=0.5;SND.fx.connect(SND.ctx.destination);
    SND.mus=SND.ctx.createGain();SND.mus.gain.value=0.16;SND.mus.connect(SND.ctx.destination);}catch(e){return null;}}
  if(SND.ctx.state==="suspended")SND.ctx.resume();
  return SND.ctx;
}
function tone(f,t,dur,type,vol,to,out){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out||SND.fx);o.start(t);o.stop(t+dur+0.02);
}
let NOISE=null;
function noise(t,dur,vol,freq,type,out){
  const c=SND.ctx;
  if(!NOISE){NOISE=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=NOISE;src.loop=true;f.type=type||"bandpass";f.frequency.value=freq||1000;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(out||SND.fx);src.start(t);src.stop(t+dur+0.02);
}
const SFX={
  kaching:t=>{noise(t,0.06,0.25,5000,"highpass");tone(1568,t+0.02,0.12,"square",0.12);tone(2093,t+0.09,0.45,"square",0.12);tone(2637,t+0.09,0.45,"triangle",0.08);},
  coins:t=>{for(let i=0;i<7;i++)tone(1800+Math.random()*1600,t+i*0.045,0.08,"triangle",0.07);},
  stamp:t=>{tone(120,t,0.18,"sine",0.6,45);noise(t,0.1,0.35,900,"lowpass");},
  tick:t=>tone(1200,t,0.025,"square",0.03),
  walk:t=>tone(300,t,0.2,"triangle",0.1,170),
  ring:t=>{for(let k=0;k<2;k++)for(let i=0;i<8;i++){tone(440,t+k*0.55+i*0.05,0.045,"sine",0.06);tone(480,t+k*0.55+i*0.05,0.045,"sine",0.06);}},
  thump:t=>{tone(60,t,0.14,"sine",0.7,38);tone(55,t+0.2,0.12,"sine",0.5,38);},
  roar:t=>{noise(t,1.6,0.4,700,"bandpass");noise(t+0.1,1.4,0.25,1600,"bandpass");},
  siren:t=>{const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type="sawtooth";o.frequency.setValueAtTime(600,t);
    for(let i=0;i<4;i++){o.frequency.linearRampToValueAtTime(950,t+i*0.6+0.3);o.frequency.linearRampToValueAtTime(600,t+i*0.6+0.6);}
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06,t+0.05);g.gain.setValueAtTime(0.06,t+2.3);g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
    o.connect(g);g.connect(SND.fx);o.start(t);o.stop(t+2.5);},
};
function play(name){if(!SND.on)return;const c=ac();if(!c)return;try{SFX[name](c.currentTime+0.01);}catch(e){}}
// Music: a swaggering groove while things are good, a heartbeat and a drone when they aren't.
const MUS={iv:null,step:0,next:0};
function musicOn(){const c=ac();if(!c||MUS.iv||!SND.on)return;MUS.next=c.currentTime+0.1;MUS.iv=setInterval(musicTick,60);}
function musicOff(){clearInterval(MUS.iv);MUS.iv=null;}
function musicTick(){
  const c=SND.ctx;if(!c||!SND.on)return;
  const ch=(S&&S.chill)||0, tense=ch>0.5, spb=60/(tense?76:108)/4, o=SND.mus;
  while(MUS.next<c.currentTime+0.25){
    const st=MUS.step%16, bar=Math.floor(MUS.step/16), t=MUS.next;
    if(!tense){
      if(st===0||st===6||st===8)tone(70,t,0.18,"sine",0.9,40,o);
      if(st===4||st===12)noise(t,0.12,0.35,1800,"bandpass",o);
      if(st%2===0)noise(t,0.03,0.12,8000,"highpass",o);
      const root=[55,55,49,61.7][bar%4];
      if(st===0||st===3||st===8||st===11)tone(root*(st===11?1.5:1),t,0.22,"sawtooth",0.18,null,o);
      if(st===14&&bar%2===1)tone(root*4,t,0.12,"square",0.06,null,o);
    }else{
      if(st===0)tone(55,t,0.16,"sine",1,36,o);
      if(st===3)tone(50,t,0.14,"sine",0.7,36,o);
      if(st===0&&bar%2===0)tone(73.4,t,spb*32,"sawtooth",0.05,null,o);
      if(st===8&&ch>0.75)tone(1046+Math.random()*30,t,0.08,"sine",0.04,null,o);
    }
    MUS.next+=spb;MUS.step++;
  }
}
function setSound(on){SND.on=on;try{localStorage.setItem("ponzi-sound",on?"on":"off");}catch(e){}if(on){ac();musicOn();}else musicOff();}
document.addEventListener("pointerdown",()=>{if(SND.on){ac();musicOn();}});

// ---------- Effects ----------
function burst(n){const L=$("fx");for(let i=0;i<n;i++){const e=document.createElement("i"),a=Math.random()*Math.PI*2,r=60+Math.random()*130;
  e.className="coin";e.style.setProperty("--dx",Math.cos(a)*r+"px");e.style.setProperty("--dy",(Math.sin(a)*r-70)+"px");e.style.animationDelay=Math.random()*0.08+"s";
  L.appendChild(e);setTimeout(()=>e.remove(),1200);}}
function stampFx(top,bottom,no){const e=document.createElement("div");e.className="stamp"+(no?" no":"");e.innerHTML=`<b>${top}</b>${bottom?`<span>${bottom}</span>`:""}`;$("fx").appendChild(e);setTimeout(()=>e.remove(),1450);}
function shake(){const a=$("app");a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");}
function countUp(el,from,to,f,ms=900){if(!el)return;const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

// Built from sections chosen by what actually happened in the run, each with its own variants.
const flag=(s,t)=>s.flags?s.flags[t]:undefined;
const methodOf=s=>s.prep.jet?"jet":s.yacht?"yacht":s.prep.passport?"passport":"none";
function epilogue(s,kind,how){
  const out=[], m=methodOf(s), kept=Math.round(s.stash*keepShare(s)), frozen=s.stash-kept, yrs=sentence(s);

  // The ending scene
  const ESC={
    jet:[`At 3 a.m. your jet lifted off from a private strip outside ${CITY}. The pilot never asked your name.`,
         `You told your assistant you had a conference in Geneva. The jet filed a flight plan for Geneva. It landed somewhere else.`],
    yacht:[`You sailed out of ${CITY} harbor at dawn and waved at the coast guard like any other rich idiot.`,
           `You took the yacht out "for the weekend." Past the twelve-mile line, you threw your phone overboard.`],
    passport:[`You walked through airport security as Gerald Pemberton, a man who sells industrial carpet. Nobody looked twice.`,
              `Your new passport said you were a Canadian dentist. You practiced the accent for the whole flight.`],
    none:[`You crossed the border on a Greyhound bus with a duffel bag of cash and a fake mustache. Somehow, it worked.`,
          `You drove south for nineteen hours with the radio off and the cash in a picnic cooler.`],
  };
  const FAIL={
    jet:[`The jet never got clearance. Agents were waiting on the tarmac with coffee.`,`Your pilot had made a deal with the FBI. He landed the jet right back in ${CITY}.`],
    yacht:[`The coast guard boarded your yacht eleven miles out. You were wearing a captain's hat.`,`The yacht ran out of fuel within sight of the shore. Nobody had checked.`],
    passport:[`The passport was good. The photo wasn't. The border agent compared it to the poster on her wall.`,`You forgot your new name at passport control. Twice.`],
    none:[`You were arrested at a gas station forty miles from the border, paying cash for beef jerky.`,`You missed your flight by four minutes. The agents didn't.`],
  };
  let scene;
  if(kind==="escaped"){
    scene=how==="raid"?(s.prep.jet?`Agents came through the front door as you went out the back. Your jet left the runway ninety seconds before the airport was shut down.`
      :`You went down the fire escape as agents came up the stairs, flagged a cab, and made the last flight out with a gym bag full of cash.`)
      :(how==="collapse"?"With investors pounding on the front door, you slipped out through the noodle shop next door. ":"")+pick(ESC[m]);
  }else if(kind==="failed"){
    scene=how==="raid"?(s.prep.jet?`You made it to the hangar. So did the FBI.`:`You made it down the fire escape. Two agents were waiting in the alley, eating sandwiches.`)
      :(how==="collapse"?"You ran the night the fund collapsed, with half the city looking for you. ":"")+pick(FAIL[m]);
  }else if(how==="surrender"){
    scene=`Agents filled the lobby. You straightened your tie, put your hands up and asked for a lawyer.`;
  }else if(how==="froze"){
    scene=`You heard them on the stairs and froze. You were still standing at the window, watching the street, when they came in.`;
  }else{
    scene=pick([`Agents knocked at 6 a.m. You answered in a bathrobe that cost more than most people's rent.`,
      `They arrested you in the middle of a seminar, in front of two hundred potential investors. Three of them still asked for your card.`,
      `Agents walked into your office while you were on the phone promising someone "nothing but upside."`,
      `They picked you up at the car wash. Your Bentley was half rinsed.`]);
  }
  if(s.week<=6)scene+=` The whole thing lasted ${s.week} weeks. Historians still argue over whether it counts as a scheme or a long weekend.`;
  out.push(["The end",scene]);

  // Your new life, or prison
  if(kind==="escaped"){
    let life=kept<50e3?`You got away with ${fmt(kept)}. It lasted fourteen months. Now you tend bar in a beach town under a name you keep forgetting.`
      :kept<500e3?`${fmt(kept)} bought a small café by the sea. The coffee is bad. Nobody asks questions.`
      :kept<5e6?`${fmt(kept)} bought a house on a hill, a new nose, and a golden retriever named Dividend.`
      :kept<50e6?`${fmt(kept)} goes a long way in a country with no extradition treaty. You bought the local football club. The stadium carries your new name.`
      :`With ${fmt(kept)}, you bought an island. Then a second island, to keep an eye on the first.`;
    if(frozen>0)life+=` Another ${fmt(frozen)} was frozen by a bank that suddenly remembered its compliance rules.`;
    if(!s.prep.villa)life+=` You never set up a safe home, so you move every few months and never unpack.`;
    out.push(["Your new life",life]);
  }else{
    let fate=s.prep.shells?`Your shell companies kept investigators busy for years. They clawed back ${fmt(s.stash*0.3)} of your ${fmt(s.stash)} stash.`
      :s.stash>0?`Investigators found your offshore stash in a week. All ${fmt(s.stash)} of it.`
      :`There was no stash. You never kept a dollar for yourself. Prosecutors found that the most confusing part of the case.`;
    fate+=` The judge gave you ${yrs} years.`+(has(s,"lawyer")?` Your lawyer called it a win.`:"")
      +(yrs>=100?` The judge said the number was symbolic. It doesn't feel symbolic.`:yrs<=15?` You'll be out before your hair goes fully gray.`:"");
    fate+=" "+pick([`You run the prison's commissary black market now. Old habits.`,
      `You teach a personal finance class to the other inmates. You're the only one who finds it funny.`,
      `You wrote a memoir in your cell. The royalties go to your victims.`,
      `Your cellmate gave you his commissary money to invest. He keeps asking about returns.`]);
    out.push(["Prison",fate]);
  }

  // The investors
  if(s.peakInv>0){
    const rec=kind==="escaped"?Math.round(rand(5,25)):Math.round(rand(30,60));
    let t=s.peakInv<25?`Only ${num(s.peakInv)} people lost money, and most of them were friends. Thanksgiving is canceled indefinitely.`
      :`${num(s.peakInv)} people believed in ${FUND}. A court-appointed trustee spent nine years recovering ${rec}% of the ${fmt(s.peakOwed)} they thought they had.`;
    const vig=[`Edna Fisk, a retired schoolteacher, lost the house she paid off in 1998.`,
      `Carl Ruiz, a dentist, had put in his kids' college fund. He gives talks on warning signs now.`,
      `Walt Brennan, a fisherman, lost his late wife's life insurance money.`,
      `Maria Delgado had remortgaged her bakery to "double down." It's a vape shop now.`,
      `Ruth Abernathy, a nurse, had talked six coworkers into investing. Five still aren't speaking to her.`,
      `Sunil Mehta had invested his lottery winnings. He says he's "technically back where he started."`];
    if(flag(s,"A church group wants to invest")===0)vig.push(`Pastor Hollis's congregation lost the new-roof fund. That Sunday's sermon was about forgiveness. It was short.`);
    if(s.peakInv>=25)t+=" "+pick(vig);
    const mom=flag(s,"Your mom wants to invest");
    if(mom===0)t+=` Your mother lost her retirement savings. She still sends a birthday card every year. It's blank inside.`;
    else if(mom===1)t+=` Your mother, the one person you wouldn't take money from, told reporters you "had one decent bone."`;
    if(flag(s,"A retired prosecutor wants in")===0)t+=` The retired prosecutor who invested with you came out of retirement to lead the case.`;
    out.push(["The investors",t]);
  }

  // Your crew
  const FATE={
    cfo:{loyal:n=>`${n}, your CFO, never said a word to anyone. You still don't know if that was loyalty or fear.`,rat:n=>`${n}, your CFO, walked prosecutors through every fake spreadsheet. The jury called it "a guided tour."`},
    marketer:{loyal:n=>`${n} sells timeshares now. Same pitch, different product.`,rat:n=>`${n} testified that every slogan was your idea. Most of them were.`},
    lawyer:{loyal:n=>`${n} became a cable news legal analyst and discusses your case most nights.`,rat:n=>`${n} cut a deal, then got disbarred anyway.`},
    source:{loyal:n=>`${n} was quietly pushed off the force and opened a private security firm.`,rat:n=>`${n} had been wearing a wire for two months.`},
    pr:{loyal:n=>`${n} wrote a tell-all called "Spin Cycle." It's mostly about ${n}.`,rat:n=>`${n} sold your text messages to a tabloid for six figures.`},
    smuggler:{loyal:n=>kind==="escaped"?`${n} got you out, then vanished too. Every year you get a postcard with no return address.`:`${n} was never found. They used the escape route you paid for.`,rat:n=>`${n} sold your escape route to the FBI.`},
  };
  const crew=s.lts.map(l=>FATE[l.role][l.loyalty>=45?"loyal":"rat"](l.name));
  for(const l of s.flipped||[])crew.push(FATE[l.role].rat(l.name)+` That's how the feds knew where to look.`);
  for(const l of s.fired||[])if(Math.random()<0.5)crew.push(`${l.name}, whom you fired, gave the first interview. It ran four pages.`);
  if(crew.length)out.push(["Your crew",shuffle(crew).slice(0,3).join(" ")]);

  // Loose ends from choices you made
  const ends=[];
  if(flag(s,"A streaming producer wants to film you")===0)ends.push(`The documentary crew got an ending they didn't plan for. It won an Emmy.`);
  if(flag(s,"A journalist wants an interview")===0)ends.push(`The reporter who profiled you wrote a follow-up. It won a Pulitzer.`);
  if(flag(s,"A famous skeptic posts about you")!==undefined)ends.push(`The influencer who called you out now sells a course called "How I Spotted ${FUND}."`);
  if(flag(s,"A councilman hints at a donation")===0)ends.push(`The councilman who took your donation resigned "to spend more time with his family."`);
  if(s.bribes>0)ends.push(`The regulator who lost your file was indicted too. He blames you.`);
  if(flag(s,"A foreign businessman wants to park money")===0)ends.push(kind==="escaped"?`The foreign businessman's associates are also looking for you. They're more motivated than the FBI.`:`In prison, you got a fruit basket with no card. You didn't eat it.`);
  if(flag(s,"Old records in the basement")===0)ends.push(`The basement records were never recovered. The fire department still uses your alley for training.`);
  if(flag(s,"Your ex wants more alimony")===1)ends.push(`Your ex sold the movie rights to your marriage.`);
  if(flag(s,"A celebrity offers an endorsement")===0)ends.push(`The reality star who endorsed you claims they "were a victim too." They're doing a podcast about it.`);
  if(s.plantsAccepted>0)ends.push(s.plantsAccepted===1?`One investor you signed personally turned out to be working against you. You still remember the handshake.`:`${s.plantsAccepted} investors you signed personally turned out to be agents, reporters or regulators. You'd shaken every one of their hands.`);
  if(s.honestRejected>=5)ends.push(`You turned ${s.honestRejected} real investors away at your desk. They're the only ones who came out ahead.`);
  const L=s.life||{};
  if(L.car)ends.push(kind==="escaped"?`Your sports car was found at the airport in a no-parking zone, engine still warm.`:`Your sports car was auctioned. The winning bid came from one of your investors.`);
  if(L.penthouse)ends.push(`The harbor penthouse is an FBI evidence room now. The view is wasted on it.`);
  if(L.island)ends.push(kind==="escaped"?`You live on your island now. It has one bar, and you own it.`:`Your island was seized. A government bird researcher lives there now.`);
  if(s.parties)ends.push(`Photos from your yacht parties were shown to the jury as Exhibits 14 through ${14+s.parties*9}.`);
  if(s.rank>=4)ends.push(`For one glorious year, the Ledger called you "the Wolf of Port Ashford." They still do, but differently.`);
  if(flag(s,"A yacht is for sale")===0&&kind!=="escaped")ends.push(`Your yacht was auctioned off. A dentist bought it.`);
  if(ends.length)out.push(["Loose ends",shuffle(ends).slice(0,2).join(" ")]);

  // Years later
  const later=kind==="escaped"?[
    `Years later, you lost a third of your fortune to a crypto scheme run by a charming young man. You admired his work.`,
    `Once, in an airport in Lisbon, a former investor recognized you. She didn't call the police. She just stared until you left.`,
    `You tried starting a small, honest investment club in your new town. It didn't stay honest.`,
    `The documentary about you ends on an empty chair and the words "Whereabouts unknown."`,
    `You read the ${CITY} Ledger online every morning, looking for your name. It shows up less every year.`,
    ...(s.prep.villa?[]:[`You check the news every morning for new extradition treaties.`])]
   :[...(yrs<=20?[`You were released after ${Math.max(2,Math.round(yrs*0.7))} years for good behavior. On your first day out, someone handed you a flyer for a can't-miss investment.`]:[]),
    `You applied for a presidential pardon. It was denied in four minutes.`,
    `Business schools teach your case now. Students are graded on spotting the warning signs.`,
    `${CITY} renamed the street your office was on.`,
    `You still get letters from investors. Most are angry. One asks if you're taking new money.`];
  out.push(["Years later",pick(later)]);
  return out;
}

// ---------- Events ----------
const big=s=>Math.max(50e3,s.owed*0.03);
const lt=c=>c.lt;
const EVENTS=[
  {t:"A retired prosecutor wants in", b:s=>`She wants to invest ${fmt(big(s))}. She asks a lot of questions.`, ch:[
    {l:"Take her money", f:s=>{const a=big(s);s.cash+=a;s.owed+=a;s.investors++;s.heat+=7;return "Her check clears. She asks for a quick look at your books.";}},
    {l:"Politely decline", f:()=>"She invests somewhere else."}]},
  {t:"An early investor wants out", when:s=>s.investors>20, b:s=>`He wants all ${fmt(Math.max(10e3,s.owed*0.04))} back, today.`, ch:[
    {l:"Pay him in full", cost:s=>Math.max(10e3,s.owed*0.04), f:s=>{s.trust+=6;return "He tells everyone how smoothly it went.";}},
    {l:"Stall him", f:s=>{s.trust-=10;s.heat+=5;return "He starts posting about it online.";}}]},
  {t:"A journalist wants an interview", b:()=>"She's writing a profile on high-performing funds.", ch:[
    {l:"Turn on the charm", f:s=>{if(Math.random()<0.5){s.heat-=8;s.trust+=5;return "The profile is glowing.";}s.heat+=12;return "The article asks how your returns are possible.";}},
    {l:"Decline", f:s=>{s.heat+=4;return "\"Declined to comment\" looks bad in print.";}}]},
  {t:"Your accountant has questions", when:s=>s.week>5&&!has(s,"cfo"), b:()=>"He says the numbers don't add up.", ch:[
    {l:"Give him a big raise", cost:s=>Math.max(20e3,s.owed*0.005), f:()=>"He stops asking."},
    {l:"Fire him", f:s=>{s.heat+=10;return "He leaves with a box of files.";}}]},
  {t:"The market crashes", when:s=>s.market!=="bust", b:()=>"Every investor in the country is nervous.", ch:[
    {l:"Hold steady", f:s=>{s.market="bust";s.trust-=15;return "Your phones ring all week.";}},
    {l:"Pay a loyalty bonus", cost:s=>Math.max(10e3,s.owed*0.02), f:s=>{s.market="bust";s.trust+=6;s.heat+=2;return "Your fund seems crash-proof. Suspiciously so.";}}]},
  {t:"A celebrity offers an endorsement", b:s=>`A reality TV star will promote ${FUND} for ${fmt(Math.max(50e3,s.owed*0.02))}.`, ch:[
    {l:"Sign the deal", cost:s=>Math.max(50e3,s.owed*0.02), f:s=>{const d=Math.max(50e3,s.owed*0.02)*4*rand(0.6,1.6),n=Math.round(d/(5e3*(1+0.04*s.week)));s.cash+=d;s.owed+=d;s.investors+=n;s.heat+=6;return `${num(n)} fans invest ${fmt(d)}.`;}},
    {l:"Pass", f:()=>"They promote a crypto coin instead."}]},
  {t:"A letter from the regulator", when:s=>s.heat>20, b:()=>"A routine request for your filings.", ch:[
    {l:"Send forged documents", f:s=>{if(Math.random()<0.7){s.heat-=6;return "They file it away.";}s.heat+=20;return "Someone noticed the font changes halfway down the page.";}},
    {l:"Ignore it", f:s=>{s.heat+=10;return "A second letter arrives. It's less polite.";}}]},
  {t:"An angry thread goes viral", when:s=>s.investors>50, b:()=>"An investor's spouse is calling you a fraud online.", ch:[
    {l:"Pay them to delete it", cost:s=>Math.max(10e3,s.owed*0.003), f:s=>{s.heat-=2;return "The thread disappears.";}},
    {l:"Ignore it", f:s=>{s.trust-=8;s.heat+=5;return "A finance blog picks it up.";}}]},
  {t:"A rival scheme collapses", b:()=>"Another fund just imploded on the evening news.", ch:[
    {l:"Lie low", f:s=>{s.trust-=6;s.heat-=4;return "You cancel the yacht party.";}},
    {l:"Say \"we're different\"", f:s=>{s.trust+=6;s.heat+=6;return "Investors believe you. Nobody at the SEC does.";}}]},
  {t:"Your mom wants to invest", when:s=>!s.momDone, b:()=>"She wants to put in her retirement savings.", ch:[
    {l:"Take her $40k", f:s=>{s.momDone=true;s.cash+=40e3;s.owed+=40e3;s.investors++;s.trust+=3;return "\"Even his own mother invests.\"";}},
    {l:"Tell her the fund is full", f:s=>{s.momDone=true;return "She's offended. You feel something unfamiliar.";}}]},
  {t:"A church group wants to invest", when:s=>s.week>4, b:s=>`150 members want to pool ${fmt(Math.max(200e3,s.owed*0.05))}.`, ch:[
    {l:"Welcome them", f:s=>{const a=Math.max(200e3,s.owed*0.05);s.cash+=a;s.owed+=a;s.investors+=150;s.heat+=5;return "The pastor mentions you in his sermon.";}},
    {l:"Decline", f:()=>"They thank you for your honesty."}]},
  {t:"Your offshore bank flags transfers", when:s=>s.stash>50e3, b:()=>"Compliance wants to know where the money comes from.", ch:[
    {l:"Pay a \"compliance fee\"", cost:s=>s.stash*0.05, from:"stash", f:()=>"The question goes away."},
    {l:"Move it all to crypto", f:s=>{s.heat+=7;return "A blockchain analyst takes an interest.";}}]},
  {t:"A whistleblower threatens to talk", when:s=>s.investors>200, b:()=>"A junior employee figured it out.", ch:[
    {l:"Pay hush money", cost:s=>Math.max(25e3,s.stash*0.08), from:"stash", f:()=>"She signs an NDA and moves to Portugal."},
    {l:"Call her bluff", f:s=>{if(Math.random()<0.5)return "She doesn't talk. Yet.";s.heat+=22;return "She talks.";}}]},
  {t:"Tax audit", when:s=>s.week>6, b:()=>"The tax office wants to review last year.", ch:[
    {l:"Hire a slick accountant", cost:s=>Math.max(15e3,s.owed*0.004), f:s=>{s.heat-=2;return "The audit finds nothing it can understand.";}},
    {l:"Ignore it", f:s=>{s.heat+=12;return "The tax office shares notes with the regulator.";}}]},
  {t:"A streaming producer wants to film you", when:s=>s.investors>300, b:()=>"A docuseries about \"the genius behind the returns.\"", ch:[
    {l:"Roll the cameras", f:s=>{s.trust+=10;s.heat+=8;return "Episode one airs. Your smile is everywhere.";}},
    {l:"Stay off camera", f:()=>"They make one about a crypto bro instead."}]},
  {t:"An investor passed away", when:s=>s.investors>100, b:s=>`The heirs want the full ${fmt(Math.max(15e3,s.owed*0.01))} account paid out.`, ch:[
    {l:"Pay the heirs", cost:s=>Math.max(15e3,s.owed*0.01), f:s=>{s.trust+=3;return "They send a thank-you card.";}},
    {l:"Contest the will", f:s=>{s.heat+=8;s.trust-=4;return "Their lawyer subpoenas your statements.";}}]},
  {t:"A copycat is using your name", when:s=>s.week>6, b:()=>`Someone is selling \"${FUND} Gold\" accounts online.`, ch:[
    {l:"Sue them", cost:s=>Math.max(30e3,s.owed*0.005), f:s=>{s.trust+=4;return "The site goes dark. You look like the victim.";}},
    {l:"Ignore it", f:s=>{s.trust-=6;s.heat+=3;return "Their victims start calling your office.";}}]},
  {t:"Your bank is closing your account", when:s=>s.heat>30, b:()=>"\"We've reviewed our relationship.\" You have 10 days.", ch:[
    {l:"Open accounts abroad", cost:s=>Math.max(40e3,s.owed*0.01), f:s=>{s.heat+=2;return "A bank in a small island nation is happy to help.";}},
    {l:"Use cash couriers", f:s=>{const l=s.cash*0.05;s.cash-=l;s.heat+=6;return `One courier vanishes with ${fmt(l)}.`;}}]},
  {t:"A councilman hints at a donation", b:()=>"He says he could \"keep people off your back.\"", ch:[
    {l:"Donate generously", cost:s=>Math.max(50e3,s.owed*0.01), f:s=>{s.heat-=10;return "He shakes your hand at a ribbon cutting.";}},
    {l:"Refuse", f:s=>{s.heat+=4;return "He asks the city to look into your permits.";}}]},
  {t:"Your ex wants more alimony", when:s=>s.stash>30e3, b:()=>"They know about the offshore account.", ch:[
    {l:"Pay up", cost:s=>Math.max(20e3,s.stash*0.1), from:"stash", f:()=>"They buy a boat. You try not to think about it."},
    {l:"Refuse", f:s=>{if(Math.random()<0.4){s.heat+=15;return "They called a reporter.";}return "They grumble but stay quiet.";}}]},
  {t:"A famous skeptic posts about you", when:s=>s.investors>500, b:()=>"A finance influencer calls your returns \"mathematically impossible.\"", ch:[
    {l:"Threaten to sue", f:s=>{if(Math.random()<0.5){s.trust+=6;return "They delete the post and apologize.";}s.heat+=10;s.trust-=6;return "They post your cease-and-desist letter. It goes viral.";}},
    {l:"Ignore it", f:s=>{s.heat+=5;s.trust-=5;return "The replies are not kind.";}}]},
  {t:"Investors want an annual meeting", when:s=>s.investors>300, b:()=>"They'd like to see the fund's performance in person.", ch:[
    {l:"Throw a lavish conference", cost:s=>Math.max(40e3,s.owed*0.01), f:s=>{s.trust+=12;return "Open bar, fireworks, and a slideshow with no numbers on it.";}},
    {l:"Send a newsletter", f:s=>{s.trust-=4;return "Some investors call it \"vague.\"";}}]},
  {t:"Angry investors demand a meeting", when:s=>s.trust<45, b:()=>"Two hundred people want answers.", ch:[
    {l:"Promise higher returns", f:s=>{s.trust+=12;if(s.rate<RATES.length-1)s.rate++;s.heat+=3;return `You announce a new ${RATES[s.rate]*100}% weekly rate. Applause.`;}},
    {l:"Skip it", f:s=>{s.trust-=10;return "They hold the meeting without you.";}}]},
  {t:"A yacht is for sale", when:s=>s.stash>600e3&&!s.yacht, b:()=>"Sixty feet, fast, and fueled for open water.", ch:[
    {l:"Buy it", cost:()=>500e3, from:"stash", f:s=>{s.yacht=true;s.heat+=4;s.trust+=5;return "Escape readiness up. Your investors see the photos and assume business is great.";}},
    {l:"Pass", f:()=>"Some tech founder buys it."}]},
  {t:"Old records in the basement", when:s=>s.week>8, b:()=>"Boxes of real numbers. The shredder is broken.", ch:[
    {l:"Burn them tonight", f:s=>{if(Math.random()<0.7){s.heat-=8;return "Ashes in the alley. Nobody saw.";}s.heat+=18;return "A neighbor filmed you.";}},
    {l:"Leave them", f:()=>"They'll keep. Probably."}]},
  {t:"A foreign businessman wants to park money", b:s=>`He wants to invest ${fmt(Math.max(300e3,s.owed*0.08))} and asks no questions.`, ch:[
    {l:"Take it", f:s=>{const a=Math.max(300e3,s.owed*0.08);s.cash+=a;s.owed+=a;s.investors++;s.heat+=10;return "The wire comes from three countries at once.";}},
    {l:"Decline", f:()=>"He says he'll remember this."}]},
  {t:"A new investor asks odd questions", when:s=>s.heat>30, b:()=>"He wants to know exactly where the returns come from. He's sweating.", ch:[
    {l:"Take his $100k", f:s=>{s.cash+=100e3;s.owed+=100e3;s.investors++;if(Math.random()<0.5){s.heat+=15;return "He was wearing a wire.";}return "He was just nervous.";}},
    {l:"Refuse his money", f:()=>"He leaves. A car picks him up outside."}]},
  // Lieutenant events
  {t:"A lieutenant wants a raise", when:s=>s.lts.length>0, lt:true, b:(s,c)=>`${lt(c).name} wants 50% more salary.`, ch:[
    {l:"Give the raise", f:(s,c)=>{lt(c).raise*=1.5;lt(c).loyalty+=25;return `${lt(c).name} is happy.`;}},
    {l:"Refuse", f:(s,c)=>{lt(c).loyalty-=20;return `${lt(c).name} goes quiet.`;}}]},
  {t:"A lieutenant has been skimming from you", when:s=>s.lts.length>0, lt:true, b:(s,c)=>`${lt(c).name} took ${fmt(Math.max(10e3,s.owed*0.01))} from the fund.`, ch:[
    {l:"Fire them", f:(s,c)=>{s.cash-=Math.max(10e3,s.owed*0.01);s.lts=s.lts.filter(x=>x!==lt(c));s.fired.push(lt(c));s.heat+=6;return `${lt(c).name} leaves angry.`;}},
    {l:"Let it slide", f:(s,c)=>{s.cash-=Math.max(10e3,s.owed*0.01);lt(c).loyalty+=10;return `${lt(c).name} appreciates your understanding.`;}}]},
  {t:"A lieutenant got arrested", when:s=>s.lts.length>0, lt:true, b:(s,c)=>`${lt(c).name} was picked up for drunk driving.`, ch:[
    {l:"Post bail", cost:()=>25e3, f:(s,c)=>{lt(c).loyalty+=15;return `${lt(c).name} is grateful and hungover.`;}},
    {l:"Leave them in there", f:(s,c)=>{lt(c).loyalty-=30;s.heat+=4;return `${lt(c).name} had a long night to think.`;}}]},
  {t:"A lieutenant wants a cut", when:s=>s.lts.length>0&&s.stash>100e3, lt:true, b:(s,c)=>`${lt(c).name} knows about the stash and wants ${fmt(s.stash*0.05)}.`, ch:[
    {l:"Pay them", cost:s=>s.stash*0.05, from:"stash", f:(s,c)=>{lt(c).loyalty+=30;return `${lt(c).name} is all in now.`;}},
    {l:"Refuse", f:(s,c)=>{lt(c).loyalty-=25;return `${lt(c).name} says \"fine\" in a way you don't like.`;}}]},
];
let curEvent=null;
function showEvent(){
  const s=S, pool=EVENTS.filter(e=>!e.when||e.when(s));
  const e=pick(pool);
  curEvent={e,lt:e.lt?pick(s.lts):null};
  modal(`<div class="tag">Week ${s.week}</div><h3>${e.t}</h3><p>${e.b(s,curEvent)}</p><div class="btns">${e.ch.map((c,i)=>{
    const cost=c.cost?c.cost(s):0, from=c.from||"cash", ok=!cost||s[from]>=cost;
    return `<button class="big ${i===0?"go":"alt"}" data-act="choose" data-v="${i}" ${ok?"":"disabled"}>${c.l}${cost?` · ${fmt(cost)}${from==="stash"?" from stash":""}`:""}</button>`;}).join("")}</div>`);
}
function resolveEvent(i){
  const s=S, {e}=curEvent, c=e.ch[i], cost=c.cost?c.cost(s):0;
  if(cost)s[c.from||"cash"]-=cost;
  s.flags[e.t]=i;
  s.notes.push(`<b>${e.t}.</b> ${c.f(s,curEvent)}`);
  curEvent=null; closeModal(); raidCheck();
}

// ---------- UI plumbing ----------
function modal(html,cls){const c=document.getElementById("card");c.className="card"+(cls?" "+cls:"");c.innerHTML=html;document.getElementById("modal").hidden=false;c.scrollTop=0;}
function closeModal(){document.getElementById("modal").hidden=true;}
const modalOpen=()=>!document.getElementById("modal").hidden;
const ACT={
  rate:v=>{S.rate=+v;render();},
  mkt:v=>{S.mkt=+v;render();},
  cover:v=>{S.cover=v;render();},
  buy:v=>{const p=PREP.find(x=>x.id===v);if(S.prep[v]||S.stash<p.cost)return;S.stash-=p.cost;S.prep[v]=true;if(p.heat)S.heat=clamp(S.heat+p.heat,0,100);S.notes.push(`You bought: ${p.name}.`);render();showPlan();},
  hire:v=>{if(S.lts.length>=MAX_LTS||has(S,v))return;const c=S.candidates.find(x=>x.role===v);S.lts.push({role:v,name:c.name,raise:1,loyalty:Math.round(rand(55,80))});S.notes.push(`You hired ${c.name} as ${role(v).title}.`);render();showCrew();},
  fire:v=>{const l=S.lts.find(x=>x.role===v);if(!l)return;S.lts=S.lts.filter(x=>x!==l);S.fired.push(l);S.heat=clamp(S.heat+(l.loyalty<50?6:2),0,100);
    const used=new Set([...S.lts.map(x=>x.name),...S.candidates.map(x=>x.name)]);const nm=NAMES.find(n=>!used.has(n))||l.name;
    S.candidates=S.candidates.map(c=>c.role===v?{role:v,name:nm}:c);S.notes.push(`You fired ${l.name}. They took their keycard with them.`);render();showCrew();},
  bonus:v=>{const l=S.lts.find(x=>x.role===v);if(!l)return;const b=salary(S,l)*4;if(S.cash<b)return;S.cash-=b;l.loyalty=clamp(l.loyalty+20,0,100);S.notes.push(`${l.name} got a ${fmt(b)} bonus.`);render();showCrew();},
  paper:()=>showGazette(),
  report:()=>showReport(),
  crew:()=>showCrew(),
  plan:()=>showPlan(),
  help:()=>showHelp(),
  book:()=>showBook(),
  story:()=>showStory(),
  life:()=>showLife(),
  buylife:v=>buyLife(v),
  snd:()=>{setSound(!SND.on);render();},
  pitch:()=>showPitch(),
  dopitch:v=>doPitch(+v),
  speech:v=>doSpeech(+v),
  raidrun:()=>{stopRaid();attemptEscape(S.prep.jet?5:20,"raid");},
  raidgrab:()=>{const s=S;if(s.raidGrab)return;const amt=Math.max(0,Math.round(s.cash*0.5));s.cash-=amt;s.stash+=amt;s.raidGrab=true;s.raidT-=4;play("coins");raidModal();},
  raidgive:()=>{stopRaid();ending("caught",null,"surrender");},
  end:()=>{if(!modalOpen())startDesk();},
  dchk:v=>deskCheck(v),
  ddec:v=>deskDecide(v),
  dopt:v=>{const [f,o]=v.split(":").map(Number);S.desk.q[S.desk.i].fields[f].pick=o;renderDesk();},
  dclose:()=>{S.desk=null;endWeek();},
  run:()=>{if(!modalOpen())confirmRun();},
  flee:v=>attemptEscape(+v),
  caught:()=>ending("caught",null,"surrender"),
  close:()=>closeModal(),
  choose:v=>resolveEvent(+v),
  restart:()=>{S=newGame();shown=null;closeModal();render();window.scrollTo(0,0);showGazette();},
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;ACT[b.dataset.act]?.(b.dataset.v);});

if(typeof window.claude?.hot?.snapshot==="function")window.claude.hot.snapshot(()=>({S}));
const start=d=>{S=d&&d.S&&d.S.gazette?Object.assign(newGame(),d.S):newGame();if(S.desk)renderDesk();else render();if(!(d&&d.S))showGazette();};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
